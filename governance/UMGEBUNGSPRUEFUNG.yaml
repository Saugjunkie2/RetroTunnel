- id: UP-16
  gegenstand: Pull Request des Arbeitsbranches nach main
  methode: GitHub-API pull_request_read (get, get_check_runs); Systemhinweis der Cloud-Oberfläche
  ergebnis: >-
    Pull Request 1 (https://github.com/Saugjunkie2/RetroTunnel/pull/1) wurde am 2026-11-12T07:57:22Z über die
    Claude-Code-Oberfläche vom Konto Saugjunkie2 angelegt (nicht durch ein Werkzeug des Hauptarchitekten):
    Head claude/friendly-allen-4qg7kn, Base main @ 10f3fde, Zustand offen, kein Entwurf, mergeable_state "clean".
    Titel und Beschreibung stammen von der Oberfläche (englisch; sie beschreiben den Stand vom 2026-11-12 und
    sind keine Freigabeaussage). Der Pull Request ist KEIN Freigabegate: main ist ungeschützt (UP-05), dieselbe
    Identität könnte ihn mergen (UP-06). Der Hauptarchitekt merged ihn nicht (OP-B14) und ändert ihn nicht
    eigenmächtig; weitere Pushes auf den Arbeitsbranch aktualisieren ihn automatisch.
    Nachtrag 2026-11-13: Mit dem Fast-Forward von main (BM-0005, UP-09) führt GitHub den Pull Request seit
