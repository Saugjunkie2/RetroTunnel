    Weiter NICHT nachgewiesen bzw. ausgeschlossen: Wirkung während eines erschöpften Limits (bewirkt nichts),
    Verhalten nach dem Ende der Sitzung (nicht geprüft). Kein dauerhafter Selbststart wird zugesagt.
