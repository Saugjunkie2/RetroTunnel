    Sitzung zugestellt. Verarbeitet wurden sie erst um 07:11Z, nachdem das Nutzungslimit zurückgesetzt war –
    zeitgleich traf eine Nutzer-Nachricht ein. NACHGEWIESEN sind damit Auslösung und Zustellung; NICHT
    nachgewiesen ist, dass die Sitzung nach einem Limit ohne jede Nutzeraktion weiterarbeitet. Eine Auslösung
    kann ein erschöpftes Nutzungslimit nicht überwinden.
    Nachtrag 2026-11-13: Zwischen 2026-11-12 07:19Z und 2026-11-13 06:13Z wurden neun weitere Auslösungen
    zugestellt (einmalig 07:19Z; planmäßig 09:12Z, 12:16Z, 15:14Z, 18:12Z, 21:12Z am 12.11.; 00:12Z, 03:13Z,
    06:13Z am 13.11.; der Scheduler meldet für jede "SUCCEEDED" – das belegt nur die Zustellung). KEINE davon
    führte zu Arbeit: Der Arbeitsbranch blieb vom 2026-11-12 ca. 07:5xZ bis 2026-11-13 ca. 08:40Z unverändert
    (Commit 367a068). Fortgesetzt wurde erst, als am 2026-11-13 wieder eine Nutzer-Nachricht eintraf. Befund:
    In dieser Umgebung ist eine Wiederaufnahme OHNE Nutzeraktion NICHT nachgewiesen; die Beobachtung spricht
    dagegen, solange das Nutzungslimit erschöpft ist. Die geplante Aufgabe bleibt aktiv (sie schadet nicht und
    setzt die Arbeit fort, sobald Kontingent vorhanden ist), sie wird aber nicht als funktionierender
    Selbststart ausgegeben (Betreiberregeln §7.7, §10.7, §10.11).
  status: NACHGEWIESEN
