- id: UP-11
  gegenstand: Geplante Cloud-Aufgaben (Scheduler) / automatische Wiederaufnahme
  methode: Cloud-Werkzeuge list_triggers, create_trigger; Beobachtung der zugestellten Auslösungen (ReadNotifications)
