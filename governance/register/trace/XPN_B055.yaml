- id: TR-XB055-06
  zitat: '- ip_slot (INTEGER; SoT; NULL bis Provisionierung) <-- Deterministische Slot-ID als Single Source of Truth für IP-Zuordnung:
    aus ip_slot werden fixed_ip (IPv4) und fixed_ipv6 (IPv6) materialisiert (B061). - fixed_ipv6 (IPv6; materialisiert aus
    ip_slot, nur wenn v6_addr_policy=FIXED_SQL; sonst NULL) - fixed_ip (IPv4; materialisiert aus ip_slot; PPP-IP; RADIUS Framed-IP-Address;
    stabil pro Connection; keine Random-Leases) (B061)'
  art: ARCH_ENTSCHEIDUNG
  aussage: ip_slot ist die Quelle; fixed_ip und fixed_ipv6 sind materialisiert und stabil.
  einordnung: UEBERNOMMEN
  erfuellt_in:
