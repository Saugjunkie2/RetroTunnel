  zitat: '- restricted_reason (ENUM: QUOTA | EXPIRY | MANUAL | UNCLAIMED_OVERDUE, NULL wenn unrestricted) <-- Kernel/nftables
    Effective Reason (Performance/Debug). Wird deterministisch durch Apply/Reconcile gesetzt (B166), niemals user-supplied.
    - restricted_effective (BOOL/TINYINT; 1 wenn restricted_reason != NULL, sonst 0) <-- Performance-Flag: Fast Path ohne
    Join-heavy Evaluate. Wird nur vom Server gepflegt (B166), keine UI-Quelle.'
