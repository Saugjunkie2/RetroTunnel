- id: TR-XB064-17
  zitat: '- Reconcile muss drift reparieren (fixed_* neu materialisieren) ohne neue Slots zu verbrauchen.'
  art: FUNKTION
  aussage: Reparatur ohne neuen Slot.
  einordnung: ERSETZT
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_060_ADRESSVERGABE_UND_QUARANTAENE.txt#DER WAECHTER MELDET - ER AENDERT NICHTS.
  - 'base/BASE-070_SESSION_CORE/BASE-070_060_ADRESSVERGABE_UND_QUARANTAENE.txt#ADRESS-REPARATUR (Verwaltungshandlung, je Connection):'
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-61
  - base/BASE-070_SESSION_CORE/BASE-070_095_TESTS.txt#T-SC-79
  begruendung: 'Ersetzt (BF-0028): Der Lauf schreibt die Adressen nicht mehr selbst neu. Sachgrund: Eine Abweichung sagt nicht,
    welche Seite falsch ist (Slot, Pool-Zeile oder Adresse); das selbsttaetige Neuschreiben wuerde eine eben genutzte Adresse
    ohne Quarantaene freigeben, die Zieladresse ungeprueft belegen und bei flaechiger Abweichung (etwa einer falschen Pool-Zeile)
    alle Connections hart trennen. Erhalten bleibt: Jede Abweichung wird in jedem Lauf erkannt und als CRITICAL gemeldet;
    der Waechter verbraucht keinen Slot. Die Reparatur ist eine protokollierte Verwaltungshandlung je Connection ueber den
    Allokator; sie vergibt bewusst einen neuen Slot und stellt den alten in Quarantaene, damit keine genutzte Adresse vorzeitig
    zurueckkehrt (SZ-7).'
  zeilen:
  - 65
  - 65
