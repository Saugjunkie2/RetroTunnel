    Schreibstelle:'
  begruendung: 'Ersetzt (BF-0028). Das Ziel hat zwei Teile. KEIN UNNOETIGER SLOT-VERBRAUCH bleibt: Der Waechter aendert nichts
    und verbraucht keinen Slot; wiederholte Laeufe vergeben nichts. SELBSTTAETIGE HEILUNG entfaellt bewusst: Sie setzte voraus,
    dass der Slot die richtige Seite ist, und haette eine genutzte Adresse ohne Quarantaene freigegeben und bei flaechiger
    Abweichung alle Connections getrennt. An ihre Stelle treten die Meldung in jedem Lauf und die Adress-Reparatur als Verwaltungshandlung
    je Connection (ein neuer Slot, alter Slot in Quarantaene).'
