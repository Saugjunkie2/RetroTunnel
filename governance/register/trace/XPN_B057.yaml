- id: TR-XB057-05
  zitat: '- effective_value wird deterministisch gebildet als: 1) settings_connection (höchste Priorität) 2) settings_customer
    3) settings_global 4) falls kein Wert vorhanden/valide: Fallback gemäß fail_class (13.4)'
  art: FUNKTION
  aussage: 'Aufloesung: Connection vor Customer vor Global, sonst Rueckfall nach Fehlerklasse.'
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - 'base/BASE-070_SESSION_CORE/BASE-070_070_LAUFZEITMARKEN_BETRIEB_UND_BEOBACHTBARKEIT.txt#GELTUNGSBEREICH: Alle Keys dieses
    Moduls gelten nur global'
  - base/BASE-050_FIREWALL_CORE/BASE-050_070_RENDERN_LADEN_UND_VERLUSTSCHUTZ.txt#alle sind global
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_020_INTERFACE_UND_SERVER_CONFIG.txt#Scope ueberall GLOBAL
  - model/TRUTH_MODEL.txt#effective_source
  begruendung: Die Aufloesung leistet der Settings-Kern (TRUTH_MODEL, kuenftig BASE-090). Alle Keys der vier Module gelten
    nur global; die Reihenfolge ist fuer sie ohne Wirkung.
  zeilen:
  - 102
  - 106
- id: TR-XB057-06
  zitat: '- Konsequenz (MUST): Bei jeder neuen Key-/Policy-Ergänzung muss mindestens 1 Satz enthalten sein: „/diag zeigt effective_value
    + effective_source (inkl. Fallback/Reason), Resolution Order ist kanonisch.“'
  art: ARBEITSANWEISUNG
  aussage: 'Arbeitsregel: Jede Key-Ergaenzung nennt, dass die Diagnose wirksamen Wert und Herkunft zeigt und die Aufloesungsreihenfolge
    kanonisch ist.'
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_070_LAUFZEITMARKEN_BETRIEB_UND_BEOBACHTBARKEIT.txt#wirksamer
  - base/BASE-070_SESSION_CORE/BASE-070_080_OWNER_GRENZEN.txt#ANF-SC-08
  - model/TRUTH_MODEL.txt#effective_source
  begruendung: 'Historische Arbeitsanweisung; ihr sachlicher Kern ist zentral erfuellt: Die Module lesen ausschliesslich ueber
    die Aufloesung des Settings-Kerns (wirksamer Wert, Herkunft, Zustand des Keys); die Anzeige je Key ist Vertrag des Settings-Kerns
    (TRUTH_MODEL Abschnitt 4, BASE-090). Ein Satz je Key wird nicht wiederholt.'
  zeilen:
  - 115
  - 116
- id: TR-XB057-07
  zitat: 'A) Missing Behavior (MUST): - Darf niemals still „relaxen“. - Reaktion ist pro Key im Katalog normiert: a) FAIL_CLOSED:
    → Hard Fail (Fail-Closed) für die betroffene Operation / Funktion / Subsystem (Gate bleibt zu). b) FAIL_SAFE_HARDCAP (tighten-only):
    → Nutzung von failsafe_value_* (extrem restriktiver Notwert) + Observability-Pflicht (13.5).'
  art: SCHUTZZIEL
  aussage: 'Fehlender Wert: nie still lockern; je nach Klasse harter Abbruch oder Notwert mit Meldepflicht.'
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_070_LAUFZEITMARKEN_BETRIEB_UND_BEOBACHTBARKEIT.txt#KEIN STILLER DEFAULT (R-02, R-03)
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-59
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-62
  - 'base/BASE-050_FIREWALL_CORE/BASE-050_070_RENDERN_LADEN_UND_VERLUSTSCHUTZ.txt#FEHLERVERHALTEN: fuer ALLE Firewall-Settings
    STRICT'
  begruendung: Unveraendert.
  zeilen:
  - 142
  - 148
- id: TR-XB057-08
  zitat: 'B) Invalid Behavior (MUST): - Gilt als Policy Corruption (härter als Missing). - Reaktion ist pro Key im Katalog
    normiert: - Norm (MUST): • Operation fail-closed ODER (wenn fail_class=FAIL_SAFE_HARDCAP) failsafe_value + Flag “INVALID_OVERRIDDEN”
    a) FAIL_CLOSED: → Hard-Fail (Subsystem stoppt deterministisch). b) FAIL_SAFE_HARDCAP (tighten-only): → Notwert + Pflichtwarnung
    - Zusätzlich (MUST): • Invalid erzeugt immer ein Audit-Event (ratelimited) + Health Flag. • Admin-Health Warning (Panel)
    + /diag Warning + ratelimited Log-Event'
  art: SCHUTZZIEL
  aussage: 'Ungueltiger Wert gilt als Beschaedigung der Policy: haerter als fehlend, immer mit Audit-Ereignis und Gesundheitsmeldung.'
  einordnung: ANGEPASST
  erfuellt_in:
  - model/TRUTH_MODEL.txt#4.3) Missing vs Invalid (MUST)
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-59
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-62
  begruendung: Die Module behandeln fehlend und ungueltig gleich nach der Fehlerklasse und melden beides. Die Unterscheidung
    selbst, das Audit-Ereignis und die Gesundheitsmeldung sind Vertrag des Settings-Kerns (BASE-090); in BASE-040 ist die
    Meldung bei Nutzung eines LKG-Werts nicht festgelegt (BF-0041).
  zeilen:
  - 151
  - 162
- id: TR-XB057-09
  zitat: '- Wenn irgendein key im Zustand { MISSING, INVALID, FALLBACK_ACTIVE } ist: • Admin-Panel: Health Warnings (read-only)
    mit betroffenen Keys • /diag: warnings inkl. betroffene keys + effective_source (+ reason) • Logs: Event ist ratelimited
    (kein Log-DoS) - Es darf keinen “stillen Notbetrieb” geben. - Fallback darf nie unbemerkt bleiben.'
  art: SCHUTZZIEL
  aussage: 'Kein stiller Notbetrieb: Jeder Rueckfall ist im Panel, in der Diagnose und im Log sichtbar.'
  einordnung: UEBERNOMMEN
  erfuellt_in:
