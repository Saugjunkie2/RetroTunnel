  begruendung: Fuer endgueltige Ursachen und fuer den Datenbankausfall unveraendert (sofort beenden). Bei voruebergehenden
    Ursachen im Kernelzugriff bleibt die Sitzung gesperrt und wird nach hoechstens vpn_connect_gate_ttl_seconds beendet; die
    Schutzwirkung haengt nicht am Beenden, weil bis zur Freigabe aller Verkehr verworfen wird.
  zeilen:
