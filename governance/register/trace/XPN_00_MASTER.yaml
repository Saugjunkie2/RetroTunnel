- id: TR-XMASTER-06
  zitat: '- IP-Lifecycle / Quarantäne / Reconcile (Thema C / B064): Soft-Delete (disabled_at/revoked_at), QUARANTINE_DAYS,
    random ip_slot Allocation (CSPRNG) + Drift-Guards; verhindert monotone IP-Reihenfolgen ohne Lease-Chaos.'
  art: FUNKTION
  aussage: Entzogene Adressen gehen in Quarantaene; Slots werden zufaellig vergeben; Abweichungen werden erkannt.
