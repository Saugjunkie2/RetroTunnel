- id: TR-XMASTER-13
  zitat: '- Vor jedem SQL/Apply Zugriff wird ein Connect-Pending Gate aktiviert: connect_pending_v4 (deny-all forward).'
  art: SCHUTZZIEL
  aussage: Vor jedem SQL- und Herstellungszugriff ist die Sitzung gesperrt (kein Fenster ohne Policy).
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-050_FIREWALL_CORE/BASE-050_090_INVARIANTEN.txt#FW-19
  - base/BASE-050_FIREWALL_CORE/BASE-050_090_INVARIANTEN.txt#FW-18
