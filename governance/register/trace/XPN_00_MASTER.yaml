  zitat: '- Bei Apply-Failure (z.B. SQL down / TEMPFAIL) gilt fail-closed: Session wird deterministisch beendet.'
  art: SCHUTZZIEL
  aussage: Scheitert die Herstellung, wird die Sitzung beendet (Fail-Closed).
  einordnung: ANGEPASST
  erfuellt_in:
