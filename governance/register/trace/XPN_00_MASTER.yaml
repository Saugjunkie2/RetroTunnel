- id: TR-XMASTER-05
  zitat: '- Dualstack Slot-Mapping (Thema I / B061): pro vpn_connection gibt es genau einen ip_slot als SoT; daraus werden
    fixed_ip (v4) und fixed_ipv6 (v6) materialisiert (keine Random-Leases). v6_addr_policy: LEGACY=NONE, ADMIN/MODERN=FIXED_SQL
    (SQL-first, reconcile-bar).'
  art: ARCH_ENTSCHEIDUNG
  aussage: Je Connection genau ein ip_slot als Quelle; IPv4- und IPv6-Adresse sind daraus materialisiert, keine Zufalls-Leases.
  einordnung: UEBERNOMMEN
