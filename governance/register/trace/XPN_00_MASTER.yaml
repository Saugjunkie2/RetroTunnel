- id: TR-XMASTER-18
  zitat: '- HARD CUT (MUST, sofortige Wirkung auch für ESTABLISHED): Beim Übergang FULL -> RESTRICTED gilt Reihenfolge: (1)
    Enforce (nft/tc aktiv) -> (2) Conntrack-Flush (bidirektional, src+dst) für Client-IP.'
  art: SCHUTZZIEL
  aussage: 'Hard-Cut beim Uebergang in den eingeschraenkten Zustand: erst durchsetzen, dann conntrack beidseitig loeschen.'
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-32
