  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-19
  begruendung: 'Schutzziel unveraendert, Mechanik tunnelspezifisch (DEC-FW-08): Eine L2TP-Sitzung ist ohne Freigabe-Element
    von Beginn an gesperrt - es braucht keinen Eintrag, der vor dem SQL-Zugriff gesetzt werden muesste; fuer WireGuard steht
    das Gate vor dem Peer-Eintrag. Gesperrt wird in input UND forward (Vorgaenger: nur forward).'
  zeilen:
  - 56
  - 56
