- id: TR-RSMC-12
  zitat: 'POLICY-EVALUATOR-VERTRAG: Der Policy-Evaluator (BASE-80) sammelt ALLE sechs Quellen: 1. customer_paused_at IS NOT
    NULL → RESTRICT_CUSTOMER_PAUSED aktiv 2. admin_manual_restricted_at IS NOT NULL → RESTRICT_ADMIN_MANUAL aktiv 3. customer_id
    IS NULL AND NOW()>grace → RESTRICT_UNCLAIMED_OVERDUE aktiv 4. Quota erschöpft → RESTRICT_QUOTA_EXHAUSTED aktiv 5. Expiry
    abgelaufen → RESTRICT_EXPIRY_PASSED aktiv 6. Plan-Limit überschritten → RESTRICT_PLAN_LIMIT_EXCEEDED aktiv'
  art: FUNKTION
  aussage: 'Vertrag des Policy-Evaluators: alle sechs Quellen.'
  einordnung: UEBERNOMMEN
