  begruendung: 'Wie D002 7.3 (TR-RD002-19), in voller Reichweite: Status, Grund und Frist folgen bei JEDEM Rollenwechsel dem Bewertungskern in der Transaktion des Wechsels - zwingend bei Zielrolle ADMIN (R-08) und bei Rollen ohne Plan (BASE-010 INV-41); im Uebrigen, damit der Status nicht bis zum naechsten Lauf hinter der Rolle zurueckbleibt. Gefunden in der Bestaetigungspruefung (F-G81-B-06), Reichweite berichtigt nach F-G82-B-03.'
