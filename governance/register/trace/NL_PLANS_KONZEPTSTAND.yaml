  zitat: MANUAL (Not-Aus) gilt ebenfalls fuer alle inkl. ADMIN.
  art: SCHUTZZIEL
  aussage: Auch eine ADMIN-Connection muss im Notfall sofort stillgelegt werden koennen.
  einordnung: ANGEPASST
  erfuellt_in:
  - 02_ASSUMPTIONS_AND_RULES.txt#R-08
  begruendung: Der Vorgaenger legt den Not-Aus fuer ADMIN als manuelle Restriction an. Die Regel R-08 des Betreibers schliesst
    jede Restriction einer ADMIN-Connection aus, auch die manuelle; der Not-Aus fuer eine kompromittierte ADMIN-Connection
    ist dort DISABLE (IMMEDIATE). Das Schutzziel bleibt erhalten, das Mittel ist ein anderes. Der uebrige Inhalt der Stelle
    (ADMIN ist vom Netz- und Sicherheitskern nicht ausgenommen) ist mit diesem Record nicht zurueckverfolgt.
