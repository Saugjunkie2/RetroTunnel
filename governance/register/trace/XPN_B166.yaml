- id: TR-XB166-07
  zitat: '- Safety-Net: Reconcile repariert Drift spätestens innerhalb <= 5 Minuten.'
  art: PARAMETER
  aussage: Abgleich alle 5 Minuten.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-24
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_070_HELFER_BETRIEB_UND_BEOBACHTBARKEIT.txt#vpn_reconcile_interval_seconds            300        60..300    belegt
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-36
  begruendung: 'Der Takt ist ein Setting mit Vorschlag und Notwert 300 s. Seit DEC-PA-24 (2026-11-17) ist er auf hoechstens 300 s begrenzt, und der Lauf ist nie spaeter als der Takt faellig. ANGEPASST seit der Gegenpruefung (F-G80-B-14): Die Zusage ''<= 5 Minuten'' gilt im ungestoerten Betrieb (Datenbank lesbar, Zeitgeber aktiv, Laufdauer unter dem Takt); behoben ist eine Abweichung nach Takt plus Laufdauer, eine Ueberschreitung wird gemeldet. Zuvor: Obergrenze 3600 s bis 2026-11-17 (Befund BF-0085).'
  zeilen:
  - 27
  - 27
