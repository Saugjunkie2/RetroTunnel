- id: TR-XB050-07
  zitat: '- WICHTIG (Stabilität): Simultaneous-Use=1 (radacct) ist nicht atomar gegen Parallel-Logins/Race. - Zusätzlich MUSS
    ein atomarer Session-Lock als Guard/Mutex (KEIN Lifecycle) umgesetzt werden (siehe B056 + B168/B169 + B310). - Ziel: Parallel-Login-Race
    deterministisch verhindern (check radacct -> ACCEPT Fenster); Truth bleibt radacct (stop_time IS NULL).'
  art: SCHUTZZIEL
  aussage: Die Protokollpruefung ist nicht atomar; zusaetzlich schuetzt eine atomare Sperre (Mutex, kein Lebenszyklus).
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-16
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-17
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-20
  - base/BASE-070_SESSION_CORE/BASE-070_095_TESTS.txt#T-SC-23
  begruendung: 'Unveraendert als Mutex. Angepasst: ''Wahrheit bleibt radacct'' gilt seit D004 nicht mehr - die Wahrheit ist
    die Laufzeit; die Sperre ist weiterhin kein Zustand und dient keiner Aussage ueber Nutzung.'
  zeilen:
