- id: TR-XB050-06
  zitat: '- Enforcement erfolgt in FreeRADIUS über Simultaneous-Use=1 (radacct-basiert): - Wenn bereits eine aktive Session
    existiert (radacct stop_time IS NULL), MUSS ein weiterer Login für denselben subaccount_login abgelehnt werden.'
  art: FUNKTION
  aussage: Durchgesetzt wird ueber die Pruefung auf eine offene Protokollzeile bei der Anmeldung.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-15
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-14
