- id: TR-XB050-21
  zitat: '- Durable Accounting-Spool (Quota Usage Deltas): - Collector liest pppX rx/tx counters, berechnet deltas und schreibt
    sie batchweise in SQL. - Bei DB-Down werden deltas in /var/lib/vpn-accounting/ gespult (persistentes Journal) und später
    nachgetragen. - Intervall: 300s (konfigurierbar).'
  art: FUNKTION
  aussage: Dauerhafter Spool fuer Verbrauchsdifferenzen bei Datenbankausfall, Takt 300 s.
  einordnung: ERSETZT
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-39
  - base/BASE-070_SESSION_CORE/BASE-070_050_VERBRAUCHSBUCHUNG_UND_QUOTA_PERIODE.txt#8) DATENBANKSTOERUNG
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_060_DB_DOWN_GRACE_UND_FAIL_CLOSED.txt#SNAPSHOT (PreDown-Hook in awg0.conf, Werkzeug
    vpn-wg-snapshot)
  begruendung: 'Ersetzt: Ein eigener Differenz-Spool entfaellt, weil die Zaehler kumulativ sind. L2TP: Der AAA-Dienst nimmt
    Abrechnungsmeldungen ohne Datenbank an und puffert sie dauerhaft. WireGuard: Kernelzaehler laufen weiter, vor einem Stop
    sichert ein Snapshot. Schutzziel (kein Verlust durch die Stoerung allein) unveraendert.'
  zeilen:
  - 116
  - 119
