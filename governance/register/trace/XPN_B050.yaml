  - base/BASE-070_SESSION_CORE/BASE-070_095_TESTS.txt#T-SC-17
  begruendung: 'Angepasst durch D004: Abgelehnt wird, wenn die Sonde eine lebende Sitzung meldet ODER radacct eine offene
    Zeile zeigt; die Laufzeit ist die Wahrheit, radacct das Protokoll.'
  zeilen:
  - 79
