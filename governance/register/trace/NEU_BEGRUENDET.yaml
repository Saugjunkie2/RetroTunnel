# Invarianten ohne historische Quelle: neu begruendete Anforderungen dieses Auftrags
# (Rueckrichtung der Rueckverfolgung, Betreiberregeln §3.5). Jede Begruendung nennt Schutzziel und Anlass.
schema: neu_begruendet/1
eintraege:
- id: WT-03
  modul: BASE-040
  begruendung: >-
    Trennung Beobachten/Buchen (Controller) von Veraendern (WG-Treiber) ist Voraussetzung dafuer, dass Gate,
    Policy und Peer-Eintrag eine einzige serialisierte Sequenz bilden (R-11). Ein schreibender Controller waere
    ein zweiter Writer fuer Kernel-Zustand.
- id: WT-11
  modul: BASE-040
  begruendung: >-
    Faellt awg0 weg (Grace-Stop, Wartung), verschwinden die Pool-Routen; ohne Rueckfallroute liefen Pakete an
    Tunneladressen ueber die Default-Route ins WAN (Adress- und Datenleck). In keiner Quelle behandelt.
- id: WT-12
  modul: BASE-040
  begruendung: >-
    Rollen-Pools werden von L2TP und WireGuard gemeinsam genutzt. Routen aus AllowedIPs (awg-quick-Standard) waeren
    tausende Hostrouten ohne Nutzen und wuerden bei dynamisch gepflegten Peers nicht konsistent entstehen;
    feste Pool-Routen sind deterministisch.
- id: WT-23
  modul: BASE-040
  begruendung: >-
    Die Baseline fuehrt den PresharedKey als optional. Als Pflicht eingefuehrt: zusaetzliche symmetrische
    Schutzschicht ohne Betriebsnachteil; vermeidet zwei Peer-Klassen in Render, Treiber und Tests.
- id: WT-45
  modul: BASE-040
  begruendung: >-
    Grace-Ueberwachung, Admission-Waechter und Buchung haengen am Controller. Ohne Kopplung liefe WireGuard bei
    Controller-Ausfall unbegrenzt ohne Fail-Closed-Mechanik (Luecke im Hybrid-Modell aus BASE-020_040).
- id: WT-50
  modul: BASE-040
  begruendung: >-
    S1/S2/H1-H4 muessen auf beiden Seiten gleich sein; eine ungeplante Aenderung sperrt alle Clients aus.
    Wirkungsklassen und Wartungsverfahren machen diese Kopplung zu einem pruefbaren Vertrag.
- id: FW-03
  modul: BASE-050
  begruendung: >-
    Determinismus und STRICT-Verhalten des Renderers sind Voraussetzung dafuer, dass "Generation" als Identitaet des
    Regelwerks taugt (Verlust-/Drifterkennung FW-11) und dass ein fehlendes Setting nie zu einem stillen Standardwert
    im Sicherheitskern fuehrt (DP-02, DP-04). Fuer das Regelwerk in keiner Quelle festgelegt.
- id: FW-08
  modul: BASE-050
  begruendung: >-
    Der Changelog v2.1.14 nennt einen "Fallback" nur als Stichwort; der Wortlaut ist nicht ueberliefert (BF-0010).
    Neu festgelegt: Ladekette mit letztem funktionierendem Regelwerk und Notfall-Riegel, damit "kein Regelwerk" nie
    "offener Host" bedeutet und der Betreiber den Fehler aus der Ferne beheben kann.
- id: FW-12
  modul: BASE-050
  begruendung: >-
    Die Firewall muss gerade dann laden und sich pruefen koennen, wenn die Datenbank ausgefallen ist (Systemstart
    vor MariaDB, DB-Stoerung, Wiederherstellung). Eine SQL-Abhaengigkeit des Ladewegs wuerde Fail-Closed in einen
    Totalausfall ohne Verwaltungszugang verwandeln.
- id: FW-21
  modul: BASE-050
  begruendung: >-
    Die Quellen machen den Hard-Cut vom Erfolg eines conntrack-Flushes bzw. vom Beenden der Sitzung durch den
    Tunnel-Dienst abhaengig. Neu: Entzug der Freigabe bzw. Setzen des Gates wirkt im Kernel ab dem naechsten Paket,
    auch wenn der Dienst die Verbindung nicht beendet (Sperre unabhaengig von der Kooperation des Daemons).
- id: FW-24
  modul: BASE-050
  begruendung: >-
    Die Quellen nennen das Sperr-Set nur dem Namen nach. Neu festgelegt, damit eine Sperre nie dauerhaft haengen
    bleibt (Ablauf Pflicht) und nie den Betreiber oder die eigenen Dienste aussperrt (verbotene Adressen, keine
    Wirkung an lo und am Notzugang).
- id: FW-38
  modul: BASE-050
  begruendung: >-
    Deterministischer Hard-Cut verlangt, dass eine TCP-Verbindung nach geloeschtem Zustand nicht von selbst wieder
    aufgenommen wird; ungueltige Pakete wuerden zudem NAT umgehen. Der Verzicht auf conntrack-Helfer und auf die
    Verfolgung von ESP verkleinert Angriffsflaeche und Tabellenlast. In keiner Quelle geregelt.
- id: FW-39
  modul: BASE-050
  begruendung: >-
    Uebernimmt die in BASE-040 (WT-11) neu begruendete Anforderung als Pflicht der Plattform und ergaenzt Pruefung
    und Wiederherstellung: Ohne Rueckfallroute liefen Pakete an gerade nicht verbundene Tunneladressen ueber die
    Standardroute ins WAN.
- id: FW-42
  modul: BASE-050
  begruendung: >-
    Der Notzugang ist ein Weg zu root und im Normalbetrieb ungenutzt. Jede Nutzung muss deshalb sichtbar werden -
    auch und gerade bei ausgefallener Datenbank, dem typischen Einsatzfall.
- id: FW-47
  modul: BASE-050
  begruendung: >-
    Owner-Grenze (PATTERN-01, R-15): Entscheidungen ueber Connections gehoeren BASE-010/BASE-080/MOD-005. Eine
    Firewall, die aus Zaehlern selbst sperrt oder Set-Inhalte korrigiert, waere ein zweiter Schreiber mit eigener
    Wahrheit.
- id: FW-48
  modul: BASE-050
  begruendung: >-
    Zustandswechsel der Firewall (Aktivierung, Siegel, Notfall-Riegel, Verlust) sind sicherheitsrelevante Ereignisse.
    Ohne Protokoll mit Generation liessen sich Zaehlerstaende nicht deuten und Vorfaelle nicht nachvollziehen.
- id: SC-11
  modul: BASE-070
  begruendung: >-
    Die oeffentliche Adresse eines Kunden ist ein personenbezogenes Datum. Der Vorgaenger fuehrte sie als Diagnosefeld
    der Sitzungstabelle und zusaetzlich im Laufzeit-Mapping, ohne Aufbewahrungsregel und ohne Leserechte. Schutzziel
    Datensparsamkeit (SZ-10): genau ein Speicherort, eigene kurze Aufbewahrung getrennt von der Ereigniszeile, Einsicht
    nur fuer ADMIN. Der Zusatz "nur einfuegen" sichert die Nachvollziehbarkeit des Protokolls.
- id: SC-18
  modul: BASE-070
  begruendung: >-
    Sperren, Quarantaene und Periodengrenzen werden von mehreren Prozessen ausgewertet (AAA-Dienst, Controller,
    Werkzeuge, Laeufe). Rechnete jeder mit der eigenen Uhr, koennte ein Uhrensprung im Aufrufer eine Sperre mit einer
    Laufzeit von Sekunden vorzeitig verfallen lassen oder verlaengern und ein Periodenwechsel doppelt oder nie faellig
    werden. Eine einzige Vergleichsuhr (Datenbankzeit) schliesst das aus. In keiner Quelle behandelt.
- id: SC-57
  modul: BASE-070
  begruendung: >-
    Maschinenzustand (Generationen, Zeitpunkte letzter erfolgreicher Laeufe) hatte im Bestand keine Heimat; mehrere
    Quellen nennen solche Marken, ohne ihren Ort festzulegen. In den Settings wuerden sie die Regel unterlaufen, dass
    Settings Betreiberwerte mit Katalog und Fehlklasse sind (R-03). Eine eigene Tabelle mit genau einem Schreiber je
    Marke macht den Zustand lesbar fuer das Panel, ohne dass er als Stellgroesse missverstanden wird.
- id: SC-58
  modul: BASE-070
  begruendung: >-
    Statusdateien liegen lesbar unter /run, Ereignismeldungen verlassen den Server ueber Meldewege (E-Mail).
    Anmeldenamen und oeffentliche Adressen in solchen Ausgaben waeren eine unnoetige Verbreitung personenbezogener
    Daten (SZ-10) und erleichterten das Ausspaehen gueltiger Anmeldenamen. connection_ref genuegt zur Zuordnung
    durch den Betreiber. Erweitert R-12 (keine Geheimnisse in Protokollen) um personenbezogene Daten.
- id: SC-63
  modul: BASE-070
  begruendung: >-
    Die Pruefung von Status und Kennwort liegt im Anmeldepfad VOR der Sperre. Ein Umbau (Kennwortwechsel, Sperrung,
    Rollenwechsel) kann vollstaendig ablaufen, waehrend eine Anmeldung in der On-Demand-Pruefung steht; die Sitzung
    entstuende danach unter einem abgeloesten Kennwort bzw. Stand (Schutzziel: keine Nutzung unter entzogener
    Berechtigung). Erst der Vergleich des Zulassungsstands UNTER der Sperre schliesst das Fenster. Anlass: Befund
    BF-0015 der unabhaengigen Gegenpruefung. In keiner Quelle behandelt.
- id: SC-64
  modul: BASE-070
  begruendung: >-
    Der vorab hinterlegte Ende-Grund ist EIN Feld fuer mehrere Setzer (Hard-Cut, Bereinigung, Neustart-Erkennung).
    Ohne Regeln fuer Vorrang, Verfall und Ruecknahme traegt das unveraenderliche Ereignisprotokoll falsche Gruende
    und Endzeiten - etwa JANITOR_GHOST fuer eine regulaer beendete Sitzung oder ADMIN_HARDCUT fuer ein Ende, das
    Stunden nach einem gescheiterten Hard-Cut eintrat (Schutzziel Nachvollziehbarkeit, SZ-10). Anlass: Befunde
    BF-0017, BF-0019 und BF-0023.
- id: SC-65
  modul: BASE-070
  begruendung: >-
    Eine Sitzung im Auf- oder Abbau ist weder lebend noch tot. Ohne Frist kann sie unbegrenzt haengen und die
    Connection aussperren (SZ-3); ohne eigene Antwort der Sonde sagt der AAA-Dienst zu, waehrend der Daemon die neue
    Sitzung abweist, und hinterlaesst eine Sperre bis zu ihrem Ablauf. Anlass: Befund BF-0021.
- id: SC-66
  modul: BASE-070
  begruendung: >-
    Die Datenbankzeit ist die Systemzeit. Periodenwechsel, Rueckgabe von Adressen und physisches Loeschen haengen
    allein an ihr und sind nicht umkehrbar: Eine vorgehende Uhr setzte den Verbrauch aller Connections zurueck und
    gaebe Adressen vor Ablauf der Quarantaene frei (SZ-6, SZ-7); eine zurueckgestellte Uhr liesse Sperren ueber ihre
    Frist hinaus wirken (SZ-3). SC-18 (eine Vergleichsuhr) schuetzt nur vor abweichenden Uhren der Aufrufer, nicht
    vor einer falschen Systemzeit. Anlass: Befunde BF-0020 und BF-0030.
- id: SC-67
  modul: BASE-070
  begruendung: >-
    Laeuft eine Datenbankverbindung in Ortszeit, sind Fristen ueber die Zeitumstellung um eine Stunde falsch und die
    Zeitspalten von radacct nicht mit NOW() vergleichbar; die Uebergabe von Periodengrenzen zwischen Anwendung und
    Datenbank waere mehrdeutig. Weltzeit als Sitzungszeitzone aller beteiligten Verbindungen macht jeden Vergleich
    eindeutig. Anlass: Befund BF-0034 und ein Hinweis des Pruefers zu Sperren ueber die Zeitumstellung.
- id: SC-68
  modul: BASE-070
  begruendung: >-
    Mehrere Zusagen dieses Moduls (exakte Freimenge des Allokators, Nachpruefung unter der Sperre, Vergleich beim
    Buchen) gelten nur, wenn eine Anweisung den zuletzt bestaetigten Stand sieht. Mit einem beim Transaktionsbeginn
    eingefrorenen Lesestand - der Vorgabe der Datenbank - saehe der Allokator Vergaben nicht, die waehrend des
    Wartens auf die Pool-Sperre bestaetigt wurden. Die Leseeigenschaft und der Umgang mit wiederholbaren Abbruechen
    waren unbenannte Annahmen. Anlass: Befund BF-0029.
- id: SC-69
  modul: BASE-070
  begruendung: >-
    Die Marke der gesichteten radacct-Zeilen entscheidet, welche Zeilen der Abgleich je betrachtet. Kennungen werden
    in Vergabereihenfolge sichtbar, nicht in Bestaetigungsreihenfolge: Eine Zeile kann unter die Marke geraten, ohne
    je gesehen worden zu sein, und ihr Verbrauch waere still verloren (SZ-5). Ein Sicherheitsnetz, das an der
    Tatsache "geschlossen, aber ohne Buchungsstand" ansetzt, faengt jeden solchen Fall unabhaengig von seiner Ursache.
    Anlass: Befund BF-0027 (kritisch).
- id: SC-70
  modul: BASE-070
  begruendung: >-
    Laeufe dieses Moduls koennen Sitzungen beenden und Adressen zurueckgeben. Eine grosse Zahl gleichartiger Faelle in
    einem Lauf zeigt in aller Regel einen Fehler der Lesung, der Uhr oder der Daten, nicht viele Einzelfaelle; ein
    selbsttaetiger Eingriff machte daraus einen Massenabwurf (SZ-9). Der Schutz haengt nicht am Eingriff:
    Unberechtigter Verkehr bleibt ueber die Policy gesperrt, Adressen bleiben laenger gesperrt. Anlass: Befunde
    BF-0028 und BF-0030 sowie der eigene Befund BF-0042.
- id: SC-71
  modul: BASE-070
  begruendung: >-
    Solange Protokollzeile und Laufzeitsitzung nur ueber den Anmeldenamen verbunden sind, ist bei zwei offenen Zeilen
    einer Connection unentscheidbar, welche zur lebenden Sitzung gehoert, und ein Neustart des Daemons nur ueber einen
    Uhrzeitvergleich erkennbar. Sitzungskennung und Instanzkennung machen beide Zuordnungen eindeutig; der benannte
    Rueckfall haelt das Modul arbeitsfaehig, wenn der Adapter sie nicht liefern kann. Anlass: Befunde BF-0014 und
    BF-0018.
- id: WT-54
  modul: BASE-040
  begruendung: >-
    Der Treiber bucht vor dem Entfernen eines Peers den letzten Verbrauch, der Controller bucht Snapshots nach. Solange
    das eigene, nicht naeher bestimmte Schreibwege sind, fehlt ihnen der Vergleich gegen gleichzeitige Bucher und die
    Tagesreihe; die Schreiberliste von BASE-070 fuehrte sie nicht. Eine Implementierung fuer alle Bucher schliesst
    beides aus (SZ-5: Verbrauch genau einmal). Der Snapshot vor dem Entfernen haelt den Zaehlerstand fest, wenn die
    Buchung nicht gelingt - mit dem Peer verschwaende er sonst. Anlass: Befunde BF-0026 (kritisch) und BF-0033.
- id: WT-55
  modul: BASE-040
  begruendung: >-
    Der Buchungslauf schreibt alle Connections und die Tagesreihe in einer Transaktion, und ein gescheiterter Lauf
    zaehlte als Datenbankfehler zur Stoerzeit des Grace-Automaten. Ein dauerhafter Fehler allein der
    Statistik-Tabelle haette so jede Buchung verhindert und am Ende awg0 fuer alle Kunden gestoppt (SZ-9: kein
    Massenabwurf). Die Trennung der Fehlerklassen begrenzt die Wirkung auf das, was wirklich gestoert ist. Anlass:
    Befund BF-0031.
- id: WT-56
  modul: BASE-040
  begruendung: >-
    Der Periodenwechsel verlangt unmittelbar davor eine Buchung (Stichtagsbuchung), damit Verkehr der alten Periode
    nicht der neuen zugerechnet wird (Anforderung ANF-SC-09 von BASE-070). Dass Laeufe des Controllers nicht
    ueberlappen, war bisher unbenannt vorausgesetzt; mit der Anforderung auf Signal wird es zur Regel.
- id: SC-72
  modul: BASE-070
  begruendung: >-
    Schutzziel SZ-6 (Abrechnungsmonat nachvollziehbar). Anlass: Nachpruefung der Behebung, Teil B, N-07 - die
    "Berichtigung einer Periode in der Zukunft" war als Betreiberhandlung genannt, aber nirgends definiert, stand
    nicht in der abschliessenden Schreiberliste und haette am UNIQUE-Schluessel des Periodenprotokolls den
    naechsten Wechsel blockiert. Die Regel legt den Vorgang (SV-6b) und die Folgenummer im Protokoll fest. In
    keiner historischen Quelle behandelt.
- id: SC-73
  modul: BASE-070
  begruendung: >-
    Schutzziele SZ-7 (Adressen nicht vorzeitig wiedervergeben) und der Grundsatz "Verweigern geht vor". Anlass:
    Nachpruefung der Behebung, Teil B, N-11 und B-05 Ablauf (b) - die Fehlerklasse FAIL_CLOSED der
    Quarantaenefrist liess den Widerruf und damit die Sperrung im Tombstone-Schreibvorgang scheitern, und eine
    bei nachgehender, unbestaetigter Uhr geschriebene Frist war nach der Berichtigung der Uhr sofort abgelaufen.
    Die offene Frist trennt den Entzug (wirkt immer) von der Rueckgabe (nur mit gesetzter, bei bestaetigter Zeit
    geschriebener Frist). In keiner historischen Quelle behandelt.
- id: WT-57
  modul: BASE-040
  begruendung: >-
    Schutzziel "Verbrauch genau einmal" (BASE-070 SZ-5). Anlass: Nachpruefung der Behebung, Teil B, N-01 - der
    mit BF-0026 eingefuehrte Einzel-Snapshot der Schlussbuchung trug keine Epoche, hatte zwei moegliche
    Nachbucher und konnte ueber den Reset-Zweig mit dem ganzen Zaehlerstand ein zweites Mal gebucht werden,
    sobald ein anderer Bucher den Cursor ueber ihn hinaus fortgeschrieben oder der Treiber ihn genullt hatte.
    Die Regel legt Epochenbindung, die Rechnung ohne Reset-Zweig und den einen Nachbucher fest. In keiner
    historischen Quelle behandelt (der Vorgaenger kannte nur den Gesamt-Snapshot beim Interface-Stop).
