# Invarianten ohne historische Quelle: neu begruendete Anforderungen dieses Auftrags
# (Rueckrichtung der Rueckverfolgung, Betreiberregeln §3.5). Jede Begruendung nennt Schutzziel und Anlass.
schema: neu_begruendet/1
eintraege:
- id: WT-03
  modul: BASE-040
  begruendung: >-
    Trennung Beobachten/Buchen (Controller) von Veraendern (WG-Treiber) ist Voraussetzung dafuer, dass Gate,
    Policy und Peer-Eintrag eine einzige serialisierte Sequenz bilden (R-11). Ein schreibender Controller waere
    ein zweiter Writer fuer Kernel-Zustand.
- id: WT-11
  modul: BASE-040
  begruendung: >-
    Faellt awg0 weg (Grace-Stop, Wartung), verschwinden die Pool-Routen; ohne Rueckfallroute liefen Pakete an
    Tunneladressen ueber die Default-Route ins WAN (Adress- und Datenleck). In keiner Quelle behandelt.
- id: WT-12
  modul: BASE-040
  begruendung: >-
    Rollen-Pools werden von L2TP und WireGuard gemeinsam genutzt. Routen aus AllowedIPs (awg-quick-Standard) waeren
    tausende Hostrouten ohne Nutzen und wuerden bei dynamisch gepflegten Peers nicht konsistent entstehen;
    feste Pool-Routen sind deterministisch.
- id: WT-23
  modul: BASE-040
  begruendung: >-
    Die Baseline fuehrt den PresharedKey als optional. Als Pflicht eingefuehrt: zusaetzliche symmetrische
    Schutzschicht ohne Betriebsnachteil; vermeidet zwei Peer-Klassen in Render, Treiber und Tests.
- id: WT-45
  modul: BASE-040
  begruendung: >-
    Grace-Ueberwachung, Admission-Waechter und Buchung haengen am Controller. Ohne Kopplung liefe WireGuard bei
    Controller-Ausfall unbegrenzt ohne Fail-Closed-Mechanik (Luecke im Hybrid-Modell aus BASE-020_040).
- id: WT-50
  modul: BASE-040
  begruendung: >-
    S1/S2/H1-H4 muessen auf beiden Seiten gleich sein; eine ungeplante Aenderung sperrt alle Clients aus.
    Wirkungsklassen und Wartungsverfahren machen diese Kopplung zu einem pruefbaren Vertrag.
- id: FW-03
  modul: BASE-050
  begruendung: >-
    Determinismus und STRICT-Verhalten des Renderers sind Voraussetzung dafuer, dass "Generation" als Identitaet des
    Regelwerks taugt (Verlust-/Drifterkennung FW-11) und dass ein fehlendes Setting nie zu einem stillen Standardwert
    im Sicherheitskern fuehrt (DP-02, DP-04). Fuer das Regelwerk in keiner Quelle festgelegt.
- id: FW-08
  modul: BASE-050
  begruendung: >-
    Der Changelog v2.1.14 nennt einen "Fallback" nur als Stichwort; der Wortlaut ist nicht ueberliefert (BF-0010).
    Neu festgelegt: Ladekette mit letztem funktionierendem Regelwerk und Notfall-Riegel, damit "kein Regelwerk" nie
    "offener Host" bedeutet und der Betreiber den Fehler aus der Ferne beheben kann.
- id: FW-12
  modul: BASE-050
  begruendung: >-
    Die Firewall muss gerade dann laden und sich pruefen koennen, wenn die Datenbank ausgefallen ist (Systemstart
    vor MariaDB, DB-Stoerung, Wiederherstellung). Eine SQL-Abhaengigkeit des Ladewegs wuerde Fail-Closed in einen
    Totalausfall ohne Verwaltungszugang verwandeln.
- id: FW-21
  modul: BASE-050
  begruendung: >-
    Die Quellen machen den Hard-Cut vom Erfolg eines conntrack-Flushes bzw. vom Beenden der Sitzung durch den
    Tunnel-Dienst abhaengig. Neu: Entzug der Freigabe bzw. Setzen des Gates wirkt im Kernel ab dem naechsten Paket,
    auch wenn der Dienst die Verbindung nicht beendet (Sperre unabhaengig von der Kooperation des Daemons).
- id: FW-24
  modul: BASE-050
  begruendung: >-
    Die Quellen nennen das Sperr-Set nur dem Namen nach. Neu festgelegt, damit eine Sperre nie dauerhaft haengen
    bleibt (Ablauf Pflicht) und nie den Betreiber oder die eigenen Dienste aussperrt (verbotene Adressen, keine
    Wirkung an lo und am Notzugang).
- id: FW-38
  modul: BASE-050
  begruendung: >-
    Deterministischer Hard-Cut verlangt, dass eine TCP-Verbindung nach geloeschtem Zustand nicht von selbst wieder
    aufgenommen wird; ungueltige Pakete wuerden zudem NAT umgehen. Der Verzicht auf conntrack-Helfer und auf die
    Verfolgung von ESP verkleinert Angriffsflaeche und Tabellenlast. In keiner Quelle geregelt.
- id: FW-39
  modul: BASE-050
  begruendung: >-
    Uebernimmt die in BASE-040 (WT-11) neu begruendete Anforderung als Pflicht der Plattform und ergaenzt Pruefung
    und Wiederherstellung: Ohne Rueckfallroute liefen Pakete an gerade nicht verbundene Tunneladressen ueber die
    Standardroute ins WAN.
- id: FW-42
  modul: BASE-050
  begruendung: >-
    Der Notzugang ist ein Weg zu root und im Normalbetrieb ungenutzt. Jede Nutzung muss deshalb sichtbar werden -
    auch und gerade bei ausgefallener Datenbank, dem typischen Einsatzfall.
- id: FW-47
  modul: BASE-050
  begruendung: >-
    Owner-Grenze (PATTERN-01, R-15): Entscheidungen ueber Connections gehoeren BASE-010/BASE-080/MOD-005. Eine
    Firewall, die aus Zaehlern selbst sperrt oder Set-Inhalte korrigiert, waere ein zweiter Schreiber mit eigener
    Wahrheit.
- id: FW-48
  modul: BASE-050
  begruendung: >-
    Zustandswechsel der Firewall (Aktivierung, Siegel, Notfall-Riegel, Verlust) sind sicherheitsrelevante Ereignisse.
    Ohne Protokoll mit Generation liessen sich Zaehlerstaende nicht deuten und Vorfaelle nicht nachvollziehen.
