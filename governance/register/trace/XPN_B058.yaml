  - 65
- id: TR-XB058-09
  zitat: '- Negative Test: Manipulation an fixed_ip oder Protocol ändert derived_policy NICHT.'
  art: TEST
  aussage: 'Negativtest: Eine Manipulation an Adresse oder Protokoll aendert die abgeleitete Policy nicht.'
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-070_SESSION_CORE/BASE-070_095_TESTS.txt#T-SC-79
  - base/BASE-050_FIREWALL_CORE/BASE-050_095_TESTS.txt#T-FW-43
  - base/BASE-070_SESSION_CORE/BASE-070_090_INVARIANTEN.txt#SC-61
  begruendung: 'Angepasst: Eine verfaelschte Adresse wird in jedem Bereinigungslauf erkannt und als CRITICAL gemeldet; eine
    Adresse ausserhalb des ADMIN-Pools erreicht die Verwaltungsdienste auch mit Set-Eintrag nicht. GRENZE: Bis zur Reparatur
    gelten im Kernel die Pool-Regeln der vorgefundenen Adresse (Zaehler, ADMIN-Faktor der Grenzen); ob die Herstellung eine
    Connection mit Adress-Drift als nicht auswertbar behandeln muss, ist offen - Befund BF-0086.'
  zeilen:
  - 66
  - 66
- id: TR-XB058-10
  zitat: '- Verify (email_verified_at) ist ein App-Layer Gate für Panel-User. - Verify hat keine direkte Auswirkung auf AAA/VPN-AuthN.
    - AAA/VPN-AuthN wird über: - vpn_connection status (PREPROVISIONED/CLAIMED/DISABLED) - restricted_effective / reason (Kernel
    Policy) - RADIUS/SQL SoT (B055/B056) entschieden.'
  art: SCHUTZZIEL
  aussage: Die E-Mail-Bestaetigung ist ein Gate der Anwendung; ueber VPN-Zugang entscheiden Status der Connection und SQL.
  einordnung: UEBERNOMMEN
