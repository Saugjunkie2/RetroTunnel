  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-62
  begruendung: 'ANGEPASST: Ein fehlendes oder ungueltiges Setting macht die Lage nur dann nicht auswertbar (Art SETTINGS_DRIFT
