  - 48
- id: TR-NB052-11
  zitat: '- vpn-policy-apply/Reconcile muss deterministisch abbrechen: - TEMPFAIL_SQL (Exit 2) / "keine Änderung möglich".'
  art: FUNKTION
  aussage: Herstellung und Abgleich brechen mit TEMPFAIL_SQL ab.
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-21
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-22
  begruendung: Ergebnis 2 laesst den Kernel unveraendert.
  zeilen:
  - 49
  - 50
- id: TR-NB052-12
  zitat: '- darf NUR bei DB_OK durch Reconcile/Policy-Apply gesetzt werden.'
  art: FUNKTION
  aussage: Eingeschraenkt wird nur bei vollstaendig ableitbarer Lage.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#ABWEICHUNG von B052 Abschnitt 3
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_020_BEWERTUNG_UND_LIFECYCLE_LAUF.txt#Z-1  UNBEKANNT OEFFNET NICHTS UND FINALISIERT
    NICHTS
  begruendung: 'Fuer die Herstellung uebernommen (nicht auswertbare Zeile: nichts umschalten). Fuer die Bewertung angepasst:
    Ist die Bedingung EINES Grundes nicht lesbar, ein ANDERER Grund aber bekannt aktiv, steht der Zielstatus fest und der
    Bewerter schraenkt ein. Das ist kein Ersatzzustand bei unklarer Lage, den B052 ausschliesst; ohne die Anpassung bliebe
    eine Verwaltungs-Einschraenkung wirkungslos, solange eine fremde Auskunft ausfaellt.'
  zeilen:
  - 57
  - 57
- id: TR-NB052-13
  zitat: '- bei DB_DOWN/DB_UNKNOWN ist eine aktive Umschaltung auf RESTRICT NICHT zulässig.'
  art: SCHUTZZIEL
  aussage: Im Stoerfall kein aktives Umschalten auf eingeschraenkt.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_030_HERSTELLUNG_EINZELZIEL.txt#N-2  NICHTS UMSCHALTEN
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-25
  begruendung: 'Fuer die HERSTELLUNG unveraendert (Regel N-2): Es gibt keinen Wechsel nach eingeschraenkt als Ersatz. ANGEPASST
    fuer den BEWERTER: Steht ein Grund bekannt aktiv fest, fuehrt er den Eintritt in RESTRICTED auch dann aus, wenn eine
    andere Auskunft nicht lesbar ist (BASE-080_020 Regel Z-1 a und b; Abweichung ausgewiesen in DEC-PA-22).'
  zeilen:
  - 58
  - 58
