  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_030_HERSTELLUNG_EINZELZIEL.txt#ENUM_DRIFT        Wert ausserhalb des Wertevorrats
  begruendung: Uebernommen als Fall der dritten Einordnung UNBESTIMMT.
  zeilen:
  - 70
  - 70
- id: TR-NB052-05
  zitat: '- INVARIANT_BROKEN: State/Mapping ist logisch unmöglich oder nicht deterministisch rekonstruierbar.'
  art: DEFINITION
  aussage: 'Ausloeser: logisch unmoeglicher Zustand.'
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_030_PEER_LIFECYCLE.txt#zugelassener Status ohne Tunneladresse;
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_030_HERSTELLUNG_EINZELZIEL.txt#INVARIANT_BROKEN  widerspruechliche Felder oder Zuordnung
  begruendung: 'Uebernommen: Widerspruechliche Felder ohne eindeutige Aussage (zugelassener Status ohne Adresse, ohne oder
    mit mehreren Auth-Rows) ergeben UNBESTIMMT. Abgrenzung: Sperrung und Widerruf sind eindeutige Aussagen und fuehren immer
    zum Entfernen des Peers (Verweigern geht vor).'
  zeilen:
  - 71
  - 71
- id: TR-NB052-06
  zitat: '- Keine Neuinterpretation von Policy in Outage-Zuständen: Keine automatischen "Fallback-Allows" und keine Blind-Umschaltung
    auf RESTRICT.'
  art: SCHUTZZIEL
  aussage: Im Stoerfall keine Ersatzfreigabe und kein blindes Umschalten auf eingeschraenkt.
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-18
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-22
  begruendung: Ohne lesbare Datenbank aendert die Herstellung nichts; es gibt keinen Ersatzzustand.
  zeilen:
  - 18
  - 18
- id: TR-NB052-07
  zitat: '- DB_UNKNOWN hat EXAKT DIESELBEN OUTCOMES wie DB_DOWN.'
  art: SCHUTZZIEL
  aussage: Nicht eindeutig ableitbarer Zustand hat dieselben Folgen wie ein Ausfall.
  einordnung: ANGEPASST
  erfuellt_in:
