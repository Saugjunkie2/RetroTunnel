  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-25
  begruendung: 'Uebernommen je Connection statt fuer das ganze System: Ein Fehler in einer Zeile sperrt nicht alle.'
  zeilen:
