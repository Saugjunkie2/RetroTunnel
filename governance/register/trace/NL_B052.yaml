schema: trace/1
quelle: NL
datei: nachlieferung/B052_DB_OUTAGE_CONTRACT.txt
einheit: AP-K080
vollstaendigkeit: TEILWEISE (Verhalten von Herstellung, Abgleich und Bewertung bei Ausfall und bei nicht eindeutig
  ableitbarem Zustand - BASE-040 und BASE-080; offen sind Abschnitt 2 zur Anmeldung (BASE-020) und Abschnitt 5 zu
  Ereignisformat und Diagnose, soweit sie MOD-007 und BASE-110 betreffen)
records:
- id: TR-NB052-01
  zitat: '- Kernregel: DB_UNKNOWN verhält sich EXAKT wie DB_DOWN (Enforcement identisch); Unterschiede sind nur Observability
    (Reason/Detail) und Diagnose-Text.'
  art: SCHUTZZIEL
  aussage: Nicht eindeutig ableitbarer Zustand wird wie ein Datenbankausfall behandelt.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_030_PEER_LIFECYCLE.txt#UNBESTIMMT HEISST EINFRIEREN
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_090_INVARIANTEN.txt#WT-53
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-22
  begruendung: 'Uebernommen fuer den WireGuard-Pfad: Ergibt die Zeile einer Connection kein eindeutiges SOLL, bleibt ihr Peer,
    wie er ist. Im Bestand fehlte die Regel bis zum Abgleich mit der Nachlieferung (BF-0040); die Soll-Funktion kannte nur
    PRESENT und ABSENT und haette solche Peers entfernt. ANGEPASST seit der Gegenpruefung von BASE-080 (F-G80-B-18): Die
    HERSTELLUNG verhaelt sich wie bei einem Datenbankausfall; der BEWERTER fuehrt bei nicht lesbarer Auskunft den Eintritt
    in RESTRICTED aus einem bekannt aktiven Grund trotzdem aus (BASE-080_020 Regel Z-1; Abweichung ausgewiesen in DEC-PA-22).'
  zeilen:
  - 17
  - 17
- id: TR-NB052-02
  zitat: '- Bestehende Sessions bleiben enforced, wie der Kernel gerade steht (FREEZE).'
  art: SCHUTZZIEL
  aussage: Bestand bleibt, wie der Kernel steht.
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - 'base/BASE-040_TUNNEL_WIREGUARD/BASE-040_030_PEER_LIFECYCLE.txt#- NICHTS UMSCHALTEN: ein vorhandener Peer wird weder entfernt
    noch'
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_090_INVARIANTEN.txt#WT-53
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-22
  begruendung: 'Uebernommen: Ein vorhandener Peer wird weder entfernt noch ersetzt; sein Policy-Zustand bleibt.'
  zeilen:
  - 51
  - 51
- id: TR-NB052-03
  zitat: '- Non-Escalation: In diesem Zustand darf KEIN Privileg-Widening passieren (kein Allow-All, keine Policy-Verbreiterung).'
  art: SCHUTZZIEL
  aussage: Keine Ausweitung im unklaren Zustand.
  einordnung: UEBERNOMMEN
  erfuellt_in:
  - 'base/BASE-040_TUNNEL_WIREGUARD/BASE-040_030_PEER_LIFECYCLE.txt#- NICHTS OEFFNEN: kein Peer wird eingetragen, kein Gate
    geloest.'
  - base/BASE-040_TUNNEL_WIREGUARD/BASE-040_090_INVARIANTEN.txt#WT-53
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-25
  begruendung: 'Uebernommen: kein Peer-Eintrag, kein Loesen des Gates.'
  zeilen:
  - 52
  - 52
- id: TR-NB052-04
  zitat: '- ENUM_DRIFT: Required Enum/Status/Policy-Key enthält Wert außerhalb des Kanons (Glossar/Schema verletzt).'
