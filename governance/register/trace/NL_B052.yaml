- id: TR-NB052-08
  zitat: '- bei TEMPFAIL_SQL/ERROR/TIMEOUT bleibt das Gate aktiv und ip-up terminiert die PPP-Session (Fail-Closed).'
  art: FUNKTION
  aussage: Scheitert die Herstellung beim Verbindungsaufbau, bleibt gesperrt und die Sitzung endet.
  einordnung: ANGEPASST
  erfuellt_in:
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-07
  - base/BASE-080_POLICY_APPLY_CORE/BASE-080_090_INVARIANTEN.txt#PA-30
  begruendung: L2TP ist bis zur Freigabe vollstaendig gesperrt (Positivliste statt Gate). Die Sitzung endet bei nicht lesbarer
    Datenbank sofort, bei voruebergehender Ursache im Kernelzugriff nach begrenzter Frist.
  zeilen:
  - 41
  - 41
- id: TR-NB052-09
  zitat: '- Es gibt KEIN Fallback auf Portal/Restricted/Walled-Garden für neue Sessions im Outage/Unknown.'
  art: SCHUTZZIEL
  aussage: Kein Ausweichen auf Portal oder eingeschraenkten Zustand fuer neue Sitzungen.
  einordnung: UEBERNOMMEN
  erfuellt_in:
