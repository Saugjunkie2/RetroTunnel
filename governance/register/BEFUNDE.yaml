  titel: 'Zaehlung je Bedingung: sechs Luecken der Pruefregeln und 70 Teilbedingungen ohne Test'
  beschreibung: >-
    Die erstmals eingerichtete Zaehlung je Teilbedingung (qa/abdeckung.py; Fix-Intention zum zweiten Hinweis in BF-0111) fand
    am Stand fae9285: 70 von 357 Teilbedingungen vor Fehlermeldungen von qa/pruefe_register.py konnten wirkungslos gemacht
    werden, ohne dass ein Test rot wurde. Beim Durchgehen zeigten sich sechs Luecken der Regeln selbst, jede mit einem
    Experiment an einer Kopie belegt (das Werkzeug meldete "OK"): (1) Fehlte governance/register/MODULPRUEFUNG.yaml oder war
    sie leer, entfiel die ganze Modulpruefung ohne eigene Meldung (aufgefallen waere es nur ueber die Entwurfsangabe zu
    BASE-080 im README). (2) Ohne index_datei in der Konfiguration eines Moduls entfielen dessen Indexpruefungen. (3) Ohne
    die Kopfzeile VERSION im Changelog entfiel der Abgleich der README-Version, auch bei abweichender Version. (4) Das Fehlen
    von MARCOS_ARBEITSWEISE.txt blieb unbemerkt, das von 03_CHANGELOG.txt fiel nur ueber einen Verweis in STATUS.yaml auf.
    (5) Unter governance/pruefungen/ pruefte die Regel nur Dateien mit der Endung .md, waehrend REVIEW_STANDARD 10.4 "jede
    andere Datei im Ordner" zusicherte; ebenso sahen die Inventarregeln unter decisions/ nur *.txt und unter modules/ nur
    Verzeichnisse, und das README war vom Inventar ausgenommen. (6) Als Erfuellungsort einer Rueckverfolgung genuegte ein
    vorhandenes Verzeichnis. Dazu brach das Werkzeug ab, statt zu melden, wenn STATUS.verweise keine Zuordnung war.
