    Auth-Split (BASE-010_030; BASE-000 K-08/K-09) steht subaccount_login in vpn_connection_l2tp_ipsec_auth, nicht in vpn_connections; dem dort genannten
    Datenbankzugang fehlt ausserdem das Leserecht auf die Auth-Tabelle. Nach dem Text, wie er steht, kann der Hook keine Sitzung zuordnen. Der Abschnitt gehoert zur
    Kopplung an radacct und vpn_sessions, die D004 und BASE-070 DEC-SC-05 ersetzen: ANF-SC-03 d (Hooks ohne eigene Lesung der Datenbank; BASE-030_050 neu fassen) und
    BASE-080 ANF-PA-04 (die Connection bestimmt vpn-policy-apply) verlangen die Neufassung. Bis dahin steht der Fehler im massgeblichen Text.
