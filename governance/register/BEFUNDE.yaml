- id: BF-0040
  klasse: SCHWERWIEGEND
  status: IN_ARBEIT
  titel: 'Regel für nicht eindeutig ableitbaren Zustand (B052: DB_UNKNOWN) fehlt im Bestand; BASE-040 entfernt statt einzufrieren'
  beschreibung: 'B052 verlangt für einen Zustand, der trotz erreichbarer Datenbank nicht eindeutig ableitbar ist (Wert außerhalb
    des Vorrats, logisch unmöglicher Zustand, fehlendes Pflicht-Setting), dasselbe Verhalten wie beim Datenbankausfall:
    neue Zulassung verweigern, Bestehendes nicht umschalten. TRUTH_MODEL 2.3 und 4.2 haben davon nur die Wirkung auf einzelne
    Settings übernommen. Die Soll-Funktion des WG-Treibers (BASE-040_030 Abschnitt 1) ordnet jede nicht erfüllte Bedingung
    als ABSENT ein und entfernt den Peer.'
  fundstellen:
  - NL:nachlieferung/B052_DB_OUTAGE_CONTRACT.txt:27
  - NL:nachlieferung/B052_DB_OUTAGE_CONTRACT.txt:68
  - RT:model/TRUTH_MODEL.txt:159
  - ZIEL:base/BASE-040_TUNNEL_WIREGUARD/BASE-040_030_PEER_LIFECYCLE.txt:19@e05ae8e
  beleg: B052 vollständig gelesen (2026-11-13); TRUTH_MODEL Abschnitte 2.3, 4.2, 4.3 und BASE-040_030 Abschnitt 1 am Text
    verglichen.
  auswirkung: Ein Datenfehler in einer Zeile oder ein Versionsunterschied zwischen Schema und Werkzeug führt bei WireGuard
    zum Entfernen von Peers statt zum Stehenlassen; für L2TP war das Verhalten nicht festgelegt.
  massnahme: 'BASE-080 DEC-PA-22 und BASE-080_030 Abschnitt 9 (geschrieben): nichts öffnen, nichts umschalten, melden -
    je Connection. In BASE-040_030 eine dritte Einordnung ''nicht auswertbar'' ergänzen (Peer bleibt unverändert, kein Eintrag),
    Invariante und Test nachziehen.'
  arbeitspaket: AP-K080
  entdeckt_in: AP-Q03 (Abgleich der Nachlieferung)
- id: BF-0041
  klasse: SCHWERWIEGEND
  status: OFFEN
  titel: Settings-Rückfall in BASE-070 als lokale Regel statt nach der Fehlerklasse des Katalogs
  beschreibung: 'BASE-070_070 Abschnitt 3 legt fest: bei fehlendem oder ungültigem Key gilt der zuletzt gültig gelesene
    Wert, sonst der Vorschlagswert als ''eingebauter Rückfallwert''. TRUTH_MODEL SF-02 verbietet lokale Rückfälle außer
    dem im Katalog geführten Notwert; Abschnitt 4.3 regelt das Verhalten je Key über die Fehlerklasse (FAIL_CLOSED oder
    FAIL_SAFE_HARDCAP mit failsafe_value). B345 G3 und die SQL-first-Entwürfe (Entscheidungsmatrix, DEC-SQLF-010 dort noch
    offen) behandeln dieselbe Frage.'
  fundstellen:
  - ZIEL:base/BASE-070_SESSION_CORE/BASE-070_070_LAUFZEITMARKEN_BETRIEB_UND_BEOBACHTBARKEIT.txt:133@e05ae8e
  - RT:model/TRUTH_MODEL.txt:176
  - RT:model/TRUTH_MODEL.txt:229
  - NL:nachlieferung/B345_WRITE_PATH_MATRIX_CONTRACT.txt:47
  - NL:nachlieferung/entwuerfe/sql-first/SQL-FIRST v1 — DECISION MATRIX.txt:61
  beleg: TRUTH_MODEL Abschnitte 3 und 4, B345 und die Entscheidungsmatrix der SQL-first-Entwürfe gelesen; Text von BASE-070_070
    Abschnitt 3 und SC-59 verglichen.
  auswirkung: Zwei Rückfallwege im Konzept (Katalog und Modul); der 'zuletzt gültige Wert' ist im Kanon nicht vorgesehen.
    Praktische Folgen gering, weil alle betroffenen Keys Betriebsparameter sind und keine Zulassung an ihnen hängt.
  massnahme: 'BASE-070_070 Abschnitt 3 und SC-59 auf die Begriffe von TRUTH_MODEL umstellen: Auflösung über den Settings-Kern,
    je Key Fehlerklasse FAIL_SAFE_HARDCAP mit dem Vorschlagswert als Notwert im Katalog (Antrag an BASE-090); kein eigener
    Rückfallweg. Gleiches in BASE-040 und BASE-050 prüfen.'
  arbeitspaket: AP-K070
  entdeckt_in: AP-Q03 (Abgleich der Nachlieferung)
