# Befundregister. klasse: KRITISCH | SCHWERWIEGEND | GERINGFUEGIG | VERBESSERUNG
# status: OFFEN | IN_ARBEIT | BEHOBEN | AUFGELOEST_DURCH_AUFTRAGSHIERARCHIE | ZURUECKGEWIESEN
#   BEHOBEN verlangt behoben_in (Datei oder Commit) UND nachpruefung (Bericht eines unabhaengigen Pruefers unter
#   governance/pruefungen/); bis dahin bleibt ein eingearbeiteter Befund IN_ARBEIT (REVIEW_STANDARD 10.3).
#   ZURUECKGEWIESEN verlangt zurueckweisung: {begruendung, bestaetigt_durch: <Bericht>}.
#   AUFGELOEST_DURCH_AUFTRAGSHIERARCHIE verlangt aufgeloest_durch (Betreiberregel OP-... oder Mitteilung BM-nnnn).
# pruefer_einstufung: Einstufung im Bericht - KRITISCH | HOCH | MITTEL | NIEDRIG | HINWEIS (Skala der Pruefer) oder
#   BLOCKER | MAJOR | MINOR | NICE (Skala des REVIEW_STANDARD); Zuordnung zur klasse: REVIEW_STANDARD 10.2.
# Befunde werden nie geloescht; Kennungen sind lueckenlos.
# sperrt_auch: weitere Pakete, die nicht [DONE] werden duerfen, solange dieser Befund offen ist (ausser arbeitspaket).
# Herabstufungen nur mit Begründung im Feld "herabstufung" und Bestätigung durch gesonderte Prüfung.
# fundstellen: "RT:<pfad>:<zeile>" bezieht sich auf den RetroTunnel-Baseline-Commit, "XPN:<pfad>[:<zeile>]" auf den XPN-Baseline-Commit.
#              "NL:<pfad>[:<zeile>]" auf die Nachlieferung am Liefer-Commit, "ZIEL:<pfad>[:<zeile>]@<commit>" auf eine Datei des
#              Arbeitsstands am genannten Commit (für Befunde an Dateien, die es am Baseline-Commit noch nicht gab).
