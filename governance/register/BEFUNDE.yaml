    F-NK3-B-04: Die Auslegung von BM-0021 sagt 'EINMAL', ohne zu regeln, was gilt, wenn die Bestaetigung ausbleibt oder der Durchgang einen Fehler findet.
    F-NK3-B-05: Der Wortlaut von BM-0019 ist im Register an einer Stelle veraendert (Modellbezeichnung ausgelassen), gestuetzt auf eine nirgends als eigene Entscheidung gefuehrte Konvention.
    Hinweise: F-NK3-B-06 KR-05 (a) nennt vier statt sechs Ersatzmittel und 'Pruefbericht des Hauptarchitekten'. F-NK3-B-07 TEIL 0.2 (a), STOP-REGEL, ohne Einordnung nach den drei Faellen. F-NK3-B-08 zwei Zuordnungen des Hauptarchitekten
    stehen unter dem Etikett des Betreibers (KR-03, QS-07). F-NK3-B-09 die Liste der eigenen Entscheidungen hat keinen zusammengefuehrten Stand. F-NK3-B-10 drei Reste zu BM-0019 Nr. 7. F-NK3-B-11 zwei ungeregelte Randfaelle zu Nr. 1
    (Unteragenten; Feststellung des Falls bei der Wiederaufnahme). Dazu aus dem Freiraum: Titel von BF-0117 nennt weiter '70 Teilbedingungen ohne Test'; Belegstufe an der Zahl '341 von 341'; ein Satz an QS-08 zu 'frische Augen'.
