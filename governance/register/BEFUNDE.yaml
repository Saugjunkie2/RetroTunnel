  titel: 'Nachtraege aus dem Abgleich mit den Fundament-Dateien: drei Stellen, an denen ein Modul eine Vorgaengerregel ungenau wiedergibt oder nicht ausdruecklich
    abwaegt'
  beschreibung: Sammelbefund. (a) BASE-070_050 Abschnitt 8 schliesst mit dem Satz, die Eigenschaften des Vorgaenger-Spools einschliesslich 'aelteste zuerst
    verwerfen' blieben erhalten. Regel P-d verwirft aber zuerst Interim-Meldungen (als TR-XB165-22 ANGEPASST gefuehrt). Der Satz ist ungenau. Die MUSS-Regel
    des Masters 'keine Stop-Policy' (kein Anhalten eines Dienstes wegen vollem Puffer) steht nirgends ausdruecklich; sie folgt nur daraus, dass kein Stopp
    vorgesehen ist. (b) B058 verlangt als Negativtest, dass eine Manipulation an der Adresse die abgeleitete Policy nicht aendert. In RetroTunnel gelten
    bei Adress-Drift bis zur Reparatur die Pool-Regeln der VORGEFUNDENEN Adresse (Zaehler, ADMIN-Faktor der Grenzen); Verwaltungsdienste und die Ausnahme
    von der Einschraenkung haengen nicht an der Adresse. Der Waechter (BASE-070_060 Abschnitt 4, SC-61) meldet und aendert nichts. Nicht entschieden und
    nicht begruendet ist, ob die Herstellung (BASE-080_030 Abschnitt 9) eine Connection, deren Adressen nicht der Ableitung aus Rolle und Slot entsprechen,
    als 'nicht auswertbar' behandeln muss (nichts oeffnen). (c) DEC-FW-16 (Notzugang rtmgmt0) nennt Alternativen und Begruendung, waegt aber die Vorgaengerregel
    B050 Z.127-128 ('Keine Break-Glass Accounts via RADIUS ... Recovery/Access erfolgt out-of-band (SSH/Console/Provider), nicht ueber VPN') nicht ausdruecklich
    ab; BASE-050_010 Abschnitt 4 (Bewertung gegen den Vorgaenger) fuehrt den Punkt nicht.
