  beleg: 'Zwischenstand der Pruefung C mit Umgehungsmatrix (je Fall: Aenderung, Ergebnis, Rueckgabewert).'
  auswirkung: 'Mehrere Schutz-Aussagen in 00_MANIFEST 6a, REVIEW_STANDARD 10.4 und qa/README beanspruchen mehr, als geprueft wird (BM-0015 Schritt E: neue
    Pruefungen muessen tatsaechlich kontrollieren, was sie beanspruchen).'
  massnahme: Pruefungen haerten (je Luecke eine Regel mit Negativtest) oder die Aussage auf den geprueften Umfang beschraenken; Fehlalarme beseitigen; den
