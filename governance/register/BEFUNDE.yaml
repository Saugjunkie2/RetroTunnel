  stand: '2026-11-15: Abgleich durchgefuehrt (Bericht: 03_CHANGELOG v2.8.1). Die sechs Dateien wurden erneut vollstaendig im Wortlaut gelesen und die 19
    Punkte unten an den Modulen nachgeschlagen; 147 Rueckverfolgungs-Records in sechs neuen Dateien (governance/register/trace/XPN_00_MASTER.yaml, XPN_B050.yaml,
    XPN_B055.yaml, XPN_B057.yaml, XPN_B058.yaml, XPN_B342.yaml; jeweils TEILWEISE: nur Aussagen mit Bezug zu den vier Modulen). Daraus drei neue Befunde
    (BF-0085, BF-0086, BF-0087), eine Ergaenzung von BF-0041 und eine Vormerkung an M3-040. BELEGSTUFE: logisch geprueft an den genannten Stellen durch
    den Autor der Module; maschinell geprueft sind nur Zitate und Fundstellen. Der Befund bleibt IN_ARBEIT, bis ein unabhaengiger Pruefer den Abgleich bestaetigt
    hat (REVIEW_STANDARD 10.3); bis dahin sperrt er die vier Module weiter. Aeltere Standvermerke: 2026-11-14 alle sechs Dateien selbst vollstaendig gelesen
    (Lesestand im Quelleninventar, am Sitzungsprotokoll belegt).'
  abgleichpunkte:
  - 'MASTER Z.61-65: Hard-Cut in der Reihenfolge Durchsetzen -> conntrack beidseitig -> bei Fehlschlag Sitzung beenden -> scheitert beides: Alarm, kein
    stilles Scheitern. ERGEBNIS: gedeckt im Entwurf BASE-080 (PA-32, PA-33, PA-21; _030 Abschnitt 7: auch der Rueckfall gescheitert -> Code 4, CRITICAL,
    Auftrag bleibt offen). Angepasst: beide Adressfamilien, Ausloeser ist der am Kernel gelesene Vorzustand, Beenden ueber den Adapter statt ueber eine
    Prozessnummer.'
  - 'MASTER Z.55-59: Sperre vor jedem SQL-/Herstellungszugriff, Loesen erst nach Erfolg, bei Fehlschlag Sitzung beenden; die Sperre ist kein eingeschraenkter
    Modus. ERGEBNIS: gedeckt (BASE-050 FW-18, FW-19; BASE-080 PA-26, PA-30, PA-22). Angepasst und in BASE-080_030 Abschnitt 6.3 begruendet: Bei voruebergehender
    Ursache bleibt die Sitzung gesperrt und wird nach hoechstens vpn_connect_gate_ttl_seconds beendet statt sofort.'
  - 'MASTER Z.66, 127-128: Abgleich spaetestens alle 5 Minuten; Abgleich nach Neustart zwingend. ERGEBNIS: Der Startabgleich ist gedeckt (PA-45). ABWEICHUNG
    beim Takt: Setting mit Obergrenze 3600 s - neuer Befund BF-0085; zwei Records zu B166 (TR-XB166-07, TR-XB166-86) nannten die Zusage ''unveraendert''
    und sind berichtigt.'
  - 'MASTER Z.121, 262 und B050 Z.116-120, 146-147: Verbrauchs-Spool dauerhaft, begrenzt, aelteste zuerst verwerfen, Alarm, kein Dienst-Stopp wegen vollem
    Spool. ERGEBNIS: gedeckt mit angepasster Verwurfsreihenfolge (BASE-070_050 P-d: Interim-Meldungen zuerst; schon als TR-XB165-22 ANGEPASST gefuehrt;
    SC-39). BASE-040_060 Abschnitt 5: Snapshot je Peer, zusaetzlich die Plattformgrenze (BASE-005_040: aelteste zuerst, Alarm); der Dienst-Stopp dort folgt
    aus der abgelaufenen Grace, nicht aus einem vollen Spool. Ungenauer Schlusssatz in BASE-070_050 Abschnitt 8 und fehlende ausdrueckliche Regel ''kein
    Anhalten'': BF-0086 (a).'
  - 'MASTER Z.71-75: Bereinigung im Anmeldepfad mit Schutz gegen Anmeldefluten; Laufzeitangaben nie per blosser Existenz wahr; Spiegel nur fuer root schreibbar.
    ERGEBNIS: gedeckt (SC-26, SC-02, SC-23, SC-33; BASE-070_040 K2).'
  - 'MASTER Z.37: kein IPv6-Leck fuer IPv4-only-Clients. ERGEBNIS: gedeckt (FW-25, FW-17, FW-36, FW-37).'
  - 'MASTER Z.41-42, 134: Nutzer nur definierte Web-Dienste, nie Verwaltungsdienste; Grundschutz auch fuer ADMIN. ERGEBNIS: gedeckt und strenger (FW-26
    bis FW-29, FW-49, FW-33, FW-31, FW-30). ''Verwaltungs-Einschraenkung gilt auch fuer ADMIN'' ist bewusst geaendert (R-08, PA-05).'
  - 'MASTER Z.140: Aktionen im Panel loesen die Herstellung sofort aus. ERGEBNIS: gedeckt und abgesichert im Entwurf BASE-080 (PA-46, PA-50, PA-64: Auftrag
    in der Transaktion der Aenderung; der Webprozess ruft das Werkzeug nie selbst).'
  - 'B050 Z.18 und B342 PRIO 0: Stoerungen des Backends duerfen nie zu Sperren (Bans) fuehren und brauchen einen eigenen Grund. ERGEBNIS: gedeckt in BASE-020
    (AAA-07, BASE-020_070, T-AAA-06). BASE-070 und BASE-080 enthalten keine Sperrlogik; BASE-050 verweist die Sperrentscheidung an MOD-005.'
  - 'B050 Z.68-77 und B055 Z.53-55: Anmeldename eindeutig, festes Format, MUSS validiert werden. ERGEBNIS: gedeckt (SC-62, ANF-SC-16, T-SC-81): byteweiser
    Vergleich; eine abweichende Schreibweise ist ungueltig, nicht gleichwertig; die Formatpruefung vor der Suche ist als Anforderung an BASE-020/BASE-010
    gestellt.'
  - 'B050 Z.86 und B057 13.10: Zahlenwerte des Vorgaengers. ERGEBNIS: Sperr-TTL (20), Bereinigung im Anmeldepfad (Notwerte 10/30/1, Obergrenzen 30/120/2),
    Lauf (300) und Schwelle (900, Bedeutung dokumentiert geaendert) sind erhalten; Reserve und Online-Fenster sind dokumentiert angepasst bzw. ersetzt (BASE-070_070
    Abschnitt 3). Die Raten neuer Verbindungen fuehrt BASE-050 als vpn_fw_client_new_* mit Fehlerverhalten STRICT statt Notwert und ohne Vermerk der Altnamen:
    BF-0041.'
  - 'B050 Z.124-128: Datenbank aus = Ablehnung fuer ALLE, schnell, ohne Haengen; keine Notzugaenge ueber RADIUS; Wiederherstellung ueber SSH/Konsole, nicht
    ueber VPN. ERGEBNIS: gedeckt (AAA-03, SC-14, T-AAA-02, T-SC-21; FW-41). Der Notzugang rtmgmt0 (DEC-FW-16) ist eine begruendete Anpassung; die ausdrueckliche
    Abwaegung gegen den Wortlaut ''nicht ueber VPN'' fehlt dort: BF-0086 (c).'
  - 'B050 Z.149: mehrdeutige Zuordnung beim Sitzungsbeginn MUSS scheitern. ERGEBNIS: gedeckt im Entwurf BASE-080 (PA-29, PA-25; _030 Abschnitt 6.1 und Fall
    L-D; T-PA-33): keine Freigabe, Sitzung wird beendet, Ereignis. Als ANGEPASST zurueckverfolgt (Zuordnung ueber die Adresse, Gegenprobe ueber den Namen).'
  - 'B055 Z.95-112: Sperre je Connection eindeutig, Freigabe bei Buchungsbeginn, abgelaufene Sperren im Anmeldepfad ignorierbar. ERGEBNIS: gedeckt (SC-16,
    SC-17, SC-19, SC-20, SC-27). Die Freigabe mit Haltervergleich (BF-0016) und die funktionalen Felder Zweck und Halter sind als ANGEPASST zurueckverfolgt.'
  - 'B057 13.2, 13.4, 13.5: Rueckfall nur als verschaerfender Notwert; fehlend und ungueltig verschieden; ungueltig immer mit Audit-Ereignis und Gesundheitsmeldung;
    kein stiller Notbetrieb. ERGEBNIS: BASE-070 und BASE-080 gedeckt (SC-59, PA-62; eine begruendete Ausnahme: vpn_l2tp_unaccounted_action). BASE-040 (LKG
    fuer 14 Keys, Nutzung nicht gemeldet) und BASE-050 (STRICT statt Notwert): BF-0041, der jetzt auch M2-040 und M2-050 sperrt.'
  - 'B057 13.3 (Arbeitsregel P0/P1): Jede Key-Ergaenzung nennt Aufloesungsreihenfolge und Nachweis von wirksamem Wert und Herkunft in der Diagnose. ERGEBNIS:
    als historische Arbeitsanweisung ANGEPASST. Der sachliche Kern ist zentral erfuellt: TRUTH_MODEL Abschnitt 4 fuehrt effective_value, effective_source
    und den Zustand des Keys; die Module lesen ausschliesslich ueber diese Aufloesung (BASE-070_070 Abschnitt 3, ANF-SC-08); alle Keys der vier Module gelten
    nur global. Die Anzeige je Key bleibt Vertrag von BASE-090.'
  - 'B057 13.10: quarantine_days ist FAIL_CLOSED, TIGHTEN_ONLY, nicht ueberschreibbar. ERGEBNIS: gedeckt; die offene Frist (BF-0050) ist als ANGEPASST zurueckverfolgt
    (SC-73: FAIL_CLOSED schuetzt die Rueckgabe, der Entzug wirkt immer).'
  - 'B058: Policy-Schluessel nie aus Adresse, Oberflaeche oder Protokoll ableiten; Ableitungen vollstaendig, deterministisch, sichtbar; Test je Gruppe und
    Negativtest. ERGEBNIS: Keine Software leitet die Rolle aus der Adresse oder dem Tunneltyp ab (SC-49, BASE-070_060 AV-2; Soll-Funktion von BASE-080 allein
    aus SQL). Das Regelwerk des Kernels unterscheidet Rollen ueber die Pool-Bereiche (FW-50) - Materialisierung, zusaetzlich gesichert durch das SQL-abgeleitete
    Set fuer Verwaltungsdienste (FW-28). GRENZE beim Negativtest: Bei Adress-Drift gelten bis zur Reparatur die Pool-Regeln der vorgefundenen Adresse; der
    Waechter meldet nur: BF-0086 (b).'
  - 'B342 Abschnitt 3 und 6: Rangfolge der Gruende; Ratenbegrenzung schraenkt ein, lehnt nicht ab; Panel-Zustaende aendern die Kernel-Wirkung nie. ERGEBNIS:
    Panel-Zustaende ohne Kernel-Wirkung: gedeckt (PA-53, T-PA-63). Die Rangfolge stammt aus BASE-010_050 und weicht von B342 ab (ueberfaelliger Claim auf
    Rang 2 statt zuletzt), ohne dokumentierte Begruendung: BF-0087; BASE-080 wendet die Registry an (PA-04). Die Ratenbegrenzung mit Ergebnis RESTRICT hat
    keine Bedingungsquelle: vorgemerkt an PRIORITAETENLISTE M3-040 (MOD-005).'
