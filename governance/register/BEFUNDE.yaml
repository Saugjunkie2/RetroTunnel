    Verbleib; keine Regel, wo der Pruefauftrag dauerhaft liegt. F-NKO-010: TEIL 0.2 (d) nennt ''Zeitpunkt (VOR dem Einarbeiten)'', verschweigt aber die
    in 10.3 a) getroffene eigene, schwaechere Entscheidung zur Buendelung. F-NKO-012: Der Vermerk in 02_ASSUMPTIONS_AND_RULES Abschnitt 4 bemisst Q-05 und
