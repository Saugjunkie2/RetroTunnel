    Nicht bestaetigt.'
  titel: 'Die Regel fuer Bestaetigungen schloss die Urteilskennungen der dritten Nachpruefung aus (Praefix BF- und BM-)'
  beschreibung: >-
    Die Pruefauftraege der dritten Nachpruefung vergeben fuer Punkte, die kein frueherer Pruefer unter eigener Kennung fuehrt, Urteilskennungen aus Registerkennung und Zusatz
    ("BF-0114-M2-080", "BF-0116-KB-011", "BF-0115-EINARBEITUNG", "BM-0019-NR-1"). Die Regel "eine Bestaetigung nennt eine Kennung, die im Bericht steht" schloss jede Kennung mit dem
    Praefix eines eigenen Registers aus - gemeint war die blosse Registerkennung, die ein Bericht beilaeufig nennen kann. Folge: Ein Befund, den der Pruefer unter einer solchen
    Urteilskennung bestaetigt hat (zuerst BF-0114 im Bericht T), liess sich nicht schliessen. Fehler im Zuschnitt der eigenen Auftraege gegen die eigene Regel; aufgefallen am
    2026-11-17 beim Eintragen der Ergebnisse.
  fundstellen:
  - ZIEL:qa/pruefe_register.py:53@322aba0
  beleg: Lauf von qa/pruefe_register.py am 2026-11-17 nach dem Eintragen der Schliessung von BF-0114 (Meldung 'nachpruefung nennt keine Kennung, unter der der genannte Bericht den Befund fuehrt').
  auswirkung: Befunde, die die dritte Nachpruefung unter einer Verbundkennung bestaetigt (BF-0114; spaeter BF-0115, BF-0116, BF-0117), waeren trotz Bestaetigung nicht schliessbar gewesen. Keine Luecke - die Regel war zu streng, nicht zu weit.
