    statt ''die drei Arbeitsdokumente''. Aus Antwort (a): REVIEW_STANDARD 10.1 ersetzt ''Marcos Signal'' durch ''ein Paket der PRIORITAETENLISTE'' - das
    ist eine Dokumentationspflicht, keine Schranke, und sollte so benannt sein. Aus dem Freiraum: (5) Sammelbefunde koennen den Status einzelner Punkte
    nicht tragen; (7) die eigenen Entscheidungen des Hauptarchitekten, die eine Altregel enger fassen, stehen verstreut und werden dem Betreiber nicht gesammelt
