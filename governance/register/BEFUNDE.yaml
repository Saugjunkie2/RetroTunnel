    10.4 ueberzeichnet die maschinelle Abdeckung. F-BAN-019 6a Zeile 12 zu Verbesserungen trifft nicht zu (VB-0019). F-BAN-020 Verbleibsaussagen im Changelog
    unvollstaendig. F-BAN-021 Lesebeleg: Begriff enger als die Betreiberanweisung, Verfahren nicht im Repository. F-BAN-022 Tracker Abschnitte 2 bis 5 nicht
    nachgezogen. F-BAN-023 weitere Stellen des REVIEW_STANDARD, die 10.1 nicht nennt. F-BAN-024 siehe BF-0074. F-BAN-025 Changelog v2.7.0 ohne Abschnitt
    E und Commit-Kennungen. F-BAN-026 eigene Zitierform nicht eingehalten. F-BAN-027 Begriffe und Kennungen (QS-nn, Steuerungsdokument, Verbesserung). F-BAN-028
    TEIL 0.3 und KR-05 (a) lassen Grenzen der Betreiberregeln aus (OP-E2). F-BAN-029 Ziel "mindestens 1.000 gleichzeitige Verbindungen" in keiner kanonischen
    Datei. F-BAN-030 Auswahlregel im Briefing 3.4 nicht eindeutig. F-BAN-031 "aufgeloest" vor dem Qualitaets-Gate; Urheberschaft von KR-07.'
