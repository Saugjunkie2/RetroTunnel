  klasse: GERINGFUEGIG
  status: IN_ARBEIT
  stand: '2026-11-15: Eingearbeitet (03_CHANGELOG v2.8.8), nicht bestaetigt. Je Kennung: -03 Sperrvermerke werden wie die Buchung gegen alle gesicherten
    Staende verglichen (Entfernen nur mit Feld entsperrt); Befunde tragen nur die im Kopf genannten Felder. -04 herabstufung gilt nur fuer die Klasse,
    die sie als ''auf'' nennt; bestaetigt_durch braucht Bericht und Kennung; Begruendung mindestens 20 Zeichen. -05 Pruefbericht ist, was die Sammlung
    der Pruefauftraege einem Auftrag zuordnet (nicht mehr der Dateiname); eine Bestaetigung nennt eine Kennung, die im Bericht steht. -06 Die Pflicht
    zur Einstufung greift auch bei Dateinamen ohne Pfad und bei Befundkennungen F-XXX-nnn; Verzicht nur mit Begruendung; Skala ohne Ruecksicht auf die
    Schreibung. Grenze: kurze Kennungen aelterer Berichte (A-01, N-11). -07 Statuswort = erstes Wort hinter dem Verzeichnis; die satzbasierte Regel ist
    mit BF-0105 durch die Sperre nach der betroffenen Datei ersetzt (die Faelle D2 und D4 gibt es nicht mehr). -08 ''im Repository'' immer am Bestand;
    Proof-Anker nur mit vorhandener Moduldatei; drei Punkte und Strich ohne Leerzeichen erkannt. -09 NACHBESSERUNG verlangt den erklaerten Freeze (ob
    ein Pruefbericht ueber den Kandidaten vorliegt, prueft nichts - Grenze in 10.4); zweiter Teil eingeordnet als NICHT ZUTREFFEND, Begruendung in
    10.4; Positivtests der Regel ergaenzt. -10 Tests fuer die genannten Zweige ergaenzt; ausgezaehlt 202 von 202 Meldungen.'
  pruefer_einstufung: MINOR
  titel: 'Zweite Nachpruefung, Sammelbefund Bericht B: acht kleinere Befunde an den Pruefwerkzeugen (F-NK2-B-03 bis F-NK2-B-10)'
  beschreibung: 'F-NK2-B-03: sperrt_auch laesst sich still entfernen; Befunde haben keine Feldliste (Tippfehler im Feldnamen bleibt unbemerkt). -04: herabstufung.von
    ungeprueft; ein einmal gesetztes Feld schaltet beide Klassenregeln dauerhaft ab. -05: ''Als Pruefbericht zaehlt, was PRUEFUNG im Namen traegt'' ist
    zu weit (selbst angelegte Datei; Bericht, der den Befund gar nicht fuehrt) und zu eng (ein Vollaudit hiesse anders). -06: Die Pflicht zur Einstufung
    des Pruefers greift nur beim woertlichen Pfad; der Verzicht genuegt mit ''x''; die Skala der Pruefer in Kleinschreibung wird abgelehnt. -07: ''CLEAN''
    wird nur in Grossbuchstaben und nur in der ersten Inventarzeile gesucht; Kennungen zaehlen irgendwo im Block; ''nicht CLEAN'' loest einen Fehlalarm
    aus. -08: Eine falsche Angabe ''im Repository ...'' mit dem beschriebenen Wert besteht; der Proof-Anker wird nur als Muster geprueft; Tippvarianten
    der Zaehlangabe (''...'', Strich ohne Leerzeichen) entgehen. -09: fachstatus NACHBESSERUNG ist an nichts gebunden; PRUEFBEREIT/G1 zaehlen DEFERRED-Pakete
    mit. -10: ''jede seit dem 2026-11-15 neue oder geaenderte Regel hat einen Negativtest'' trifft fuer sieben Zweige nicht zu; eine Positivkontrolle ist
    ein Duplikat.'
