    F-NK3-B-01: Das Nachholen der nie gelaufenen Phase A+B ist an vier Stellen als freiwillige, 'strengere' Eigenentscheidung gefuehrt, obwohl Fall B nach seinem Wortlaut ('erneut', 'allein wegen') nicht passt.
