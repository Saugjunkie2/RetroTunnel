  beschreibung: BASE-020_020 nennt für die Wiederherstellung bei Datenbankausfall "out-of-band (SSH/Console)"; die Panel-Vorstudie bezeichnet SSH als letzten
    Notfallkanal "in jedem Fall". SSH ist aber nur an SERVICE_SSH gebunden und ausschließlich über die Produkt-Tunnel aus dem ADMIN-Pool erreichbar. Bei
    Datenbankausfall lehnt L2TP neue Anmeldungen ab (RADIUS) und awg0 wird nach der Grace gestoppt (WG-GRACE); bei defektem AWG-Modul oder nicht ladbarem
    Regelwerk gibt es ebenfalls keinen Weg. Übrig blieb nur die Konsole des Hosters, die im Konzept nirgends als Voraussetzung (lokales Konto, Kennwort)
    geführt war.
