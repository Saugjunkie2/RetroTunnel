- id: BF-0011
  klasse: SCHWERWIEGEND
  status: BEHOBEN
  titel: Erklärter Notfallkanal SSH war bei Störungen nicht erreichbar (kein datenbankunabhängiger Verwaltungszugang)
  beschreibung: >-
    BASE-020_020 nennt für die Wiederherstellung bei Datenbankausfall "out-of-band (SSH/Console)"; die
    Panel-Vorstudie bezeichnet SSH als letzten Notfallkanal "in jedem Fall". SSH ist aber nur an SERVICE_SSH
    gebunden und ausschließlich über die Produkt-Tunnel aus dem ADMIN-Pool erreichbar. Bei Datenbankausfall lehnt
    L2TP neue Anmeldungen ab (RADIUS) und awg0 wird nach der Grace gestoppt (WG-GRACE); bei defektem AWG-Modul
    oder nicht ladbarem Regelwerk gibt es ebenfalls keinen Weg. Übrig blieb nur die Konsole des Hosters, die im
    Konzept nirgends als Voraussetzung (lokales Konto, Kennwort) geführt war.
  fundstellen: ["RT:base/BASE-020_AAA_CORE/BASE-020_020_ADMISSION_VERTRAG.txt:121", "RT:base/BASE-110_WEBSTACK_CORE/entwuerfe/panel-zentrale/VISION_PANEL_ZENTRALE.txt:579", "RT:base/BASE-005_PLATFORM_CORE/BASE-005_030_SERVICE_ENDPOINTS_UND_PORTS.txt:43"]
  beleg: Wortlaute gelesen; Abgleich mit BASE-040_060 (Dienst-Stop nach Grace) und der Dienst-Matrix (SSH nur ADMIN-Pool).
  auswirkung: >-
    Im wahrscheinlichsten Störfall (Datenbank länger als die Grace nicht verfügbar) wäre der Server aus der Ferne
    nicht mehr verwaltbar gewesen; die Wiederherstellung hätte von einer nicht dokumentierten Voraussetzung abgehangen.
  massnahme: >-
    Notzugang rtmgmt0 als eigene, datenbankunabhängige Ebene (BASE-050 DEC-FW-16, BASE-050_040 Abschnitt 6) mit
    engem Zielumfang (nur SSH), Verfügbarkeit auch im Notfall-Riegel, Meldung jeder Nutzung; Konsole des Hosters als
    letzte Ebene mit ausdrücklicher Anforderung eines lokalen Kontos (ANF-FW-01 h, ANF-FW-10).
  behoben_in: ["base/BASE-050_FIREWALL_CORE/BASE-050_040_WAN_EXPOSITION_UND_NOTZUGANG.txt#6) NOTZUGANG rtmgmt0", "base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-16"]
  arbeitspaket: AP-K050
  entdeckt_in: AP-K050
