    (19) AAA-10 stuetzt "kein Zugriff auf wg_*" auf SQL-09/SQL-10 statt SQL-07; (20) Pfade /etc/freeradius/3.0/ und /var/log/freeradius/ weichen von BASE-005 ab;
    (21) vpn_connection_id als INT; T-AAA-36 c zaehlt die leere Zeichenkette als Verstoss; "pppd/xl2tpd" neben accel-ppp.
    BASE-030: (22) Rechte des Hook-Zugangs (nur INSERT, ip-down braucht UPDATE; "vpn_system@localhost" gibt es in BASE-000 nicht); (23) Pfade und Ports weichen
    von den Registern in BASE-005 ab; (24) dns2 = 10.77.0.2 als Ausweich-DNS fuer Clients (Unbound ist nicht fuer Clients; wegen der Umleitung von Port 53 ohne
    Wirkung); (25) ueberholte Aussagen zu SimUse ueber radacct; (26) der Legacy-Provider wird mit 3DES begruendet - gebraucht wird er fuer MD4 und Einfach-DES
    (MS-CHAPv2; lokal mit OpenSSL 3.0.13 nachgesehen); (27) PSK-Anzeige "fuer ADMIN" gegen die Anzeige im Kunden-Panel, Leseweg des Panels fehlt (an M2-110);
    (28) Widerspruch, ob Clients nach einem Neustart von selbst neu verbinden; (29) Formfehler in Tests (T-LT-36, T-LT-45, T-LT-18).
    decisions/: (30) D004 Abschnitt 4 nennt die nachzuziehenden Dateien unvollstaendig (vpn_sessions steht in 22 Dateien); (31) D004-E01 "dreistufig" gegen vier
