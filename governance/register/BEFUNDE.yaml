    AAA-04 und der Vorgänger (D012) verlangen dagegen: maximal eine Sitzung, kein Takeover. Der Widerspruch wird
    genau dann wirksam, wenn die vorgelagerte RADIUS-Prüfung die bestehende Sitzung nicht sieht. Das ist kein
    exotischer Wettlauf: Bestehende Sitzungen überleben Abrechnungsstörungen (LT-39, acct-timeout=0); fehlt deshalb
    die radacct-Zeile einer lebenden Sitzung, lässt die Prüfung eine zweite Anmeldung zu, und "replace" beendet die
    bestehende Sitzung zugunsten der neuen.
  fundstellen: ["RT:base/BASE-030_TUNNEL_L2TP_IPSEC/BASE-030_010_ACCEL_PPP_ARCHITEKTUR.txt:67", "RT:base/BASE-030_TUNNEL_L2TP_IPSEC/BASE-030_090_INVARIANTEN.txt:188", "RT:base/BASE-020_AAA_CORE/BASE-020_090_INVARIANTEN.txt:18"]
  beleg: Wortlaute gelesen (BASE-030_010 Zeilen 67–76, LT-35, LT-39, AAA-04); Fallanalyse in BASE-070_030 Abschnitt 7 (Fälle E und F).
  auswirkung: >-
    Im Ausnahmefall ist eine Übernahme durch einen zweiten Anmelder möglich (Verdrängen des rechtmäßigen Nutzers,
