  stand: "2026-11-13: In BASE-070 entschieden (DEC-SC-06: Schlussriegel single-session=deny). Offen: Nachzug in BASE-030 (Konfigurationsvertrag, LT-35, T-LT-34) in AP-Q04; praktische Bestätigung des Daemon-Verhaltens (E-SC-01)."
  sperrt_auch:
