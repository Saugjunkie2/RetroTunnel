    dahin bleibt der Befund in Arbeit. Nachtrag 2026-11-14: Mit B057 (Settings-Kanon des Vorgaengers, am 2026-11-14 vollstaendig gelesen) liegt die Quelle
    fuer den zweiten Teil vor: Rueckfall nur als verschaerfender Notwert (FAIL_SAFE_HARDCAP und TIGHTEN_ONLY) oder Fail-Closed. Die in BASE-040_020 fuer
    14 Keys verwendete Klasse LKG (zuletzt gueltig gelesener Wert) kennt B057 nicht; sie ist je Key zu begruenden (Betrieb waehrend einer Datenbankstoerung)
    oder auf die Klassen des Katalogs zurueckzufuehren. Nachtrag 2026-11-15 (Abgleich mit B057, BF-0053; Rueckverfolgung in governance/register/trace/XPN_B057.yaml):
    (1) BASE-040_020 Abschnitt 1: Fuer die 14 Keys mit dem Verhalten LKG ist nicht festgelegt, dass die Nutzung eines zuletzt gueltigen Werts und ein ungueltiger
    Wert gemeldet werden (B057 13.4/13.5: ungueltig immer mit Audit-Ereignis und Gesundheitsmeldung, kein stiller Notbetrieb). (2) BASE-050_070 Abschnitt
    1 setzt fuer ALLE Firewall-Settings das Fehlerverhalten STRICT. TRUTH_MODEL 7.4 und B057 13.10 fuehren die Raten neuer Verbindungen als FAIL_SAFE_HARDCAP
    mit Notwert (1 bzw. 0). BASE-050 nennt weder die Altnamen (vpn_conn_new_rate_per_sec, vpn_conn_new_burst; im Vorgaenger auch conn_new_log_rate_per_sec
    und conn_new_rate_admin_multiplier) noch die Abweichung; ANF-FW-04 beantragt STRICT ohne Hinweis auf die belegte Klasse. In der Sache ist STRICT vertretbar
    (kein Wert kann lockern, das aktive Regelwerk bleibt), muss aber als Abweichung begruendet und bei BASE-090 beantragt werden. (3) Der Befund sperrt
    deshalb auch M2-040 und M2-050 (Feld sperrt_auch). Nachtrag 2026-11-18 (03_CHANGELOG v2.9.16): BASE-090 liegt als ENTWURF vor und entscheidet
    den zweiten Teil: zwei Fehlerklassen; LKG ist FAIL_SAFE_HARDCAP mit Notwert, und das Halten bei nicht lesbarer Datenbank gilt fuer alle Keys
    (DEC-ST-04, DEC-ST-06); die Firewall-Keys sind FAIL_CLOSED als begruendete Abweichung von TRUTH_MODEL 7.4, die Altnamen der Raten sind gefuehrt
    (BASE-090_060 Anmerkung *3 und Abschnitt 8); jeder Zustand ausser OK wird gemeldet (ST-36). NICHT unabhaengig geprueft; die Nachzuege in BASE-040
    und BASE-050 (ANF-ST-02, ANF-ST-03) stehen aus.'
