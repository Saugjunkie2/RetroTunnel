- id: BF-0113
  klasse: GERINGFUEGIG
  status: IN_ARBEIT
  stand: '2026-11-15: Je Punkt entschieden (03_CHANGELOG v2.8.9), nicht bestaetigt. Bericht A3, Freiraum: (1) uebernommen (BF-0105). (2), (3) KR-03 geht als Regelfrage an den Betreiber; warum bis zur Antwort nicht geteilt wird, steht dort. (4) Frage d zurueckgezogen. (5), (6) E-01, E-02 und E-12 sind Fragen. (7) a: Abschlussbedingungen an M2-000 bis M2-030 (Nachzug, kein offener Befund, Qualitaets-Gate mit unabhaengiger Pruefung); CLEAN nur fuer ein [DONE]-Modul ohne sperrenden Befund. b: Sperrvermerke von Hand nachgetragen, Grenze in 10.4. c: entfaellt - die Pakete sind geoeffnet, die Werkzeuge sind strenger geworden. d: Status in 10.2 bestimmt; keinen Status ''wartet'', das Feld stand nennt es. e: Staffelung von G1 und PRUEFBEREIT in 10.4 begruendet. f: bleibt offen - BF-0061 haengt an der dritten Pruefrunde von BASE-040. Bericht A2 (b): die fuenf Saetze haben einen Verbleib in 10.3 h, i und j; die Wortwahl ''ERSETZT'' der Tabelle in v2.8.4 ist in v2.8.9 berichtigt. Zu K9: Abgrenzung im Glossar (Verbesserung). Bericht B, Freiraum: Vergleich mit dem Git-Verlauf statt Journal (v2.8.6); Regeln lesen an fester Stelle (v2.8.8); NACHBESSERUNG an den Freeze gebunden (v2.8.8). OFFEN daraus: ein Umgehungstest je Regel als festes Verfahren und die Zaehlung je Bedingung (BF-0111). Dritte Nachpruefung 2026-11-15 am Stand cd6b746: BEHOBEN A3-Freiraum-1, -7a, -7b, -7c (Bericht S), A3-Freiraum-5, -6 (Bericht E), A2-Antwort-b, A2-K9 (Bericht T). A3-Freiraum-2, -3, -4, -7d, -7e, -7f prueft Bericht C (steht aus).'
  ohne_pruefer_einstufung: Freiraum-Punkte und Antworten tragen in den Berichten keine Einstufung; soweit ein Punkt einen nummerierten Befund betrifft,
    gilt dessen Einstufung (BF-0105, BF-0106, BF-0108).
  titel: 'Zweite Nachpruefung: Punkte aus den Freiraum-Bloecken und Antworten ohne eigene Befundkennung (Berichte A2, A3 und B)'
  beschreibung: 'Bericht A3, Freiraum: (1) [DONE] bei M2-000 bis M2-030 anders entscheiden (siehe BF-0105). (2) Frage a (Changelog teilen) beantwortet KR-03
    bereits. (3) Frage e / E-06 (KR-03 nicht auf Register) ist eine Engerfassung des Wortlauts und damit eine Betreiberentscheidung. (4) Frage d / E-10
    beantwortet Betreiberregeln Abschnitt 5; die Frage kann entfallen. (5) E-01 und E-02 sind Betreiberentscheidungen und gehoeren an den Anfang der Fragen.
    (6) E-12 ersetzt eine Schranke durch eine Selbstbindung und fehlt als Frage. (7) Randfaelle: a) wann ein Altmodul wieder abgeschlossen und CLEAN heissen
    darf (unabhaengige Pruefung nach dem Nachzug ist nirgends Abschlussbedingung); b) Befunde ohne Fundstelle im Modul fallen durch die Modulregel; c) kein
    beschriebener Weg, die Werkzeuge anzupassen, wenn der Betreiber die Pakete oeffnen laesst; d) fuer Befunde, die auf ein anderes Paket warten, fehlt
    ein Zustand; e) PRUEFBEREIT verlangt Pakete bis QS-17, G1 bis QS-16 - ob gewollt gestaffelt, steht nirgends; f) BF-0061 haengt an der dritten Pruefrunde
    von BASE-040. Bericht A2, Antwort (b): fuenf kleinere Saetze aus Regel 8 ohne ausdruecklichen Verbleib (Ziel; ohne vorher zu fragen; keine Copy-Paste-Bloecke;
    Ergebnisdatei am Wort ergebnis; Spezialfall Satz 2); Vermerk MANIFEST nennt DEC-WT-08 Vorschlag, die Changelog-Tabelle ERSETZT. Bericht A2 zu K9: Abgrenzung
    ''Verbesserung aus Phase A+B'' gegen ''Hinweis (NICE)'' steht nirgends. Bericht B, Freiraum: Journal statt Git-Verlauf als Bauweise; Schreibweisen-Regeln
