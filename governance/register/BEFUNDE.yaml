  titel: 'Nachpruefung F-NKO-007: Der Schliessweg ZURUECKGEWIESEN fuer ''Hinweis, der nicht jetzt umgesetzt wird'' schwaecht die BEFUND-REGEL ab, ohne als
    Abweichung ausgewiesen zu sein'
  beschreibung: 'REVIEW_STANDARD 10.2 (und der Glossareintrag ''Verbesserung'') lassen zu, einen Befund als ZURUECKGEWIESEN zu schliessen, wenn er ''ein
    Hinweis ist, der bewusst nicht jetzt umgesetzt wird'' - dann als Verbesserung mit Entscheidung ROADMAP. Ein so geschlossener Befund zaehlt als erledigt
    und sperrt weder [DONE] noch Freigabe. Die BEFUND-REGEL des Betreibers (CLAUDE_BRIEFING Regel 10: ''ALLE Befunde werden gefixt - ohne Ausnahme. Egal
    ob BLOCKER, MAJOR, MINOR oder NICE'') laesst das nicht zu; TEIL 0.2 fuehrt sie im selben Zug als unveraendert geltend. Die Stelle ist weder als EIGENE
    ENTSCHEIDUNG gekennzeichnet noch in 10.1 unter den Abweichungen genannt; die Berufung auf Betreiberregeln 4.3 traegt nicht (dort geht es um optionale
    Funktionsideen nach dem Freeze, nicht um Review-Befunde).'
