    dem ersten Lauf, der den Fehler zaehlt, und mit ANF-PA-14 f verloere der L2TP-Waechter seine heutige eigene Bremse. NEU,
    MINOR: F-G81-A-03 (Zaehler des Gesamt-Auftrags ueber eine Neuanlage nicht eindeutig), F-G81-A-04 (Ergebnis 5 nach dem
    Neuerwerb des Locks trotz eingetretener Wirkung), F-G81-A-05 (Rueckfall des Fluss-Schnitts bei L2TP: Entzug und Fortsetzung
    nicht festgelegt), F-G81-A-06 (Sitzungsende ueber den Schnittstellennamen kann die Freigabe einer fremden neuen Sitzung
    entfernen), F-G81-A-07 (gescheiterter Nachweis bei schon bestehender Zulassung), F-G81-A-08 (L2TP-Freigabe nach einem Neuladen
