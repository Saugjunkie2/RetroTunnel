    letzte Ebene mit ausdrücklicher Anforderung eines lokalen Kontos (ANF-FW-01 h, ANF-FW-10).
  behoben_in: ["base/BASE-050_FIREWALL_CORE/BASE-050_040_WAN_EXPOSITION_UND_NOTZUGANG.txt#6) NOTZUGANG rtmgmt0", "base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-16"]
