    reiche ''fuer das Paket einen'' Commit zurueck; es war keiner. (b) Dieselbe Bauart bei ''kein Loeschen'' und ''keine stille Herabstufung'': verglichen
    wurde mit HEAD und HEAD~1; nach zwei weiteren Commits war die Spur weg (10.4 nannte das als Grenze). (c) Bei der Behebung gefunden: Die Einstufung
    des Pruefers liess sich entfernen, wenn zugleich jeder Hinweis auf den Bericht entfernt wurde; herabstufung.von musste nicht die strengste je gefuehrte
    Klasse nennen. Eigene Auswertung aller 24 gesicherten Staende des Registers am 2026-11-15: kein Befund geloescht, keine Klasse gesenkt, kein Paket
    umgebucht, keine Einstufung entfernt oder gemildert - nach Aktenlage ist die Luecke nicht benutzt worden.'
