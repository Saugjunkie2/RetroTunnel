    BASE-020, BASE-050 (Notfallkanal).'
  - 'B050 Z.149: mehrdeutige Zuordnung beim Sitzungsbeginn (doppelter Anmeldename, mehrere aktive Treffer) MUSS scheitern - keine Zuordnung, keine Herstellung,
