    2.1, Kollation utf8mb4_unicode_ci in BASE-000_010, kein Formatfilter). Meldet sich ein Gerät mit abweichender Groß-/Kleinschreibung
    an, sieht die Sonde bei einer zweiten Anmeldung keine Sitzung, die On-Demand-Prüfung schließt die Protokollzeile der
    lebenden Sitzung als Geist, und der Daemon weist die zweite Sitzung nicht ab.
