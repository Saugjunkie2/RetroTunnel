    Merkmals "Schnitt ausstehend" (Schritt F1a) uebernimmt den dabei entstandenen Zaehler als gelesenen Stand; ein Statuswechsel,
    der zwischen Lesung und Sichern festgeschrieben wird, verschwindet beim Erledigen aus dem Auftragsbuch, ohne hergestellt zu
