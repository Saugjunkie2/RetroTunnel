  beschreibung: L3 schließt nach einem erkannten Daemon-Neustart alle offenen Zeilen mit Beginn vor der Startzeit des Daemons
    - ohne Mindestalter und ohne Blick auf die gelesene Sitzungsliste. Die Startzeit ist nur aus Systemzeit minus Laufzeit
    ableitbar; stellt die Zeitsynchronisation die Uhr nach dem Start vor, rückt die abgeleitete Startzeit vor.
