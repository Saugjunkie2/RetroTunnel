    bereits mit Ablehnungsgrund erkannt wird. Nachzug von BASE-030_010, LT-35 und T-LT-34 in AP-Q04 (ANF-SC-03).
  arbeitspaket: AP-Q04
  entdeckt_in: AP-K070
