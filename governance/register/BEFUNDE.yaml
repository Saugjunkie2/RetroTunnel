  klasse: SCHWERWIEGEND
  status: OFFEN
  titel: 'Konsolidierung, Pruefung C (abgebrochen): Die neuen Gleichstandspruefungen lassen sich an vielen Stellen umgehen; vier Fehlalarme'
  beschreibung: 'Der Pruefer veraenderte Kopien gezielt und hielt fest, was die Werkzeuge erkennen. NICHT erkannt wurden unter anderem: Listeneintraege
    ohne Index-Zeile und mit unbekanntem Status-Tag; einseitig geaenderte Abhaengigkeiten; Fortschrittstext in titel und ergebnis des Index; neue oberste
    Felder im Register; ein schwerer Befund, der mit behoben_in "x" oder ohne Nachweis durch die Auftragsebene geschlossen wird; ein in Register und Tracker
    zugleich geloeschter Befund; Tracker-Inventar "keine offenen Befunde"; abweichende Schreibweisen im 04_PHASE_PLAN (Einzug, Strich, Statuswort, fehlendes
    Tag, geloeschte Matrixzeile, Summen); Zaehlangaben in anderer Schreibweise; Freitextfelder der STATUS.yaml; die Statuskopien in README und Briefing;
    die Laenge von Changelog, decisions/ und model/; ein Entwurfskennzeichen an einem fertigen Modul. Fehlalarme: richtiger Teilbereich einer Zaehlangabe,
    fremde Versionsnummer im README, Zusatztext und Zeilenumbruch in Tracker 1d. Der Bericht ist ein Zwischenstand; die Pruefung brach ab, bevor Befunde
    eingestuft waren.'
  fundstellen:
  - ZIEL:governance/pruefungen/KONSOLIDIERUNG_PRUEFUNG_C_PRUEFWERKZEUGE_2026-11-14_ABGEBROCHEN.md:43@a23db6b
