# Befundregister. klasse: KRITISCH | SCHWERWIEGEND | GERINGFUEGIG | VERBESSERUNG
# status: OFFEN | IN_ARBEIT | BEHOBEN | ZURUECKGEWIESEN
#   Geschlossen wird nur auf diesen zwei Wegen, beide mit dem Bericht einer gesonderten Pruefung (REVIEW_STANDARD 10.2).
#   Der fruehere Status AUFGELOEST_DURCH_AUFTRAGSHIERARCHIE (schloss ohne Bericht) ist seit 2026-11-15 gestrichen (BF-0102).
#   BEHOBEN verlangt behoben_in (Datei oder Commit) UND nachpruefung (Bericht eines unabhaengigen Pruefers unter
#   governance/pruefungen/); bis dahin bleibt ein eingearbeiteter Befund IN_ARBEIT (REVIEW_STANDARD 10.3).
#   ZURUECKGEWIESEN ist nur zulaessig, wenn der Befund NICHT ZUTRIFFT (ein zutreffender Befund wird behoben, auch ein
#   Hinweis - BEFUND-REGEL), und verlangt zurueckweisung: {begruendung, bestaetigt_durch: <Bericht>}.
# pruefer_einstufung: Einstufung im Bericht - KRITISCH | HOCH | MITTEL | NIEDRIG | HINWEIS (Skala der Pruefer) oder
#   BLOCKER | MAJOR | MINOR | NICE (Skala des REVIEW_STANDARD); Zuordnung zur klasse: REVIEW_STANDARD 10.2.
# Befunde werden nie geloescht; Kennungen sind lueckenlos.
# sperrt_auch: weitere Pakete, die nicht [DONE] werden duerfen, solange dieser Befund offen ist (ausser arbeitspaket).
#   PFLICHT fuer jedes Modul, in dessen Ordner (ohne entwuerfe/) eine Fundstelle des Befunds liegt: Die Sperre folgt der
#   betroffenen Datei, nicht nur der Buchung (BEFUND-REGEL; BF-0105). Ist die Fundstelle nur die zutreffende
#   Vergleichsstelle, steht das Paket stattdessen in entsperrt.
# entsperrt: Liste aus {paket, begruendung}: Pakete, die der offene Befund trotz Fundstelle oder frueherem Sperrvermerk
#   nicht (mehr) sperrt. Ohne Begruendung (mindestens 20 Zeichen) gilt der Eintrag nicht.
# pruefer_einstufung ist PFLICHT, sobald entdeckt_in, beleg oder eine Fundstelle einen Pruefbericht nennt - mit Pfad,
#   mit Dateinamen oder ueber eine Befundkennung der Form F-XXX-nnn, die in einem Bericht steht. Traegt der Bericht
#   keine Einstufung: ohne_pruefer_einstufung: <Begruendung, mindestens 20 Zeichen>.
# umbuchung: {von: <bisheriges arbeitspaket>, begruendung} - bei mehreren Umbuchungen eine Liste solcher Eintraege:
#   Pflicht fuer JEDES Paket, das der Befund in irgendeinem gesicherten Stand trug und heute nicht mehr traegt
#   (Umbuchen hebt die Abschluss-Sperre des bisherigen Pakets auf). Verglichen wird mit dem ganzen Git-Verlauf dieser
#   Datei - ebenso fuer 'nie geloescht', 'Klasse nicht ohne herabstufung gesenkt' und 'pruefer_einstufung nicht entfernt
#   oder gemildert'. herabstufung.von nennt die strengste je gefuehrte Klasse, herabstufung.auf die heutige.
# Als Pruefbericht zaehlt nur eine Datei unter governance/pruefungen/, die die Sammlung der Pruefauftraege
#   (PRUEFAUFTRAEGE_*.md) mit '- Bericht: <Datei>' einem Auftrag zuordnet - kein Arbeitspapier des Hauptarchitekten,
#   nicht die Sammlung selbst. Eine Bestaetigung (nachpruefung, bestaetigt_durch) nennt den Bericht UND eine Kennung,
#   die in ihm steht. Status OFFEN / IN_ARBEIT: REVIEW_STANDARD 10.2.
# Herabstufungen nur mit Begründung im Feld "herabstufung" und Bestätigung durch gesonderte Prüfung.
# fundstellen: "RT:<pfad>:<zeile>" bezieht sich auf den RetroTunnel-Baseline-Commit, "XPN:<pfad>[:<zeile>]" auf den XPN-Baseline-Commit.
#              "NL:<pfad>[:<zeile>]" auf die Nachlieferung am Liefer-Commit, "ZIEL:<pfad>[:<zeile>]@<commit>" auf eine Datei des
#              Arbeitsstands am genannten Commit (für Befunde an Dateien, die es am Baseline-Commit noch nicht gab).
