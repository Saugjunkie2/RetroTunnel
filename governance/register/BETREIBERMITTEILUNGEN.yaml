    ## 7. ZUSÄTZLICHE BETREIBERENTSCHEIDUNG – AUFGABENGERECHTER DENKAUFWAND VON UNTERAGENTEN

    **ENTSCHEIDUNG: Der bestehende Hauptmodus bleibt unverändert.** Ich nutze den Claude-Max-Plan. Für den Hauptarchitekten verwende ich **[Modellbezeichnung ausgelassen] mit Denkaufwand `max` und aktiviertem Ultracode**. An dieser Modellwahl, der höchsten eingestellten Denkaufwandsstufe und dem Ultracode-Modus darfst du aufgrund dieser Anweisung **nichts ändern**. Insbesondere ist Ultracode eine zusätzliche Orchestrierungsfunktion, **keine** mit `max` gleichzusetzende Aufwandsstufe; eine Umstellung auf `--effort ultracode`, die den Denkaufwand auf `xhigh` setzen würde, ist **kein** zulässiger Ersatz für meinen bisherigen Modus.

    **Mein zusätzlicher Auftrag betrifft ausschließlich die von dir eingesetzten Unteragenten:** Entscheide **vor jeder neuen Agentenbeauftragung**, welche der tatsächlich verfügbaren Denkaufwandsstufen für die konkrete Teilaufgabe die beste Balance aus gründlicher, zuverlässiger Bearbeitung und unnötigem Verbrauch meines Nutzungskontingents bietet. Verwende nicht reflexhaft bei jedem Unteragenten `max`, aber auch nicht reflexhaft eine niedrige Stufe. **Das bestmögliche fachliche Ergebnis und die verbindlichen Qualitätsanforderungen haben Vorrang vor Einsparungen.**

    Dabei gilt:

    1. **Aufgabenbezogene Einstufung:** Für einfache, eng begrenzte und mechanisch überprüfbare Arbeiten kann ein niedrigerer Aufwand angemessen sein. Für anspruchsvolle Quervergleiche, widersprüchliche Quellen, Architektur- und Sicherheitsfragen, komplexe Randfälle sowie unabhängige Qualitätsprüfungen ist entsprechend hoher Aufwand zu wählen – erforderlichenfalls `xhigh` oder `max`. Die Wahl ist anhand von Schwierigkeit, Fehlerrisiko, Kontextumfang und erforderlicher Beweistiefe zu treffen, nicht allein anhand der Bezeichnung des Agenten.
    2. **Keine Qualitätsabsenkung:** Weder Prüfumfang noch Quellenlektüre, tatsächliche Unabhängigkeit, Gegenprüfung, Testpflicht, Nachweispflicht, Bearbeitung offener Befunde oder Abschlussgates dürfen wegen einer niedrigeren Aufwandsstufe verkürzt oder umgangen werden. Ein unabhängiger Prüfer muss seinen vollständigen Auftrag unabhängig vom gewählten Aufwand erfüllen können. Wenn erkennbar die nötige Tiefe fehlt, ist mit höherem Aufwand erneut beziehungsweise ergänzend zu prüfen; Teilresultate sind als solche zu kennzeichnen.
    3. **Technisch tatsächlich umsetzen, soweit unterstützt:** Claude Code dokumentiert für Unteragenten das Feld `effort` in der Agentendefinition. Bei **nicht geforkten Unteragenten** ist außerdem eine Aufwandswahl je Aufruf mit dem Parameter `effort` dokumentiert (**ab Claude Code v2.1.292**). Prüfe vor Anwendung, ob deine **tatsächliche Claude-Code-Cloud-Ausführung**, Version, der konkrete Agententyp, das eingesetzte Modell und die geltenden Einstellungen die jeweilige Möglichkeit unterstützen. Eine globale Umgebungsvariable wie `CLAUDE_CODE_EFFORT_LEVEL` oder eine Aufwandsobergrenze kann die Auswahl übersteuern. Behaupte keine erfolgreiche Einzelsteuerung, ohne sie hinreichend geprüft zu haben. Wo die Funktion nicht verfügbar ist, bleibe beim vorhandenen zulässigen Modus und dokumentiere die Grenze; erfinde keine Parameter oder Workarounds.
    4. **Keine unbeauftragten Modell- oder Globaleinstellungen:** Diese Entscheidung autorisiert **keinen** Wechsel des Hauptmodells, keine Abschaltung von Ultracode, keine Reduzierung des Haupt-Denkaufwands, keine Änderung meiner Konto-, Nutzer-, globalen oder sitzungsweiten Einstellungen und **keinen eigenmächtigen Modellwechsel bei Unteragenten**. Sie erlaubt ausschließlich eine nachweislich unterstützte, auf den jeweiligen Unteragenten begrenzte Wahl des Denkaufwands.
    5. **Agenteneinsatz selbst abwägen:** Setze Agenten ein, wenn getrennte Kontexte, unabhängige Prüfungen oder parallelisierbare fachliche Aufgaben davon profitieren. Vermeide unnötige Mehrfachagenten, redundante Lese- und Prüfaufträge sowie zusätzliche Agenten allein zur Produktion weiterer Metaberichte. Bereits belegte Ergebnisse dürfen sinnvoll genutzt werden, soweit die geltenden Regeln keine neue eigenständige Lektüre oder Prüfung verlangen. Ein niedrigerer Aufwand bedeutet nicht automatisch weniger Gesamtverbrauch; Nacharbeiten und wiederholte Agentenläufe sind in die Abwägung einzubeziehen.
    6. **Knappe Nachvollziehbarkeit statt neuer Governance:** Halte bei umfangreichen Agentenläufen die wesentlichen Gründe der Aufwandswahl und beobachtete Qualitäts- oder Verbrauchsprobleme kurz in der **vorhandenen** Projektdokumentation fest. Erstelle dafür **keine** neue parallele Aufgabenverwaltung, kein neues Register und keine ausufernden Meta-Berichte. Genaue Einsparungen darfst du nur bei tatsächlich belastbaren Vergleichsdaten behaupten.

    **Umsetzung:** Prüfe zuerst die vorhandene Unterstützung und ihren tatsächlichen Geltungsbereich. Verwende die passende agentenspezifische Aufwandssteuerung nur dort, wo sie nachweislich funktioniert; führe keine Änderung am Hauptmodus aus. Berücksichtige diese Entscheidung künftig bei Agentenbeauftragungen und führe die vorherigen fünf Betreiberentscheidungen und den bestehenden Konzeptauftrag unverändert weiter. Diese ergänzende Regel ändert insbesondere **nicht** die Vorgaben zur unabhängigen Prüfung, zu Betreiberfreigaben oder zur fachlichen Fertigstellung.
