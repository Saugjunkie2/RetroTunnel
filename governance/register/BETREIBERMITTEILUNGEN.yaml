    zuerst einzuarbeiten und gebündelt nachprüfen zu lassen; sieben Bedingungen. (3) 00_MANIFEST KR-03: begründete
    Ausnahme für reine Protokoll-, Verlaufs- und Registerdateien; sechs Bedingungen. (4) NEU: aufgabengerechte Wahl
    des Denkaufwands je Unteragent. NICHT GEÄNDERT: Betreiberregeln v1.0 (B01 bis B15, E1 bis E3, Abschnitte 2 bis
    10), Startauftrag, MARCOS_ARBEITSWEISE, die Gates G1 bis G4, die beiden Vollaudits, die technische
    Endkontrolle, die geschützten Freigabevoraussetzungen und alle Sicherheits-, Funktions-, Nachweis- und
    Qualitätsanforderungen. E-01 und die pauschale Fassung von E-12 sind NICHT genehmigt; E-03 bis E-26 sind nicht
    pauschal genehmigt. Die Mitteilung wirkt nicht zurück, nimmt QS-07 nicht ab, gibt das Gesamtprojekt nicht frei
    und bestätigt die Arbeitskopie des Startauftrags nicht. Hauptmodell, Denkaufwand der Hauptsitzung und Ultracode
    bleiben unverändert; ein Modellwechsel bei Unteragenten ist nicht autorisiert.
  auslegung: >-
    Je Nummer der Mitteilung. Nr. 1 (E-01): NICHT genehmigt. Fall A - in einem tatsächlich neuen Arbeitskontext
    gilt das vollständige Startup des Briefings einschließlich der Phase A+B im vollen vorgesehenen Umfang, mit den
    dort geregelten Ausnahmen. Fall B - in der Fortsetzung derselben Sitzung mit zuverlässig verfügbarem Kontext
    nicht allein wegen der Fortsetzung; die Wiederaufnahme-, Git-, Status- und Konsistenzprüfungen bleiben Pflicht,
    und was nicht mehr zuverlässig verfügbar ist, wird neu gelesen. Fall C - die modulbezogenen Phase-A+B-Prüfungen
    und die Modul- und Gesamtprüfungen bleiben zusätzlich Pflicht und ersetzen die Anfangsprüfung nicht. Nr. 2
    (E-02): BEGRENZT genehmigt, nur für diesen Auftrag, nicht als allgemeine Regel. Geeignete Änderungen ohne
    wesentliche Sicherheits-, Architektur- oder Qualitätsrisiken dürfen zuerst eingearbeitet und gebündelt
    nachgeprüft werden; die acht aufgezählten Arten von Änderungen sind vor der fachlichen Übernahme oder
    verbindlichen Festlegung unabhängig zu prüfen; maßgeblich ist die tatsächliche Wirkung; sieben Bedingungen; ein
    Nutzungslimit allein rechtfertigt keine Absenkung sicherheitsrelevanter Prüfvorgaben. Nr. 3 (E-12): keine
    Freigabe über den Startauftrag hinaus. Fall A - innerhalb der erteilten Autonomie handelt der Hauptarchitekt
    selbst, begründet und nach den Qualitätsregeln, auch bei technischen Alternativen, notwendigen
    dateiübergreifenden Änderungen und zulässigen Workarounds. Fall B - wo eine verbindliche, weiter gültige
    Betreiberanweisung seine ausdrückliche Zustimmung verlangt, ersetzen weder Begründung noch Registereintrag,
    eigene Bewertung, Workaround-Etikett, Prüfbericht oder Berufung auf die Autonomie diese Zustimmung; der Bedarf
    wird festgehalten, an Unabhängigem wird weitergearbeitet. Fall C - bei unklarem Widerspruch zwischen älterer
    Arbeitsanweisung und Auftrag gilt die Autoritätshierarchie in beide Richtungen. Die Dokumentation ist eine
    zusätzliche Pflicht, keine Ersatzgenehmigung. Nr. 4 (E-06, KR-03): Ausnahme GENEHMIGT für 03_CHANGELOG.txt,
    BEFUNDE.yaml, QUELLENINVENTAR.yaml und vergleichbare reine Verlaufs- und Nachweisregister, soweit sie diese
    Funktion tatsächlich erfüllen; für normative Steuerungs- und Konzeptdokumente gilt KR-03 weiter; keine Teilung
    allein wegen der Zeilenzahl. Nr. 5: Die Originaltreue der Arbeitskopie des Startauftrags darf nicht als
    nachgewiesen bezeichnet werden; liegt das Original nicht zugänglich vor, heißt sie NICHT VERIFIZIERT. Nr. 6:
    Einarbeitung in sechs Schritten (A bis F); bestehende Dateien fortschreiben, keine neue parallele Struktur,
    keine künstliche Fertigstellung von QS-07, keine Umbuchung von Governance-Befunden zur Statusbereinigung, keine
    inhaltsgleichen neuen Berichte. Nr. 7: Vor jeder Agentenbeauftragung wählt der Hauptarchitekt den Denkaufwand
    nach Schwierigkeit, Fehlerrisiko, Kontextumfang und Beweistiefe; das fachliche Ergebnis und die
    Qualitätsanforderungen gehen vor Einsparung; Einzelsteuerung nur, wo sie nachweislich funktioniert; keine
    Änderung an Hauptmodell, Haupt-Denkaufwand, Ultracode oder Einstellungen, kein eigenmächtiger Modellwechsel bei
    Unteragenten; die Gründe der Aufwandswahl stehen kurz in der vorhandenen Dokumentation.
  offene_mehrdeutigkeit: >-
    Verbleibende Auslegungsfragen; keine hält die Arbeit auf. Die Umsetzung steht jeweils dabei; sie ist eine
    Auslegung des Hauptarchitekten und vom Betreiber nicht bestätigt. (a) Zu Nr. 1: Die Mitteilung sagt nicht, ob
    die beim Auftragsbeginn am 2026-11-11 unterbliebene Phase A+B in der laufenden Sitzung nachzuholen ist.
    Umsetzung: Sie wird einmal nachgeholt, bevor die Modularbeit nach QS-07 weitergeht (PRIORITAETENLISTE QS-08) -
    eine eigene Entscheidung des Hauptarchitekten, strenger als Fall B verlangt. (b) Zu Nr. 1: Ab wann eine
    Fortsetzung nach einer Zusammenfassung des Kontexts kein Fall B mehr ist. Umsetzung: Nach jeder Zusammenfassung
    werden Schritt 0 und TEIL 0 neu gelesen und jede Datei, an der gearbeitet oder auf die ein Urteil gestützt
    wird; fehlt die Zusammenfassung oder trägt sie erkennbar nicht, gilt Fall A. (c) Zu Nr. 2: was bei einem Modul,
    das noch in Arbeit ist, "fachliche Übernahme beziehungsweise verbindliche Festlegung" heißt. Umsetzung: Eine
    Änderung mit einer der aufgezählten Wirkungen an einem abgeschlossenen oder bereits unabhängig geprüften Text,
    an einem Decision Record oder an einer verbindlichen Regel wird VOR dem Einarbeiten geprüft; der erste Entwurf
    eines neuen Moduls wird als Ganzes vor seinem [DONE] geprüft. (d) Zu Nr. 4: Die Prüfprogramme unter qa/
    (pruefe_register.py mit 1508, die Testsammlung mit 2116 Zeilen) und maschinell erzeugtes Arbeitsmaterial sind
    weder normative Dokumente noch genannte Register. Umsetzung: Sie werden vorerst nicht nach Zeilenzahl geteilt;
    das steht als eigene Auslegung an KR-03 und ist die weniger strenge der beiden möglichen Lesarten. (e) Zu Nr.
    5: Als Original kommen die Chat-Nachricht vom 2026-11-11 und die in den Betreiberregeln Abschnitt 11 genannte
    Datei in Betracht. Umsetzung: Die Arbeitskopie ist am 2026-11-15 maschinell mit beiden Chat-Nachrichten im
    Sitzungsprotokoll verglichen (byte-gleich); gegenüber der Fassung des Betreibers bleibt die Originaltreue NICHT
    VERIFIZIERT, und das Sitzungsprotokoll ist kein vom Hauptarchitekten unabhängiger Beleg. (f) Zu Nr. 7: Die
    Aufwandswahl ist für Agentenaufrufe aus einem Ablaufskript an den Laufdaten nachgewiesen, für den einzelnen
    Agentenaufruf nicht (governance/UMGEBUNGSPRUEFUNG.yaml, UP-18). (g) Zu Nr. 7: Die vier Prüfer der zweiten
    Nachprüfung liefen auf einem vom Hauptarchitekten gewählten anderen Modell und dadurch mit Denkaufwand "medium"
    statt "max". Umsetzung: kein Modellwechsel mehr; die sieben auf Bericht A1 gestützten Schließungen werden in
    der dritten Nachprüfung am Text nachgeprüft. (h) Zu Nr. 3: ob jede Abschwächung einer weiter gültigen Regel des
    Betreibers zu den vorbehaltenen Entscheidungen gehört. Umsetzung: ja (00_MANIFEST KR-05 a) - die strengere
    Lesart.
