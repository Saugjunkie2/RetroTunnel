- id: BM-0015
  datum: 2026-11-14
  kanal: Chat-Nachricht der Cloud-Sitzung (während der Arbeit an BASE-080; Eingang ca. 12:35 UTC)
  wortlaut: |
    RetroTunnel – Verbindliche Betreiberanweisung zur Konsolidierung der Governance-Struktur

    Ich möchte eine grundsätzliche Korrektur deiner bisherigen Arbeitsweise im RetroTunnel-Repository.

    Mir ist bewusst, dass RetroTunnel ein umfangreiches Projekt ist und dass für eine zuverlässige, sichere und skalierbare Architektur zusätzliche Dateien, Prüfnachweise, Werkzeuge und Verzeichnisse erforderlich sein können.

    Ich habe ausdrücklich nichts gegen neue Dateien oder sinnvolle Erweiterungen der bestehenden Struktur.

    Was ich aber nicht möchte, ist, dass du neben meiner bereits vorhandenen Projektorganisation ein weitgehend eigenständiges Governance-System entwickelst, während meine ursprünglichen Dateien unverändert, veraltet oder sogar ungelesen bleiben.

    1. Ausgangsproblem

    Im Root-Verzeichnis meines RetroTunnel-Repositories existieren bereits umfangreiche Dokumente zur Projektsteuerung, Architektur, Qualitätssicherung und Arbeitsweise.

    Dazu gehören insbesondere:

    - "00_MANIFEST.txt"
    - "01_GLOSSARY.txt"
    - "02_ASSUMPTIONS_AND_RULES.txt"
    - "03_CHANGELOG.txt"
    - "04_PHASE_PLAN.txt"
    - "CLAUDE_BRIEFING.txt"
    - "MARCOS_ARBEITSWEISE.txt"
    - "REVIEW_STANDARD.txt"
    - "REVIEW_TRACKER.txt"
    - "PRIORITAETENLISTE.txt"
    - "NAVIGATIONSKARTE_ALTES_KONZEPT.txt"
    - "README.md"

    Diese Dateien sind nicht zufällig entstanden. Sie enthalten bereits ausgearbeitete Projektstrukturen, fachliche Entscheidungen, Arbeitsabläufe, Review-Verfahren, Abhängigkeiten und Qualitätsanforderungen.

    Trotzdem hast du neue Verzeichnisse wie "governance/", "qa/" und ".github/workflows/" eingerichtet und dort einen erheblichen eigenen Verwaltungsapparat aufgebaut.

    Besonders problematisch finde ich folgende Feststellungen:

    1. Dein eigenes Quelleninventar kennzeichnet "CLAUDE_BRIEFING.txt", "MARCOS_ARBEITSWEISE.txt" und "REVIEW_STANDARD.txt" als "UNGELESEN".
    2. Der ursprüngliche "REVIEW_TRACKER.txt" ist nur teilweise gelesen und enthält weiterhin veraltete Modulstände.
    3. Du bezeichnest diesen Review-Tracker in deiner neuen Governance-Struktur nur noch als historischen Review-Stand.
    4. Gleichzeitig führst du neue Arbeits-, Status-, Prüf- und Befundregister, deren vollständige Integration mit meinen ursprünglichen Dokumenten nicht nachgewiesen ist.

    Das entspricht nicht meiner Vorstellung von einer konsistenten Weiterentwicklung des vorhandenen RetroTunnel-Konzepts.

    2. Meine verbindliche Grundentscheidung

    Du sollst mein vorhandenes RetroTunnel-Konzept einschließlich seiner Projektorganisation weiterentwickeln – nicht daneben dein eigenes Konzept- oder Governance-System aufbauen.

    Das bedeutet:

    - Vorhandene Dateien sollen tatsächlich genutzt werden.
    - Sind Inhalte veraltet, sollen sie geprüft und aktualisiert werden.
    - Fehlen notwendige Inhalte, sollen sie ergänzt werden.
    - Enthalten Dateien unnötige Wiederholungen, dürfen sie sinnvoll gekürzt und konsolidiert werden.
    - Haben sich Strukturen als unzweckmäßig erwiesen, dürfen sie begründet reorganisiert werden.
    - Neue Dateien und Ordner sind erlaubt, wenn ihr eigenständiger Zweck nachgewiesen ist.
    - Bestehende Funktionen dürfen aber nicht stillschweigend durch neue Parallelstrukturen verdrängt werden.

    Ich erwarte ausdrücklich keine künstliche Bewahrung historisch gewachsener Strukturen.

    Ich erwarte eine nachvollziehbare, konsistente Weiterentwicklung unter Wiederverwendung des vorhandenen Bestands.

    3. Bestehende Dokumente vollständig auswerten

    Bevor du weitere umfangreiche Governance-Strukturen entwickelst, musst du die bestehenden relevanten Root-Dokumente vollständig lesen und inhaltlich auswerten.

    Dabei gilt:

    - „Vollständig gelesen“ darf nur dokumentiert werden, wenn der tatsächliche vollständige Inhalt verarbeitet wurde.
    - Eine Stichwortsuche, ein Auszug oder eine frühere Zusammenfassung gilt nicht als vollständige Lektüre.
    - Bereits gelesene Dateien müssen nicht grundlos wiederholt werden; bestehende Lesebelege sind auf ihre tatsächliche Aussagekraft zu prüfen.
    - Fehlende, widersprüchliche oder veraltete Inhalte sind ausdrücklich zu kennzeichnen.

    Besonders wichtig sind mir die bisher als ungelesen dokumentierten Dateien "REVIEW_STANDARD.txt", "CLAUDE_BRIEFING.txt" und "MARCOS_ARBEITSWEISE.txt".

    Eine wichtige Abgrenzung: Die aktuell verbindlichen Betreiberregeln einschließlich E1–E3 bleiben maßgeblich. Historische Arbeitsanweisungen erhalten durch das Lesen nicht automatisch eine höhere Autorität. Ihre fachlich weiterhin sinnvollen Anforderungen dürfen aber auch nicht pauschal ignoriert werden, nur weil sie historisch sind.

    4. Keine konkurrierenden Wahrheitsquellen

    Ich möchte für jede wichtige Projektfunktion eine eindeutig bestimmte, kanonische Zuständigkeit.

    Prüfe insbesondere folgende Überschneidungen:

    Ursprüngliche Datei| Neue Struktur
    "PRIORITAETENLISTE.txt"| "governance/register/ARBEITSPAKETE.yaml"
    "REVIEW_TRACKER.txt"| "governance/register/", "governance/pruefungen/"
    "REVIEW_STANDARD.txt"| Neue Prüfverfahren unter "qa/" und "governance/"
    "04_PHASE_PLAN.txt"| Neue Fortschritts-, Status- und Gate-Verwaltung
    "CLAUDE_BRIEFING.txt"| "governance/FORTSETZUNG.md"
    "02_ASSUMPTIONS_AND_RULES.txt"| Neue Regel- und Entscheidungsdokumentation
    "03_CHANGELOG.txt"| Neue Register, Fortschritts- und Prüfberichte

    Diese Überschneidungen sind nicht automatisch Fehler. Ich verlange aber, dass du für jeden Bereich nachvollziehbar festlegst:

    1. Welche Datei ist für welche Information maßgeblich?
    2. Welche anderen Dateien ergänzen diese Information lediglich?
    3. Wo liegen echte Dopplungen vor?
    4. Welche vorhandenen Funktionen müssen zusammengeführt werden?
    5. Welche ursprünglichen Dateien müssen aktualisiert, gekürzt oder gegebenenfalls ausdrücklich abgelöst werden?
    6. Wie verhinderst du zukünftig, dass die Informationen erneut auseinanderlaufen?

    Ich möchte keine zwei unabhängig gepflegten Projektstände, die beide den Eindruck erwecken, verbindlich und aktuell zu sein.

    5. Umgang mit den neuen Ordnern

    Die Verzeichnisse "governance/", "qa/" und ".github/workflows/" dürfen grundsätzlich bestehen bleiben.

    Ich erkenne ausdrücklich den Nutzen von maschinellen Prüfungen, Rückverfolgbarkeit, Quelleninventaren, Prüfberichten, Checkpoints und wiederaufnehmbaren Arbeitspaketen an.

    Aber:

    Diese Hilfsmittel müssen der vorhandenen RetroTunnel-Projektstruktur dienen und dürfen nicht zu einer davon unabhängigen zweiten Projektorganisation werden.

    Insbesondere sollen fachliche Architekturentscheidungen in den dafür vorgesehenen kanonischen Konzeptdateien stehen. Governance-Dateien dürfen deren Herkunft, Prüfung, Umsetzung und Status dokumentieren, aber nicht versteckt widersprechende fachliche Festlegungen enthalten.

    Prüfe ebenfalls, ob bestehende Dokumente durch gezielte Erweiterungen dieselbe Funktion erfüllen können, bevor weitere Register angelegt werden.

    Neue Dateien müssen einen nachvollziehbaren eigenständigen Zweck besitzen. Zusätzliche Dateimengen sind kein Qualitätsmerkmal.

    6. Konkreter Korrekturauftrag

    Ich beauftrage dich, jetzt eine kontrollierte Konsolidierung durchzuführen.

    Arbeite dabei in folgender Reihenfolge:

    A. Bestandsaufnahme

    Erfasse die bestehenden Root-Steuerungsdokumente und die neu geschaffenen Governance-/QA-Strukturen. Bestimme ihre jeweiligen Inhalte, Aufgaben, Überschneidungen und Widersprüche.

    B. Vollständige Quellenprüfung

    Lies die bisher nicht vollständig verarbeiteten relevanten Ursprungsdokumente und dokumentiere den tatsächlichen Lesestand korrekt.

    C. Konsolidierungsentscheidung

    Entwickle eine eindeutige Zuordnung der Zuständigkeiten. Bevorzuge die sinnvolle Überarbeitung und Weiterverwendung bestehender Dokumente gegenüber unnötigen neuen Paralleldateien.

    Eine Ablösung bestehender Funktionen muss ausdrücklich begründet und als solche kenntlich gemacht werden.

    D. Tatsächliche Umsetzung

    Belasse es nicht bei einer Analyse oder einem zusätzlichen Bericht.

    Aktualisiere die betroffenen Root-Dateien, neuen Register, Verweise, Statusinformationen und Prüfmechanismen so, dass die Projektorganisation wieder konsistent ist.

    Der vorhandene Review-Tracker darf beispielsweise nicht weiterhin aktive, inzwischen ausgearbeitete Module als "EMPTY" ausweisen, wenn seine ursprüngliche Inventarfunktion noch gilt.

    Falls eine Funktion künftig ausschließlich durch ein anderes Register erfüllt werden soll, muss diese Umstellung nachvollziehbar dokumentiert und die alte widersprüchliche Darstellung aufgelöst werden.

    E. Qualitätskontrolle

    Prüfe anschließend, ob:

    - alle maßgeblichen Root-Dokumente berücksichtigt wurden;
    - keine konkurrierenden aktuellen Statusangaben bestehen;
    - die ursprünglichen Qualitätsanforderungen angemessen übernommen oder begründet ersetzt wurden;
    - neue QA-Prüfungen tatsächlich die jeweils beanspruchten Anforderungen kontrollieren;
    - die zentrale Projekthistorie und die Moduldateien konsistent bleiben;
    - die verbindlichen Betreiberregeln und Abschlussgates unverändert eingehalten werden.

    7. Grenzen dieser Anweisung

    Diese Konsolidierung ist kein Auftrag zum Löschen nützlicher Nachweise, zum Zurücksetzen des bisherigen Arbeitsstands oder zur pauschalen Rückkehr auf alte Versionen.

    Bereits erarbeitete Architektur, Prüfberichte, Befunde, Quellenbelege und Git-Historie sollen erhalten bleiben.

    Ebenso wenig darfst du unter dem Vorwand der Vereinfachung Sicherheitsanforderungen, Invarianten, Testpflichten, Rückverfolgbarkeit oder unabhängige Abschlussprüfungen abschwächen.

    Die technische Zielsetzung von RetroTunnel einschließlich hoher Zuverlässigkeit und Skalierbarkeit für mindestens 1.000 gleichzeitige Verbindungen bleibt unverändert.

    Verändere auch nicht eigenmächtig die übergeordneten Betreiberentscheidungen oder die bestehenden Abschlussgates G1–G4.

    8. Priorität und zukünftige Arbeitsweise

    Diese Konsolidierung hat jetzt Vorrang vor der weiteren umfangreichen Ausarbeitung neuer Module.

    Sichere den aktuellen GitHub-Arbeitsstand und arbeite die Korrektur in nachvollziehbaren, einzeln überprüfbaren Commits auf "main" ab, entsprechend meiner bereits erteilten Branch-Anweisung.

    Danach soll die reguläre Konzeptentwicklung mit dem konsolidierten Bestand fortgesetzt werden.

    Für sämtliche zukünftigen Arbeiten gilt:

    Zuerst prüfen, welche vorhandenen Dateien und Strukturen bereits zuständig sind. Danach bestehende Inhalte weiterentwickeln. Neue Strukturen nur dann schaffen, wenn sie tatsächlich einen eigenständigen notwendigen Zweck erfüllen.

    Die vorhandenen Root-Dateien dürfen nicht bloß archiviert oder durch neue Eigenkonstruktionen ersetzt werden, ohne dass ihre bisherigen Aufgaben und Inhalte nachvollziehbar behandelt wurden.

    9. Erwartetes Ergebnis

    Am Ende dieser Korrektur erwarte ich:

    1. Eine konkrete Zuordnung zwischen ursprünglichen und neuen Steuerungsdateien.
    2. Die tatsächlich konsolidierten und aktualisierten Dateien im Repository.
    3. Die Auflösung nachgewiesener Dopplungen und Widersprüche.
    4. Angepasste QA-Prüfungen, soweit zur Vermeidung erneuter Abweichungen erforderlich.
    5. Einen nachvollziehbaren Bericht über Änderungen, Beibehaltungen, Kürzungen und begründete Ablösungen.
    6. Die verwendeten Commit-IDs und eine ehrliche Aussage darüber, was geprüft wurde und was noch offen ist.

    Mir ist wichtig, dass du mein bestehendes Projekt ernst nimmst und darauf aufbaust. Du hast die Freiheit, RetroTunnel technisch zu verbessern und seine Struktur sinnvoll weiterzuentwickeln. Diese Freiheit soll aber nicht dazu führen, dass meine bereits ausgearbeitete Projektorganisation übergangen wird.

    Ich möchte am Ende ein einziges, konsistentes RetroTunnel-Konzept mit einer nachvollziehbaren Projektsteuerung – keine zwei nebeneinander existierenden Systeme.

    Setze diese Korrektur eigenständig um. Stelle nur dann eine Rückfrage, wenn eine echte, durch die geltenden Betreiberregeln nicht gedeckte Betreiberentscheidung erforderlich ist.
