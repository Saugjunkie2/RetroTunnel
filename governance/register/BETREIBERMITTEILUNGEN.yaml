    CI-Workflow sind dienende Hilfsmittel und dürfen keine zweite, unabhängig gepflegte Projektorganisation bilden.
    Verlangt sind in dieser Reihenfolge: Bestandsaufnahme, vollständiges eigenes Lesen der bisher nicht vollständig
    gelesenen Root-Dokumente (mit ehrlichem Lesestand), eine eindeutige Zuordnung der Zuständigkeiten je
    Projektfunktion, die tatsächliche Umsetzung in den betroffenen Dateien und Prüfmechanismen sowie eine
    Qualitätskontrolle; am Ende ein Bericht mit Commit-IDs und offenem Rest. Ausdrücklich NICHT geändert sind die
    Betreiberregeln (einschließlich E1–E3), die übergeordneten Betreiberentscheidungen, die Gates G1–G4, die
    technischen Ziele und die Pflicht zu Invarianten, Tests, Rückverfolgbarkeit und unabhängigen Abschlussprüfungen;
    nichts Erarbeitetes wird gelöscht oder zurückgesetzt. Historische Arbeitsanweisungen gewinnen durch das Lesen
    keine höhere Autorität, ihre fachlich weiter sinnvollen Anforderungen sind aber zu berücksichtigen. Künftige
    Regel: erst prüfen, welche vorhandene Datei zuständig ist, dann diese weiterentwickeln; Neues nur mit
    nachgewiesenem eigenem Zweck.
