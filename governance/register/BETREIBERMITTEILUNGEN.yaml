    # RETROTUNNEL – VERBINDLICHE BETREIBERENTSCHEIDUNG ZU FÜNF OFFENEN REGELFRAGEN

    **Bezug:** `03_CHANGELOG.txt`, v2.8.9 vom 15.11.2026, Abschnitt 4 „FRAGEN AN DEN BETREIBER“.

    **Auftrag:** Übernimm die nachfolgenden fünf Antworten als ausdrückliche Betreiberentscheidungen. Gleiche sie mit den bisherigen Betreiberregeln, dem Startauftrag vom 11.11.2026 und den bestehenden Steuerungsdateien ab.

    Diese Nachricht ist eine neue, ausdrückliche Betreiberanweisung. Sie beantwortet ausschließlich die fünf genannten Fragen. Sie ist weder eine pauschale Freigabe deiner übrigen 26 eigenen Entscheidungen noch eine Ermächtigung, andere Betreiberregeln stillschweigend zu ändern.

    Die vorhandenen technischen, funktionalen und prozessualen Ziele von RetroTunnel bleiben unverändert, soweit ich nachfolgend nichts ausdrücklich anders entscheide.

    ---

    ## 1. Entscheidung zu E-01 – Phase A+B bei neuen Arbeitskontexten

    **ENTSCHEIDUNG: Die grundsätzliche Pflicht zur vollständigen Anfangslektüre und Phase A+B bleibt erhalten. E-01 wird in ihrer bisherigen pauschalen Abschwächung nicht genehmigt.**

    Meine bisherige Arbeitsweise in normalen Claude-Chatfenstern war bewusst so aufgebaut:

    Ich öffnete ein neues Chatfenster ohne vorherigen Kontext und wies Claude an, zunächst die Briefing-Datei im RetroTunnel-Konzeptordner vollständig zu lesen, alle dort vorgeschriebenen Schritte auszuführen und diese Arbeitsweise zu übernehmen.

    Das Briefing ist dabei eine maßgebliche Steuerungsdatei innerhalb der geltenden Betreiberautorität.

    Dieses Verfahren verfolgt zwei Ziele:

    1. Jede neue Instanz muss sich das notwendige Projektwissen tatsächlich erarbeiten, statt sich auf ungesicherte Erinnerungen oder frühere Zusammenfassungen zu verlassen.
    2. Das erneute, unabhängige Lesen und Prüfen soll Fehler, Widersprüche, Auslassungen und Inkonsistenzen aufdecken, die vorherige Instanzen übersehen haben.

    Deshalb gehört auch **Phase A+B** zum verpflichtenden Einstieg eines tatsächlich neuen Arbeitskontexts.

    **Anpassung an Claude Code:**

    Wir arbeiten inzwischen nicht mehr ausschließlich mit manuell eröffneten Chatfenstern, sondern mit einer autonomen Claude-Code-Ausführung und möglichen Fortsetzungen.

    Deshalb unterscheide ausdrücklich zwischen:

    **A. Tatsächlich neuer Arbeitskontext ohne zuverlässig verfügbaren vorherigen Kontext**

    Hier gilt die vollständige Startup-Pflicht des Briefings:

    - `CLAUDE_BRIEFING.txt` und den zugehörigen zweiten Briefing-Teil vollständig lesen.
    - Die weiteren vorgeschriebenen Steuerungsdateien gemäß Briefing vollständig lesen.
    - Die vorgeschriebenen Fundament-Dateien und notwendigen Quellen tatsächlich lesen.
    - Den aktuellen GitHub-Zustand und die bisherigen Arbeitsergebnisse überprüfen.
    - Phase A+B entsprechend dem vollständigen vorgesehenen Prüfumfang durchführen.
    - Neue Fehler und Inkonsistenzen dokumentieren und gemäß den verbindlichen Regeln behandeln.

    Die bestehenden ausdrücklich geregelten fachlichen Ausnahmen vom Prüfumfang bleiben bestehen. Eine vollständige Prüfung darf nicht bloß behauptet oder durch ein oberflächliches Lesen ersetzt werden.

    **B. Fortsetzung einer bereits laufenden Claude-Code-Sitzung**

    Wenn derselbe Arbeitskontext tatsächlich weitergeführt wird und die notwendigen Informationen zuverlässig verfügbar sind, muss nicht allein wegen einer geplanten Fortsetzung, eines Nutzungslimit-Resets oder eines weiteren Arbeitsdurchgangs die vollständige Phase A+B erneut ausgeführt werden.

    Die vorhandenen Wiederaufnahme-, Git-, Status- und Konsistenzprüfungen bleiben verpflichtend.

    Ein bloßes Wiederaufnahmeetikett reicht nicht als Beweis für einen noch vollständigen Kontext.

    Ist der erforderliche Inhalt nicht mehr zuverlässig verfügbar, muss er erneut eingelesen werden. Bei einem tatsächlich neuen kontextlosen Arbeitskontext gilt wieder Fall A.

    **C. Modulbezogene Qualitätsprüfungen**

    Die weiterhin bestehenden Phase-A+B-Prüfungen beim Modulabschluss sowie die vorgesehenen Modul- und Gesamtprüfungen bleiben zusätzlich verpflichtend.

    Sie ersetzen nicht die notwendige Anfangsprüfung eines neuen Arbeitskontexts.

    **Konsequenz:** Berichtige E-01 und die davon betroffenen Stellen. Die bisherige Aussage, Phase A+B werde selbst in einer wirklich neuen kontextlosen Sitzung grundsätzlich nicht mehr vollständig durchgeführt, ist durch diese Betreiberentscheidung überholt.

    Die GitHub-Repository-Pfade sind maßgeblich für die tatsächliche Cloud-Ausführung. Lokale Windows-Pfade aus früheren Chat-Anweisungen sind nicht als vorhandener Cloud-Dateisystemzugriff zu behandeln. Erfinde keine Pfade.

    ---

    ## 2. Entscheidung zu E-02 – Unabhängige Prüfung vor oder nach der Einarbeitung

    **ENTSCHEIDUNG: Eine begrenzte, auf den laufenden autonomen Claude-Code-Konzeptauftrag beschränkte Erlaubnis zur gebündelten Nachprüfung wird erteilt. Eine allgemeine Abschwächung der Prüfpflicht wird ausdrücklich nicht genehmigt.**

    Du darfst geeignete Änderungen zunächst einarbeiten und die vorgeschriebene unabhängige Prüfung anschließend gebündelt durchführen lassen, sofern dadurch keine wesentlichen Sicherheits-, Architektur- oder Qualitätsrisiken entstehen.

    Diese Erlaubnis gilt ausdrücklich für deine Arbeitsorganisation als Claude Code im laufenden RetroTunnel-Konzeptauftrag. Sie darf nicht als allgemeine Änderung meiner Arbeitsregeln oder als Freigabe für andere Projekte und Aufträge verstanden werden.

    **Vor der fachlichen Übernahme beziehungsweise verbindlichen Festlegung unabhängig zu prüfen sind insbesondere Änderungen, die:**

    - sicherheitsrelevante Eigenschaften oder Garantien beeinflussen;
    - grundlegende Architekturentscheidungen verändern;
    - Authentifizierung, Autorisierung, Isolation oder Zugriffskontrolle betreffen;
    - Firewall-, VPN-, DNS-, Session- oder Policy-Sicherheitsgrenzen verändern;
    - Fail-Closed-Verhalten, Datenintegrität oder wesentliche Konsistenzgarantien berühren;
    - bestehende Sicherheitsinvarianten oder Sicherheitsannahmen ändern;
    - relevante übergreifende Abhängigkeiten oder grundlegende Zustandsmodelle verändern;
    - aus anderen verbindlichen Gründen eine vorherige Prüfung erfordern.

    Die Einstufung richtet sich nach der tatsächlichen Wirkung einer Änderung, nicht allein nach ihrer Bezeichnung, ihrem Dateityp oder einer selbst vergebenen niedrigen Fehlerklasse.

    **Eine gebündelte nachträgliche Prüfung ist dagegen insbesondere bei geeigneten Änderungen ohne diese Risiken zulässig.**

    Dabei gelten weiterhin folgende Bedingungen:

    1. Jede Änderung bleibt vollständig nachvollziehbar.
    2. Noch nicht unabhängig bestätigte Änderungen werden nicht als bestätigt ausgegeben.
    3. Erforderliche Prüfungen werden nicht ersatzlos gestrichen.
    4. Offene Befunde und fehlende Bestätigungen bleiben sichtbar.
    5. Vor dem jeweiligen verpflichtenden Abschluss müssen die vorgeschriebenen Qualitätsbedingungen erfüllt sein.
    6. Die beiden unabhängigen Vollaudits, die technische Endkontrolle sowie die geschützten Freigabevoraussetzungen bleiben unverändert.
    7. Ein Nutzungslimit allein rechtfertigt keine Absenkung sicherheitsrelevanter Prüfvorgaben.

    **Konsequenz:** E-02 darf ausschließlich innerhalb dieser Grenzen angewandt werden. Dokumentiere diese auftragsspezifische Ausnahme eindeutig. Stelle sie nicht als allgemeine Betreiberregel dar.

    ---

    ## 3. Entscheidung zu E-12 – Workarounds und dateiübergreifende Änderungen

    **ENTSCHEIDUNG: Deine bereits erteilten autonomen Entscheidungsbefugnisse bleiben bestehen. Eine darüber hinausgehende pauschale Freigabe wird nicht erteilt.**

    Der Startauftrag vom 11.11.2026 gewährt dir bereits weitreichende technische und funktionale Autonomie sowie die Befugnis, erforderliche Konzeptdateien eigenständig zu bearbeiten.

    Innerhalb dieser Befugnisse darfst du selbstständig handeln, einschließlich geeigneter technischer Alternativen, notwendiger dateiübergreifender Änderungen und zulässiger Workarounds.

    Dabei sind alle geltenden Sicherheits-, Funktions-, Nachweis- und Qualitätsanforderungen einzuhalten.

    **Ausdrücklich vorbehaltene Betreiberentscheidungen bleiben jedoch vorbehalten.**

    Wo eine verbindliche, weiterhin gültige Betreiberanweisung meine ausdrückliche Zustimmung verlangt, darfst du diese Zustimmung nicht durch Folgendes ersetzen:

    - eine eigene schriftliche Begründung;
    - einen Eintrag in einem Register;
    - eine eigene technische Bewertung;
    - eine als Workaround bezeichnete Änderung;
    - einen Prüfbericht;
    - die bloße Berufung auf deine Autonomie.

    Die Dokumentation ist eine zusätzliche Pflicht, keine Ersatzgenehmigung.

    Vor einer Änderung ist deshalb zu unterscheiden:

    **Fall A – Innerhalb der bereits autorisierten Autonomie:** Du darfst die Änderung eigenständig, begründet und nach den geltenden Qualitätsregeln durchführen.

    **Fall B – Ausdrücklich vorbehaltene Betreiberentscheidung:** Du darfst nicht eigenmächtig darüber entscheiden. Halte den konkreten Entscheidungsbedarf fest und arbeite an unabhängigen Aufgaben weiter.

    **Fall C – Unklarer Widerspruch zwischen einer älteren Arbeitsanweisung und dem aktuellen Betreiberauftrag:** Wende die geltende Autoritätshierarchie an. Eine historische Anweisung darf keine tatsächlich erteilte Autonomie nachträglich aufheben; umgekehrt darf die Autonomie keine ausdrückliche aktuelle Betreibervorgabe verdrängen.

    **Konsequenz:** Berichtige E-12 so, dass diese drei Fälle eindeutig unterschieden werden. Eine pauschale Ersetzung von „Marcos Zustimmung erforderlich“ durch „Claude dokumentiert seine Entscheidung“ ist nicht genehmigt.

    ---

    ## 4. Entscheidung zu E-06 / KR-03 – Grenze von 1.500 Zeilen

    **ENTSCHEIDUNG: Eine begründete Ausnahme für reine Protokoll-, Verlaufs- und Registerdateien wird genehmigt.**

    Die 1.500-Zeilen-Grenze soll weiterhin dazu beitragen, umfangreiche normative Konzept- und Steuerungsdokumente sinnvoll zu strukturieren und lesbar zu halten.

    Für reine Verlaufsprotokolle und maschinenlesbare Register kann eine starre Aufteilung jedoch mehr Probleme verursachen als lösen.

    Deshalb dürfen insbesondere folgende Dateien die Grenze überschreiten, soweit sie die genannte Funktion tatsächlich erfüllen:

    - `03_CHANGELOG.txt` als zentrales Projekt- und Änderungsprotokoll;
    - `governance/register/BEFUNDE.yaml` als strukturiertes Befundregister;
    - `governance/register/QUELLENINVENTAR.yaml` als Quellen- und Lesestandsregister;
    - vergleichbare reine Verlaufs- und Nachweisregister.

    Diese Ausnahme bedeutet nicht, dass solche Dateien beliebig unstrukturiert oder unverständlich werden dürfen.

    Es gelten weiterhin:

    1. Eindeutige Struktur und Auffindbarkeit.
    2. Konsistente Kennungen und Verweise.
    3. Nachvollziehbare Änderungen und Historie.
    4. Unveränderte maschinelle Prüfbarkeit.
    5. Keine parallelen Register mit konkurrierenden Zuständigkeiten.
    6. Keine Verlagerung verbindlicher Arbeitsregeln in vermeintliche Protokolldateien, um die 1.500-Zeilen-Grenze zu umgehen.

    Für normative Steuerungs- und Konzeptdokumente gilt KR-03 weiterhin.

    **Konsequenz:** Dokumentiere die Ausnahme ausdrücklich und nachvollziehbar. Teile nicht allein wegen der Zeilenzahl bestehende Protokolle oder Register auf, wenn dadurch neue Redundanzen, technische Risiken oder unnötiger Verwaltungsaufwand entstehen würden.

    ---

    ## 5. Entscheidung zur Originaltreue der Startauftrag-Arbeitskopie

    **ENTSCHEIDUNG: Eine nicht verifizierte Arbeitskopie darf nicht als nachgewiesen originalgetreu bezeichnet werden.**

    Im Repository liegt:

    `governance/betreiberregeln/STARTAUFTRAG_2026-11-11_ARBEITSKOPIE.md`

    Diese Datei wurde als Arbeitskopie des ursprünglichen Startauftrags angelegt.

    Ihre tatsächliche Übereinstimmung mit dem von mir erteilten Originalauftrag ist damit nicht automatisch bewiesen.

    Deshalb gilt:

    1. Liegt der authentische Originalauftrag tatsächlich vor, vergleiche beide Fassungen vollständig und dokumentiere das Ergebnis.
    2. Liegt er nicht zugänglich vor, kennzeichne die Originaltreue ausdrücklich als **NICHT VERIFIZIERT**.
    3. Erfinde keine Vergleichsergebnisse oder Quellenbelege.
    4. Behaupte nicht, ich hätte die Arbeitskopie bestätigt.
    5. Behandle diese Nachricht nicht als nachträgliche Bestätigung der gesamten Arbeitskopie.
    6. Verändere den behaupteten Originalwortlaut nicht eigenmächtig, um eine Übereinstimmung herzustellen.
    7. Dokumentiere eine relevante Quellenlücke, ohne die übrige zulässige Konzeptarbeit unnötig anzuhalten.

    Die geltenden Regeln über Betreiberautorität und geschützte Abschlussfreigabe bleiben unverändert.

    ---

    ## 6. Verbindliche Einarbeitung dieser Entscheidungen

    Führe jetzt die folgenden Schritte aus:

    **A. Betreiberentscheidung dauerhaft erfassen**

    Registriere diese fünf Entscheidungen in der bestehenden maßgeblichen Betreiberkommunikation, mit der nächsten tatsächlich freien Kennung.

    Dokumentiere ihren Inhalt sachgetreu. Unterscheide meinen Entscheidungswortlaut, deine technische Umsetzung und gegebenenfalls verbleibende Auslegungsfragen.

    **B. Bestehende Steuerungsdateien berichtigen**

    Prüfe insbesondere die betroffenen Stellen in:

    - `CLAUDE_BRIEFING.txt`
    - `CLAUDE_BRIEFING_ERKENNTNISSE.txt`, soweit betroffen
    - `REVIEW_STANDARD.txt`
    - `00_MANIFEST.txt`
    - `03_CHANGELOG.txt`
    - `PRIORITAETENLISTE.txt`
    - den einschlägigen Governance-Registern und Prüfregeln

    Passe ausschließlich tatsächlich betroffene Stellen an und überprüfe die notwendigen Folgeänderungen.

    Die vorhandene Dokumentenhierarchie bleibt erhalten. Errichte keine neue parallele Governance-Struktur.

    **C. Widersprüche und überholte Eigenentscheidungen auflösen**

    Prüfe ausdrücklich E-01, E-02, E-06 und E-12 gegen meine heutigen Entscheidungen.

    Kennzeichne frühere, jetzt überholte Auslegungen nachvollziehbar. Behaupte keine rückwirkende Zustimmung zu Handlungen, die vor dieser Betreiberentscheidung erfolgt sind.

    Die verbleibenden eigenen Entscheidungen E-03 bis E-26 werden durch diese Nachricht nicht pauschal genehmigt.

    **D. Qualitätssicherung durchführen**

    Prüfe die tatsächlichen Auswirkungen auf Startup, Wiederaufnahme, Prüfzeitpunkte, Entscheidungsbefugnisse, Dokumentation und Abschlussbedingungen.

    Führe die vorhandenen geeigneten automatischen Konsistenzprüfungen tatsächlich aus. Dokumentiere Ergebnisse, Grenzen und offene Befunde.

    Führe die nach diesen Entscheidungen weiterhin erforderlichen unabhängigen Prüfungen durch. Die heute begrenzt zugelassene Bündelung darf dabei angewandt werden, soweit ihre Voraussetzungen erfüllt sind.

    **E. Keine künstliche Fertigstellung**

    Diese Betreiberentscheidung ist keine Abnahme von QS-07 und keine Freigabe des Gesamtprojekts.

    Schließe die Governance-Bereinigung erst, wenn ihre tatsächlich geltenden Abschlusskriterien nachweislich erfüllt sind. Halte fachliche Modulbefunde weiterhin in ihren zuständigen Arbeitspaketen, ohne Governance-Befunde lediglich zur künstlichen Statusbereinigung umzubuchen.

    Vermeide neue, inhaltsgleiche Berichte und redundante Verwaltungsstrukturen. Bestehende maßgebliche Dateien sind vorrangig fortzuschreiben.

    **F. Nachvollziehbares Ergebnis**

    Hinterlege die Änderungen in nachvollziehbaren Git-Commits und gib anschließend eine verständliche Zusammenfassung:

    1. Welche fünf Entscheidungen wurden wie umgesetzt?
    2. Welche bestehenden Dateien mussten dafür geändert werden?
    3. Welche bisherigen Regelabschwächungen wurden zurückgenommen beziehungsweise begrenzt?
    4. Welche Prüfungen wurden tatsächlich durchgeführt und mit welchem Ergebnis?
    5. Welche Punkte bleiben nachweislich offen?
    6. Was ist der nächste fachlich notwendige Schritt?

    Arbeite danach im Rahmen des bestehenden autonomen Auftrags weiter.

    **WICHTIG:** Alle übrigen Betreiberentscheidungen und Schutzziele bleiben unverändert. Insbesondere gibt diese Nachricht keine Erlaubnis zur Abschwächung von Sicherheitsanforderungen, zur Verkürzung verpflichtender Abschlussprüfungen, zur Selbstfreigabe oder zur Implementierung produktiver RetroTunnel-VPN-Software.

