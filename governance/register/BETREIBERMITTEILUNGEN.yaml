- id: BM-0021
  datum: "2026-11-15"
  kanal: Chat-Nachricht der Cloud-Sitzung (Eingang 16:34:44 UTC laut Sitzungsprotokoll, während der Fortsetzung nach BM-0020)
  wortlaut: |
    RETROTUNNEL – BETREIBERANWEISUNG: QS-07 ZIELGERICHTET ABSCHLIESSEN UND ZUR KONZEPTARBEIT ZURÜCKKEHREN
    Ich möchte, dass du jetzt wieder stärker auf das eigentliche Ziel von RetroTunnel hinarbeitest: die vollständige, technisch fundierte Fertigstellung des VPN-Konzepts.
    Die Bereinigung unserer Projektsteuerung hat inzwischen erheblich mehr Zeit und Nutzungskontingent beansprucht, als ich erwartet habe.
    Ich erkenne an, dass dabei echte Fehler gefunden und wichtige Verbesserungen vorgenommen wurden. Allerdings möchte ich verhindern, dass daraus eine dauerhaft wachsende Verwaltung mit immer neuen Prüfungen, Berichten, Registern und zusätzlichen Arbeitspaketen entsteht.
    Deshalb gilt ab sofort:
    1. QS-07 zielgerichtet abschließen
    Ermittle anhand des tatsächlichen aktuellen GitHub-Stands, welche bereits verbindlichen Abschlussbedingungen von QS-07 noch nicht erfüllt sind.
    Bearbeite genau diese verbliebenen Punkte einschließlich der vorgeschriebenen unabhängigen Bestätigungen, erforderlichen Korrekturen und des Abschlussberichts.
    Erfinde keine zusätzlichen Abschlussbedingungen und erweitere den Auftrag nicht eigenständig um weitere Verwaltungstätigkeiten.
    2. Keine unnötige Ausweitung der Qualitätssicherung
    Alle bestehenden Qualitäts-, Sicherheits-, Quellen-, Prüf- und Nachweisanforderungen bleiben vollständig erhalten.
    Tatsächlich entdeckte Fehler müssen weiterhin korrekt dokumentiert, behoben und entsprechend den geltenden Regeln geprüft werden.
    Ich möchte aber keine zusätzlichen Prüfzyklen, Meta-Analysen, neuen Register oder weiteren Verwaltungsmechanismen, sofern sie nicht durch eine bereits verbindliche Regel oder einen konkret nachgewiesenen Mangel erforderlich sind.
    Eine Prüfung muss einen erkennbaren fachlichen Zweck erfüllen. Die Prüfung eines Prüfwerkzeugs soll nicht automatisch neue Prüfsysteme und weitere Prüfungen dieser Prüfsysteme auslösen.
    3. Fachliche Probleme gehören in die zuständigen Fachpakete
    Offene Architekturprobleme in WireGuard, Firewall, Datenbank, Authentifizierung, Sessions, Policy, DNS und anderen Bereichen sind in den dafür vorgesehenen Arbeitspaketen zu bearbeiten.
    Sie dürfen nicht allein deshalb den Abschluss der Governance-Bereinigung verlängern, weil sie während dieser Bereinigung entdeckt wurden.
    Das ist ausdrücklich keine Erlaubnis, tatsächliche Governance-Befunde umzubuchen, Abschluss-Sperren zu umgehen oder ungelöste Fehler als behoben zu kennzeichnen. Maßgeblich bleiben die tatsächlichen Zuständigkeiten und Abschlussregeln.
    4. Nach QS-07 die fachliche Konzeptarbeit fortsetzen
    Sobald QS-07 nachweislich abgeschlossen ist, arbeite die bestehende Prioritätenliste und ihre Abhängigkeiten weiter ab.
    Die bereits vorgeschriebenen Quellenprüfungen, Phase A+B, Modulprüfungen und späteren unabhängigen Vollaudits bleiben verpflichtend. Diese Anweisung ändert deren Umfang oder Abschlussbedingungen nicht.
    Konzentriere dich bei der weiteren Arbeit auf das fachlich vollständige, konsistente und sicherheitsorientierte RetroTunnel-Konzept, einschließlich der Anforderungen für mindestens 1.000 gleichzeitige VPN-Verbindungen.
    Die vorhandene technische und funktionale Autonomie aus meinem Startauftrag bleibt unverändert.
    5. Nutzungskontingent verantwortungsvoll einsetzen
    Meine bestehende Einstellung für den Hauptarchitekten bleibt unverändert. Für Unteragenten gelten meine zuletzt erteilten Vorgaben zur aufgabengerechten Wahl des Denkaufwands.
    Vermeide überflüssige Agentenläufe, doppelte Prüfaufträge und die wiederholte Erstellung inhaltsgleicher Berichte. Die Qualität und Unabhängigkeit vorgeschriebener Prüfungen dürfen darunter nicht leiden.
    6. Verständliche Fortschrittsberichte
    Ich möchte künftig nach größeren Arbeitsschritten eine kurze, für mich verständliche Zusammenfassung:

    * Was wurde tatsächlich erledigt?
    * Welcher konkrete Fehler oder welche Anforderung wurde damit bearbeitet?
    * Welche Punkte sind noch offen?
    * Was ist der nächste notwendige Arbeitsschritt?

    Detaillierte technische Nachweise sollen weiterhin im Repository vorhanden sein. Ich benötige aber nicht in jeder Fortschrittsmeldung umfangreiche Metatexte über die Verwaltung des Projekts.
    WICHTIG:
    Dies ist eine Anweisung zur Priorisierung, Begrenzung unnötiger Zusatzarbeiten und verständlicheren Berichterstattung.
    Sie ist keine Abschwächung meiner bisherigen Sicherheits-, Qualitäts-, Vollständigkeits- oder Freigabeanforderungen.
    Du sollst nichts künstlich abschließen, keine Befunde verstecken und keine vorgeschriebenen Prüfungen auslassen.
    Du sollst aber auch keine zusätzliche Verwaltungsarbeit erzeugen, die für die tatsächliche Konzeptfertigstellung nicht erforderlich ist.
    Arbeite jetzt eigenständig und zielgerichtet weiter.
  einordnung: ARBEITSANWEISUNG
  regelaenderung: false
  auslegung: >-
    Anweisung zur Priorisierung, zur Begrenzung zusätzlicher Verwaltungsarbeit und zur Form der Fortschrittsberichte.
    Sie ändert keine Regel und schwächt nichts ab (so ausdrücklich ihr Schluss): Befundregeln, Abschluss-Sperren,
    Quellenprüfungen, Phase A+B, Modulprüfungen, Vollaudits und Gates gelten unverändert; nichts wird künstlich
    abgeschlossen, kein Befund versteckt oder umgebucht. Nr. 1: QS-07 wird an den Abschlusskriterien abgeschlossen, die
    am Stand des Repositorys bereits verbindlich sind (PRIORITAETENLISTE QS-07, fünf Punkte) - mit den vorgeschriebenen
    unabhängigen Bestätigungen, den nötigen Korrekturen und dem Abschlussbericht; neue Bedingungen kommen nicht hinzu.
    Nr. 2: Zusätzliche Prüfzyklen, Meta-Analysen, Register oder Verwaltungsmechanismen nur, wenn eine bereits
    verbindliche Regel oder ein konkret nachgewiesener Mangel sie verlangt; die Prüfung eines Prüfwerkzeugs löst nicht
    von selbst neue Prüfsysteme aus. Nr. 3: Fachliche Probleme werden in ihren Fachpaketen bearbeitet und verlängern
    QS-07 nicht; Governance-Befunde werden deshalb aber nicht umgebucht. Nr. 4: Nach QS-07 geht die Konzeptarbeit nach
    der PRIORITAETENLISTE weiter, mit dem Ziel von mindestens 1.000 gleichzeitigen Verbindungen. Nr. 5: Keine
    überflüssigen Agentenläufe, doppelten Prüfaufträge oder inhaltsgleichen Berichte; Qualität und Unabhängigkeit
    vorgeschriebener Prüfungen leiden darunter nicht; die Vorgaben aus BM-0019 Nr. 7 gelten weiter. Nr. 6: Nach
    größeren Arbeitsschritten eine kurze Zusammenfassung in vier Punkten (erledigt; bearbeiteter Fehler oder
    Anforderung; offen; nächster Schritt); die Nachweise bleiben im Repository.
    EIGENE AUSLEGUNG, wo der Wortlaut Spielraum lässt: (a) "Bereits verbindliche Regel" schließt die Regel ein, dass
    ein Befund erst nach der Bestätigung eines unabhängigen Prüfers als behoben gilt (REVIEW_STANDARD 10.3 g; im
    Register maschinell erzwungen); Korrekturen aus der dritten Nachprüfung werden deshalb noch einmal bestätigt - aber
    EINMAL und gezielt je Korrektur, ohne neuen Rundumauftrag. (b) Der abschließende Lesedurchgang des Eigenreviews
    (REVIEW_STANDARD 5.2 und 5.3, Regel des Betreibers) bleibt Pflicht; er läuft einmal am Schluss über die geänderten
    Dateien. (c) Die schon eingerichtete Zählung je Teilbedingung (qa/abdeckung.py) bleibt bestehen; neue
    Prüfwerkzeuge oder Prüfungen dieses Werkzeugs entstehen daraus nicht.
