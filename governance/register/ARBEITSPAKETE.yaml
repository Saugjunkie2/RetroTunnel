# Maschinenlesbarer INDEX der Arbeitspakete. MASSGEBLICH ist PRIORITAETENLISTE.txt (00_MANIFEST 6a, KR-07):
# Reihenfolge, Stand, naechster Schritt und Quellen je Paket stehen NUR dort. Dieser Index fuehrt keinen eigenen
# Stand; er dient der maschinellen Pruefung (Abhaengigkeiten, Zyklen, Ergebnisdateien) und als Ziel der
# Querverweise aus Befund-, Quellen- und Mitteilungsregister.
#   id             Schluessel des Pakets; steht in der Liste in der Zeile "Index: AP-..." des Eintrags
#   titel          Kurzname wie in der Liste (nur zur Lesbarkeit)
#   bezug          Kennung desselben Pakets in PRIORITAETENLISTE.txt (M2-..., M3-..., M4-..., QS-...)
#   status         OFFEN | IN_ARBEIT | ERLEDIGT | BLOCKIERT - Spiegel des Status-Tags der Liste
#   haengt_ab_von  jede Abhaengigkeit muss im Listeneintrag genannt sein
#   ergebnis       Dateien, die bei ERLEDIGT existieren muessen
# Andere Felder sind nicht zulaessig; qa/pruefe_register.py erzwingt den Gleichstand mit der Liste.
