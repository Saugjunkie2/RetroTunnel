# Funktions-/Verbesserungsanalyse (Betreiberregeln §4.2/§4.3, §10.3). Grundlage des Funktions-Freeze.
# einstufung: ZWINGEND_NOTWENDIG | BETRIEBLICH_NOTWENDIG | WESENTLICH_VORTEILHAFT | OPTIONAL | NICHT_SINNVOLL
# entscheidung: INTEGRIEREN | ROADMAP | VERWORFEN | OFFEN
# Die systematische Gesamtanalyse ist Arbeitspaket AP-V01; die Einträge unten sind die bei der Modularbeit
# bereits identifizierten Punkte. Der Freeze ist NICHT erklärt.
schema: verbesserungen/1
freeze_erklaert: false
eintraege:
- id: VB-0001
  titel: WireGuard-Schlüsselmaterial at-Rest verschlüsseln (Profile und PresharedKeys unter dem CEK)
  zweck: DB-Dump oder Dateizugriff außerhalb der Backup-Verschlüsselung gibt keine WG-Zugangsdaten preis; Gleichbehandlung mit dem L2TP-Passwort.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Geringe Folgekosten (CEK-Infrastruktur ist beschlossen), schließt die im Changelog v2.1.13 akzeptierte Lücke "Klartext-.conf mit Dateirechten".
  folgekosten: Schemaänderung wg_preshared_key_enc; Reveal-Helfer in BASE-110; CEK-Verfügbarkeit wird Voraussetzung für Peer-Add.
  integriert_in: [base/BASE-040_TUNNEL_WIREGUARD/BASE-040_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-WT-11]
  entdeckt_in: AP-K040
- id: VB-0002
  titel: Kernel-Zähler als Puffer und Snapshot-Spool beim Interface-Stop statt RAM-Puffer
  zweck: Kein Verbrauchsverlust bei DB-Störung, beschränkter Speicher, absturzfest.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Der RAM-Puffer (WG-GRACE-01) verliert bei Controller-Absturz alles und braucht eine künstliche Obergrenze mit vorzeitigem Dienst-Stop.
  folgekosten: PreDown-Hook, Spool-Verzeichnis im Backup-Scope, Laufzeitmarke für die Interface-Generation.
  integriert_in: [decisions/D004_RUNTIME_TRUTH_VS_SQL_PERSISTENZ.txt#P-02, base/BASE-040_TUNNEL_WIREGUARD/BASE-040_060_DB_DOWN_GRACE_UND_FAIL_CLOSED.txt#SNAPSHOT]
  entdeckt_in: AP-K040
- id: VB-0003
  titel: Fail-Closed-Kopplung bei Controller-Ausfall (Watchdog, begrenzte Neustarts, Stop von awg0)
  zweck: WireGuard läuft nicht dauerhaft ohne Grace-Überwachung, Admission-Wächter und Buchung.
  einstufung: ZWINGEND_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Ohne Kopplung hebt ein abgestürzter Controller das Fail-Closed-Modell für WireGuard auf.
  folgekosten: Zusätzliche Helfer-Unit; Wiederanlauf nach Daueraussfall erfordert Admin-Eingriff.
  integriert_in: [base/BASE-040_TUNNEL_WIREGUARD/BASE-040_090_INVARIANTEN.txt#WT-45]
  entdeckt_in: AP-K040
- id: VB-0004
  titel: Rückfallrouten "unreachable" für die Tunnel-Adressräume
  zweck: Kein Abfluss von Paketen an Tunneladressen über die Default-Route, wenn ein Tunnel-Interface fehlt.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Verhindert Adress-/Datenlecks in einem realistischen Betriebszustand (Grace-Stop, Wartung); eine Zeile Konfiguration.
  folgekosten: Zwei statische Routen; Umsetzung in BASE-005/BASE-050.
  integriert_in: [base/BASE-040_TUNNEL_WIREGUARD/BASE-040_090_INVARIANTEN.txt#WT-11]
  entdeckt_in: AP-K040
- id: VB-0005
  titel: Betriebsart "Nutzer liefert eigenen PublicKey" (Server kennt den Client-PrivateKey nie)
  zweck: Schutz der Client-Schlüssel auch gegen Server-Kompromittierung.
  einstufung: OPTIONAL
  entscheidung: ROADMAP
  begruendung: Widerspricht in dieser Betriebsart der Owner-Vorgabe "Profil jederzeit im Panel abrufbar"; nur für versierte Nutzer sinnvoll; kein Mangel des Grundkonzepts.
  folgekosten: Zweiter Provisioning-Pfad, kein QR/Profil-Abruf für solche Connections.
  entdeckt_in: AP-K040
- id: VB-0006
  titel: Obfuskationsparameter neuerer AmneziaWG-Generationen
  zweck: Höhere Resistenz gegen Protokollerkennung.
  einstufung: OPTIONAL
  entscheidung: ROADMAP
  begruendung: Nur zulässig, wenn alle Zielplattformen sie unterstützen (DEC-WT-06); erfordert Massen-Neuausstellung; Client-Matrix noch nicht geprüft.
  folgekosten: REISSUE aller Profile, erweiterter Settings-Katalog.
  entdeckt_in: AP-K040
- id: VB-0007
  titel: Zweiter Listener mit Standard-WireGuard für Clients ohne AmneziaWG-App
  zweck: Größere Client-Kompatibilität.
  einstufung: NICHT_SINNVOLL
  entscheidung: VERWORFEN
  begruendung: Zweiter WAN-Port und zweites Interface mit eigener Firewall-, Accounting- und SimUse-Behandlung; DPI-erkennbare Signatur (DEC-WT-07).
  entdeckt_in: AP-K040
- id: VB-0008
  titel: Datenbankunabhängiger Notzugang (rtmgmt0) für die Verwaltung im Störfall
  zweck: SSH bleibt auch bei Ausfall von Datenbank, RADIUS, Tunnel-Diensten, AWG-Modul oder vollem Regelwerk erreichbar, ohne einen Verwaltungsdienst am WAN zu öffnen.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Schließt Befund BF-0011. Ohne ihn hinge jede Wiederherstellung an der Konsole des Hosters; die Zusage "SSH bleibt in jedem Fall erreichbar" wäre nicht erfüllbar.
  folgekosten: Zusätzlicher UDP-Port am WAN (antwortet Unbekannten nicht), ein weiteres Interface, Schlüsselpflege von Hand, Betriebsanleitung; Präzisierung von WT-01/DEC-WT-07 (genau ein WireGuard-Endpunkt für Clients).
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-16, base/BASE-050_FIREWALL_CORE/BASE-050_040_WAN_EXPOSITION_UND_NOTZUGANG.txt#6) NOTZUGANG rtmgmt0]
  entdeckt_in: AP-K050
- id: VB-0009
  titel: Eingehende Portfreigaben für Kunden (Diskussion vom 2026-04-15)
  zweck: Kunden können einzelne eingehende Ports auf ihre Tunneladresse leiten lassen (z. B. Tauschbörsen).
  einstufung: OPTIONAL
  entscheidung: OFFEN
  begruendung: Nutzen für einen Teil der Kunden; öffnet aber erstmals neue Flows vom WAN zu Clients (Missbrauchs- und Haftungsrisiko, zusätzlicher Verwaltungs- und Prüfaufwand). Im Firewall-Kern sind nur leere Erweiterungspunkte reserviert; die Entscheidung fällt in der Gesamtanalyse AP-V01.
  folgekosten: Schema, Panel-Funktion, Kontingent als Policy-Wert, Set-Pflege über vpn-policy-apply, zusätzliche Tests und Abuse-Regeln.
  entdeckt_in: AP-K050
- id: VB-0010
  titel: Selbstschutz der Firewall (Siegel, Ladekette mit Notfall-Riegel, Weiterleitung an das Regelwerk gekoppelt, Verlusterkennung im Sekundentakt)
  zweck: Kein offener Zustand beim Systemstart, beim Regelwerkswechsel, bei nicht ladbarem Regelwerk und nach Verlust des Regelwerks.
  einstufung: ZWINGEND_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Schließt den im Changelog v2.1.14 registrierten Fail-Open-Fall bei leeren Deny-Sets (Neu-8) auch für Laden und Wiederherstellung und verkürzt das in PF-18 hingenommene Fenster von Minuten auf das Prüfintervall.
  folgekosten: Drei Werkzeuge mit klaren Operationen, ein kurzer Timer, Zustandsmodell; Abstimmung mit BASE-080 (Vorbedingung zum Lösen des Siegels).
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-04, base/BASE-050_FIREWALL_CORE/BASE-050_070_RENDERN_LADEN_UND_VERLUSTSCHUTZ.txt#3) LADE-OPERATIONEN]
  entdeckt_in: AP-K050
- id: VB-0011
  titel: L2TP-Freigabe an die Interface-Instanz binden; strikte Rückwegprüfung an Tunnel-Interfaces
  zweck: Ein liegengebliebener Freigabe-Eintrag oder eine gefälschte Quelladresse kann keine L2TP-Sitzung vor ihrem Policy-Apply freischalten.
  einstufung: ZWINGEND_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Die Tunneladresse einer Connection ist fest; ein reiner Adress-Eintrag würde nach einem Absturz die nächste Sitzung sofort freischalten (Verletzung von LT-19). Auf ppp* erzwingt der Tunnel die Quelladresse nicht; ohne Rückwegprüfung ließe sich mit der Adresse einer freigegebenen Sitzung senden.
  folgekosten: accel-ppp ohne Interface-Wiederverwendung (ANF-FW-02); Bestätigung an der Zielplattform (E-FW-07).
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-08, base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-13]
  entdeckt_in: AP-K050
- id: VB-0012
  titel: Zustands-Sperren vor dem Durchlass bestehender Flows
  zweck: Einschränkung, Gate, entzogene Freigabe und Sperren wirken ab dem nächsten Paket, auch wenn der conntrack-Flush scheitert.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Der Hard-Cut hängt nicht mehr allein an einem Folgeschritt außerhalb des Kernels; Kosten sind wenige Set-Zugriffe je Paket.
  folgekosten: Kein Flowtable-Offload; geringfügig höhere CPU-Last je Paket.
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-09]
  entdeckt_in: AP-K050
- id: VB-0013
  titel: Abweisung statt stillem Verwerfen innerhalb des VPN (DoT/DoQ, eingeschränkte Clients, Mailports)
  zweck: Clients erhalten sofort eine Fehlermeldung statt Zeitüberschreitungen; automatische DNS-Verfahren fallen sofort auf den umgeleiteten Port 53 zurück.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Gleiche Schutzwirkung, deutlich weniger Wartezeiten und Supportfälle; am WAN bleibt es beim stillen Verwerfen.
  folgekosten: Ratenbegrenzung der Abweisungen.
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-12, base/BASE-050_FIREWALL_CORE/BASE-050_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-FW-17]
  entdeckt_in: AP-K050
- id: VB-0014
  titel: Portal-Umleitung für eingeschränkte Clients (http-Aufrufe zeigen das Portal)
  zweck: Ein eingeschränkter Kunde sieht bei einem beliebigen http-Aufruf den Grund und den nächsten Schritt.
  einstufung: OPTIONAL
  entscheidung: OFFEN
  begruendung: Verbessert die Nutzerführung, wirkt aber nur für unverschlüsselte Aufrufe; Regelstelle ist reserviert. Entscheidung in MOD-002 bzw. AP-V01.
  entdeckt_in: AP-K050
- id: VB-0015
  titel: Regelmäßiger Abgleich der lauschenden Dienste und wählbare Log-Kennzeichen mit datensparsamer Voreinstellung
  zweck: Ein falsch gebundener Dienst wird gemeldet; öffentliche Quelladressen von Internet-Scans werden nicht ohne Anlass gespeichert.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Der Listener-Abgleich war im Altkonzept (B100) Pflicht und fehlte bisher; die Voreinstellung der Kennzeichen setzt "keine PII in Logs" (B063) praktikabel um.
  integriert_in: [base/BASE-050_FIREWALL_CORE/BASE-050_070_RENDERN_LADEN_UND_VERLUSTSCHUTZ.txt#LISTENER-ABGLEICH, base/BASE-050_FIREWALL_CORE/BASE-050_070_RENDERN_LADEN_UND_VERLUSTSCHUTZ.txt#vpn_fw_log_labels]
  entdeckt_in: AP-K050
- id: VB-0016
  titel: Wartezeit bei Wiedereinwahl nach Leitungsabriss verkürzen (L2TP)
  zweck: Nach unbemerktem Leitungsverlust wird die Wiedereinwahl bis zur Erkennung der toten Sitzung abgelehnt (bis etwa 90 s); kürzere Erkennung verbessert die Nutzbarkeit, ohne "keine Übernahme" aufzugeben.
  einstufung: OPTIONAL
  entscheidung: OFFEN
  begruendung: Möglich sind kürzere LCP-Echo-Zeiten (BASE-030) oder eine eng begrenzte Übernahme bei identischer öffentlicher Quelle; Letzteres schwächt SZ-2 und braucht eine eigene Abwägung. Entscheidung in AP-V01 nach dem Nachzug von BASE-030.
  entdeckt_in: AP-K070
- id: VB-0017
  titel: Verwaltungskorrektur des gebuchten Verbrauchs (Gutschrift oder Nullstellung durch ADMIN)
  zweck: Der Betreiber kann einen Kunden im Einzelfall vor Monatsende entlasten, ohne Plan oder Limit zu ändern.
  einstufung: OPTIONAL
  entscheidung: OFFEN
  begruendung: Fachlich üblich, aber im belegten Konzept nicht verlangt; bräuchte einen eigenen protokollierten Schreibvorgang auf quota_used. Entscheidung in AP-V01 zusammen mit MOD-010.
  entdeckt_in: AP-K070
- id: VB-0018
  titel: Verbrauchsverlauf als Tagesreihe je Connection und Richtung
  zweck: Datenquelle für die vom Betreiber verlangten Panel-Funktionen (Verbrauch je Zeitraum, Verlauf, Summen je Customer, Erkennung auffällig hoher Nutzung).
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Anforderung aus ENTWURF_ADMIN_DASHBOARD Abschnitte 3 und 4. Die Daten entstehen nur beim Buchen und lassen sich später nicht aus dem Monatsaggregat zurückgewinnen; die Mehrkosten sind eine Schreiboperation je Buchung.
  integriert_in: [base/BASE-070_SESSION_CORE/BASE-070_050_VERBRAUCHSBUCHUNG_UND_QUOTA_PERIODE.txt#10) VERBRAUCHSVERLAUF, base/BASE-070_SESSION_CORE/BASE-070_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-SC-21]
  entdeckt_in: AP-K070
- id: VB-0019
  titel: Blockpage-Override (zeitlich begrenzte Freigabe einer blockierten Domain durch OWNER/ADMIN, Anfrage durch Nutzer)
  zweck: Der Betreiber muss den Schutzpfad nicht verlassen (VPN abschalten), um eine einzelne zu Unrecht blockierte Domain zu erreichen.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Ausdrückliche Betreiberanforderung mit benanntem Praxisproblem (entwuerfe/blockpage-override, 2026-05-01); weicht bewusst vom Vorgänger B230 ab. Ausarbeitung in AP-K060 (DNS-Kern) und MOD-002; dort sind Speicherort, Weitergabe an den Filter, Ablauf, Protokoll und Rollenerkennung festzulegen.
  entdeckt_in: AP-K070
- id: VB-0020
  titel: Interim-Intervall der L2TP-Abrechnung von 300 s auf 60 s verkürzen
  zweck: Messlatenz und mögliche Quota-Überschreitung bei L2TP auf das Niveau von WireGuard begrenzen.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: OFFEN
  begruendung: Bei 300 s kann eine kleine Quota um mehrere Minuten Volllast überzogen werden; die Mehrlast ist bei den erwarteten Sitzungszahlen gering. Der Default wird im Settings-Katalog festgelegt (AP-K090); BASE-070 ist für beide Werte ausgelegt.
  entdeckt_in: AP-K070

- id: VB-0021
  titel: L2TP-Kennwortwechsel beendet die laufende Sitzung (Gleichbehandlung mit der WireGuard-Schlüsselrotation)
  zweck: Keine Sitzung läuft unter einem abgelösten Kennwort weiter - insbesondere nicht die eines Dritten, wenn das Kennwort wegen Verdachts auf Weitergabe gewechselt wird.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Für WireGuard ist die neue Sitzungsgrenze bei Schlüsselwechsel bereits Vertrag (AAA-30); für L2TP fehlte das Gegenstück, eine bestehende Sitzung überlebte den Wechsel. Der Sitzungskern stellt Sperre, Hard-Cut und Ende-Grund ohnehin bereit; der Wechsel läuft als Umbau unter der Sperre, damit auch eine kurz zuvor mit dem alten Kennwort zugelassene Anmeldung keine Sitzung hinterlässt.
  folgekosten: Der Nutzer wird nach einem selbst ausgelösten Kennwortwechsel getrennt und verbindet sich neu; die Bestätigung muss vor dem Hard-Cut ausgeliefert werden (MOD-006). Nachzug in BASE-010 (ANF-SC-01 f).
  integriert_in: [base/BASE-070_SESSION_CORE/BASE-070_020_RUNTIME_ACTIVITY_UND_SIGNALVERTRAG.txt#Kennwortwechsel (L2TP), base/BASE-070_SESSION_CORE/BASE-070_030_SIMUSE_UND_SPERRVERTRAG.txt#KENNWORTWECHSEL L2TP ALS UMBAU]
  entdeckt_in: AP-K070

- id: VB-0022
  titel: Auftragsbuch für die Herstellung des Kernel-Zustands (Statuswechsel und Anstoß in einer Transaktion)
  zweck: Kein festgeschriebener Statuswechsel bleibt ohne Wirkung im Kernel, auch wenn der auslösende Prozess abstürzt, der Einzel-Lock belegt ist oder der erste Versuch scheitert; eine Sperrung wegen Missbrauchs wirkt in Sekunden statt erst mit dem nächsten Abgleich.
  einstufung: WESENTLICH_VORTEILHAFT
  entscheidung: INTEGRIEREN
  begruendung: Der Vorgänger (B166, SM_POLICY_RESTRICT Abschnitt 8) verlangt, dass Panel-Ereignisse die Herstellung auslösen, sichert das aber nur über den Abgleich im Minutenraster ab. Ein Auftrag, der in derselben Transaktion wie der Statuswechsel geschrieben wird, macht den Anstoß unverlierbar und gescheiterte Versuche sichtbar; die Mehrkosten sind eine kleine Tabelle und ein Lauf im Sekundentakt.
  folgekosten: Die Übergangsroutinen von BASE-010 und die Schreibwege des Panels müssen den Auftrag mitschreiben (Anforderung an BASE-010 und BASE-110); ein zusätzlicher Zeitgeber.
  integriert_in: [base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-03]
  entdeckt_in: AP-K080
- id: VB-0023
  titel: Schutz vor unumkehrbaren Massenfolgen der fristgetriebenen Übergänge (Uhr, Zeitlücke, Mengengrenze)
  zweck: Ein Uhrensprung, ein fehlerhaft gesetztes Datum oder ein Programmfehler darf nicht in einem einzigen Lauf viele Connections endgültig sperren oder widerrufen.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Sperrungen nach Fristablauf sind nicht wiederherstellbar und binden die Adresse für die Quarantäne; der Bestand kennt dafür keinen Schutz. Der Bewerter führt solche Übergänge nur bei synchronisierter Zeit, ohne unplausible Zeitlücke und unter einer Mengengrenze aus, stellt sie sonst zurück und meldet sie; die Freigabe ist eine protokollierte Betreiberhandlung. Die harte Frist selbst wird nicht verlängert.
  folgekosten: Ein Signal der Zeitbasis (BASE-060), drei Settings, eine Freigabehandlung im Panel (Klasse C).
  integriert_in: [base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-14, base/BASE-080_POLICY_APPLY_CORE/BASE-080_020_BEWERTUNG_UND_LIFECYCLE_LAUF.txt#7) SCHUTZ VOR UNUMKEHRBAREN MASSENFOLGEN]
  entdeckt_in: AP-K080
- id: VB-0024
  titel: Mengenbremse des Abgleichs für schließende Korrekturen ohne Auftrag
  zweck: Ein einzelner Datenfehler (Eingriff von Hand in SQL, zurückgespielte Sicherung, fehlerhafte Lesung) darf nicht in einem Abgleich viele Kunden trennen.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Jede ordentliche Sperrung trägt einen Auftrag. Findet der Abgleich viele schließende Abweichungen ohne Auftrag, ist der Zustand im Sinn von B052 (INVARIANT_BROKEN) nicht eindeutig; ohne Bremse würden alle betroffenen Peers und Sitzungen entfernt. Die Bremse stellt nur diese Handlungen zurück, öffnet nichts und verweigert keine ordentliche Sperrung; sie gilt auch für Einzelziele ohne Auftrag, damit die Zulassungswächter die zurückgestellte Korrektur nicht einzeln ausführen. Die Freigabe ist eine protokollierte Betreiberhandlung mit Angabe der gemeldeten Zahl.
  folgekosten: Zwei Settings, eine Marke, das Merkmal Herkunft im Auftragsbuch, eine Freigabehandlung im Panel (Klasse C). Solange die Bremse hält, können nicht mehr berechtigte Peers oder Sitzungen bestehen bleiben (im Modul offen ausgewiesen).
  integriert_in: [base/BASE-080_POLICY_APPLY_CORE/BASE-080_040_ABGLEICH_UND_SIEGEL.txt#7) MENGENBREMSE FUER SCHLIESSENDE KORREKTUREN OHNE AUFTRAG]
  entdeckt_in: AP-K080
- id: VB-0025
  titel: Halt der Bewertung durch den Betreiber und ausgewiesene Eingriffspfade je Automatismus
  zweck: Der Betreiber kann weitere automatische Entscheidungen (Einschränken, Freigeben, Fristfolgen) unterbinden, ohne die Durchsetzung des gespeicherten Zustands aufzugeben; für jeden Automatismus des Policy-Kerns ist benannt, wie er angestoßen, angehalten und überstimmt wird.
  einstufung: BETRIEBLICH_NOTWENDIG
  entscheidung: INTEGRIEREN
  begruendung: Der Phasenplan verlangt für jeden Automatismus einen Eingriffspfad (K-PH6-05, I-PH6-05) und nennt BASE-080 für die Mechanik; der Bestand beschreibt keine. Ein Fehler in den Eingaben der Bewertung (Plan-Daten, Buchung, Uhr) trifft viele Connections zugleich; ohne Halt bliebe nur das Stoppen von Diensten am System. Der Halt ist befristet, protokolliert und gemeldet und endet in die Ruhezeit. Die Durchsetzung erhält bewusst keinen Halt im Panel und keinen im Werkzeug - das wäre ein Weg, festgeschriebene Sperrungen wirkungslos zu machen.
  folgekosten: Eine Marke, ein Setting, drei Ereignisse, eine Handlung im Panel (Klasse C); Schreibwege müssen dem Bewerter den Akteur einer Handlung nennen (ANF-PA-01 f).
  integriert_in: [base/BASE-080_POLICY_APPLY_CORE/BASE-080_010_ARCHITEKTUR_UND_ENTSCHEIDUNGEN.txt#DEC-PA-23, base/BASE-080_POLICY_APPLY_CORE/BASE-080_020_BEWERTUNG_UND_LIFECYCLE_LAUF.txt#11) HALT DER BEWERTUNG DURCH DEN BETREIBER, base/BASE-080_POLICY_APPLY_CORE/BASE-080_070_HELFER_BETRIEB_UND_BEOBACHTBARKEIT.txt#9) EINGRIFFSPFADE DES BETREIBERS]
  entdeckt_in: AP-K080
